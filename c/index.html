  <style>
    /* 此页仅定义 C 语言题目布局；颜色、字体和导航沿用全站样式。 */
    :root { --sg-page-gutter:28px; }
    html { scroll-padding-top:94px; }
    body { min-height:100vh; }
    .site-shell { min-height:100vh; display:flex; flex-direction:column; }
    .site-header__inner { gap:20px; }
    .site-brand { font-weight:600; letter-spacing:-.012em; }
    .site-brand__mark { font-size:16px; font-weight:600; line-height:1; }
    .site-nav { gap:2px; }
    .site-nav__link { font-weight:500; }
    .site-nav__link[aria-current="page"] { font-weight:600; }
    .site-main { flex:1; padding-top:0; padding-bottom:76px; }
    .page-hero { margin:0; padding:64px 0 39px; border-bottom:1px solid var(--sg-line); }
    .page-title { font-weight:560; letter-spacing:-.018em; line-height:1.25; }
    .page-subtitle { margin:11px 0 0; color:var(--sg-ink-muted); font-size:14px; }
    .practice-section { padding-top:32px; }
    .section-heading { margin:0 0 19px; }
    .section-title { font-size:21px; font-weight:560; letter-spacing:-.018em; }
    .practice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; align-items:start; }
    .practice-card { overflow:hidden; border:1px solid var(--sg-line); border-radius:var(--sg-radius-card); background:var(--sg-surface-strong); box-shadow:var(--sg-shadow-xs); transition:border-color var(--sg-transition),box-shadow var(--sg-transition); }
    .practice-card:hover { border-color:var(--sg-line-strong); box-shadow:var(--sg-shadow-sm); }
    .practice-card__heading { display:flex; align-items:center; padding:18px 20px 15px; }
    .practice-card__title { margin:0; font-size:15px; line-height:1.5; letter-spacing:-.01em; font-weight:560; }
    .practice-card__image { margin:0 20px 20px; overflow:hidden; border:1px solid var(--sg-line); border-radius:var(--sg-radius-md); background:#fff; }
    .practice-card__image img { display:block; width:100%; height:auto; }
    .practice-answer { border-top:1px solid var(--sg-line); }
    .practice-answer summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:55px; padding:13px 20px; color:var(--sg-accent); font-size:14px; font-weight:550; line-height:1.5; cursor:pointer; user-select:none; transition:background var(--sg-transition),color var(--sg-transition); }
    .practice-answer summary::-webkit-details-marker { display:none; }
    .practice-answer summary:hover { background:var(--sg-accent-soft); }
    .practice-answer summary:focus-visible { outline:2px solid var(--sg-accent); outline-offset:-3px; }
    .answer-chevron { flex:none; width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform var(--sg-transition); }
    .practice-answer[open] .answer-chevron { transform:rotate(180deg); }
    .practice-answer[open] summary { border-bottom:1px solid var(--sg-line); }
    .practice-answer__body { padding:18px 20px 20px; background:var(--sg-surface-soft); }
    .practice-answer__image { margin:0; overflow:hidden; border:1px solid var(--sg-line); border-radius:var(--sg-radius-md); background:#fff; }
    .practice-answer__image img { display:block; width:100%; height:auto; }
    .site-footer__inner { justify-content:space-between; }
    .site-footer__links a { color:var(--sg-ink-secondary); }
    @media(max-width:1000px) {
      .site-header__inner { flex-wrap:wrap; padding-block:10px 8px; gap:5px 12px; }
      .site-brand { margin-right:auto; }
      .site-nav { flex:0 0 100%; order:3; justify-content:flex-start; overflow-x:auto; padding-bottom:3px; scrollbar-width:none; }
      .site-nav__link { min-height:36px; }
      html { scroll-padding-top:112px; }
      .page-hero { padding-top:48px; }
    }
    @media(max-width:767px) {
      :root { --sg-page-gutter:18px; }
      .site-main { padding-bottom:54px; }
      .page-hero { padding:36px 0 28px; }
      .practice-section { padding-top:26px; }
      .practice-grid { gap:14px; }
    }
    @media(max-width:620px) {
      .practice-grid { grid-template-columns:minmax(0,1fr); }
      .page-title { font-size:34px; }
      .section-title { font-size:19px; }
    }
    @media(max-width:430px) {
      :root { --sg-page-gutter:16px; }
      .site-header__inner { padding-block:8px 7px; }
      .site-nav__link { padding-inline:10px; }
      .page-hero { padding-top:30px; }
      .practice-card__heading { padding:15px 16px 13px; }
      .practice-card__image { margin:0 16px 16px; }
      .practice-answer summary { padding-inline:16px; min-height:52px; }
      .practice-answer__body { padding:14px 16px 16px; }
    }
    @media(prefers-reduced-motion:reduce) {
      .answer-chevron { transition:none; }
    }
  </style>

</head>
