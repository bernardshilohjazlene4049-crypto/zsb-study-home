<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1272.48" viewBox="0 0 1200 1272.48" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-6" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-6｜考试常讲“只用 that”的类型（限定性从句）</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1272.48" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">限定性从句优先 that</text>
<path d="M58 110 V1058.56" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="271.2" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="271.2" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">底稿规则信号</text>
<circle cx="128" cy="236" r="4" fill="#6c8da9"/>
<text x="144" y="242" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">先行词为 all/everything/nothing/anything 等或不被限定的不定代词</tspan>
</text>
<circle cx="128" cy="272.64" r="4" fill="#6c8da9"/>
<text x="144" y="278.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">先行词受到 all 等修饰</tspan>
</text>
<circle cx="128" cy="309.28" r="4" fill="#6c8da9"/>
<text x="144" y="315.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">被序数词 最高级 the only/the very 修饰</tspan>
</text>
<circle cx="128" cy="345.91999999999996" r="4" fill="#6c8da9"/>
<text x="144" y="351.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">先行词既有人又有物</tspan>
</text>
<circle cx="128" cy="382.55999999999995" r="4" fill="#6c8da9"/>
<text x="144" y="388.55999999999995" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">句首已有 who/which 时为避免重复</tspan>
</text>
<path d="M58 473.2 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="473.2" r="6" fill="#5e8aaf"/>
<rect x="90" y="445.2" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="445.2" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="483.2" font-size="23" fill="#234c69" font-weight="700">判断方法</text>
<circle cx="128" cy="529.2" r="4" fill="#6c8da9"/>
<text x="144" y="535.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">先确定是限定性从句且空处作主或宾语</tspan>
</text>
<circle cx="128" cy="565.84" r="4" fill="#6c8da9"/>
<text x="144" y="571.84" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">再检查上述信号</tspan>
</text>
<circle cx="128" cy="602.48" r="4" fill="#6c8da9"/>
<text x="144" y="608.48" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">此类考试习惯优先用 that</tspan>
</text>
<path d="M58 693.12 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="693.12" r="6" fill="#5e8aaf"/>
<rect x="90" y="665.12" width="1080" height="343.44" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="665.12" width="10" height="343.44" rx="5" fill="#4c8b83"/>
<text x="122" y="703.12" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="763.12" font-size="19" fill="#35756e" font-weight="700">课堂笔记原例</text>
<circle cx="152" cy="785.24" r="4" fill="#6c8da9"/>
<text x="168" y="791.24" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">all the books that you gave me</tspan>
</text>
<circle cx="152" cy="821.88" r="4" fill="#6c8da9"/>
<text x="168" y="827.88" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the teachers and schools that he had visited 名词短语</tspan>
</text>
<circle cx="152" cy="858.52" r="4" fill="#6c8da9"/>
<text x="168" y="864.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">Who is the person that is standing at the gate</tspan>
</text>
<text x="122" y="909.16" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="931.28" r="4" fill="#6c8da9"/>
<text x="168" y="937.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the first book that I read in English</tspan>
</text>
<circle cx="152" cy="967.92" r="4" fill="#6c8da9"/>
<text x="168" y="973.92" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the most useful method that I have learned</tspan>
</text>
<path d="M58 1058.56 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1058.56" r="6" fill="#5e8aaf"/>
<rect x="90" y="1030.56" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1030.56" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="1068.56" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1114.56" r="4" fill="#6c8da9"/>
<text x="144" y="1120.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">只能用 that 是传统应试归纳 不是绝对语言学禁令</tspan>
</text>
<circle cx="128" cy="1151.2" r="4" fill="#6c8da9"/>
<text x="144" y="1157.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">有些最高级结构也会出现 which</tspan>
</text>
<circle cx="128" cy="1187.8400000000001" r="4" fill="#6c8da9"/>
<text x="144" y="1193.8400000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">that 与 which 同时可接受且无附加限制时 需依题目语境及选项作答</tspan>
</text>
<text x="90" y="1262.48" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>