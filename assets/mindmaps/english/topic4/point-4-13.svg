<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1015.4" viewBox="0 0 1200 1015.4" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-13｜补充：关系从句里的数量结构与先行词隔离</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1015.4" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">数量结构与先行词隔离</text>
<path d="M58 110 V838.12" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="416.71999999999997" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="416.71999999999997" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">非限定从句常见数量结构</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">some of whom</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">many of which</tspan>
</text>
<circle cx="152" cy="345.4" r="4" fill="#6c8da9"/>
<text x="168" y="351.4" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">both of which</tspan>
</text>
<circle cx="152" cy="382.03999999999996" r="4" fill="#6c8da9"/>
<text x="168" y="388.03999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">one of which</tspan>
</text>
<circle cx="152" cy="418.67999999999995" r="4" fill="#6c8da9"/>
<text x="168" y="424.67999999999995" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">whom 指人  which 指物</tspan>
</text>
<text x="122" y="469.31999999999994" font-size="19" fill="#35756e" font-weight="700">先行词隔离</text>
<circle cx="152" cy="491.43999999999994" r="4" fill="#6c8da9"/>
<text x="168" y="497.43999999999994" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词与关系词之间也可能插入介词短语</tspan>
</text>
<circle cx="152" cy="528.0799999999999" r="4" fill="#6c8da9"/>
<text x="168" y="534.0799999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">不能简单当作紧邻关系词的名词就是先行词</tspan>
</text>
<path d="M58 618.72 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="618.72" r="6" fill="#5e8aaf"/>
<rect x="90" y="590.72" width="1080" height="197.4" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="590.72" width="10" height="197.4" rx="5" fill="#4c8b83"/>
<text x="122" y="628.72" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="688.72" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="710.84" r="4" fill="#6c8da9"/>
<text x="168" y="716.84" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">three classmates, two of whom live nearby</tspan>
</text>
<circle cx="152" cy="747.48" r="4" fill="#6c8da9"/>
<text x="168" y="753.48" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">two books, both of which were useful</tspan>
</text>
<path d="M58 838.12 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="838.12" r="6" fill="#5e8aaf"/>
<rect x="90" y="810.12" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="810.12" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="848.12" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="894.12" r="4" fill="#6c8da9"/>
<text x="144" y="900.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">two of them 若另起完整分句 一般需要连词或分号</tspan>
</text>
<circle cx="128" cy="930.76" r="4" fill="#6c8da9"/>
<text x="144" y="936.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">逗号连接非限定关系从句须用 two of whom/which</tspan>
</text>
<text x="90" y="1005.4" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>