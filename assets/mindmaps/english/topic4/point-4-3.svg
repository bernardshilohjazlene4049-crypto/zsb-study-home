<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1417.4800000000002" viewBox="0 0 1200 1417.4800000000002" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-3" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-3｜关系副词 when / where / why：关键看成分</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1417.4800000000002" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">关系副词看成分</text>
<path d="M58 110 V1203.5600000000002" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="416.2" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="416.2" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">when</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作时间状语</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">可对应 at/on/in/during + which</tspan>
</text>
<text x="122" y="359.4" font-size="19" fill="#35756e" font-weight="700">where</text>
<circle cx="152" cy="381.52" r="4" fill="#6c8da9"/>
<text x="168" y="387.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作地点或抽象地点状语</tspan>
</text>
<circle cx="152" cy="418.15999999999997" r="4" fill="#6c8da9"/>
<text x="168" y="424.15999999999997" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">可对应合适介词 + which</tspan>
</text>
<text x="122" y="468.79999999999995" font-size="19" fill="#35756e" font-weight="700">why</text>
<circle cx="152" cy="490.91999999999996" r="4" fill="#6c8da9"/>
<text x="168" y="496.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">修饰原因 reason</tspan>
</text>
<circle cx="152" cy="527.56" r="4" fill="#6c8da9"/>
<text x="168" y="533.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">常对应 for which</tspan>
</text>
<path d="M58 618.2 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="618.2" r="6" fill="#5e8aaf"/>
<rect x="90" y="590.2" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="590.2" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="628.2" font-size="23" fill="#234c69" font-weight="700">判断方法</text>
<circle cx="128" cy="674.2" r="4" fill="#6c8da9"/>
<text x="144" y="680.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">把先行词放回从句</tspan>
</text>
<circle cx="128" cy="710.84" r="4" fill="#6c8da9"/>
<text x="144" y="716.84" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">work in the factory 是地点状语 考虑 where/in which</tspan>
</text>
<circle cx="128" cy="747.48" r="4" fill="#6c8da9"/>
<text x="144" y="753.48" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">like the factory 是宾语 考虑 which/that</tspan>
</text>
<path d="M58 838.1200000000001 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="838.1200000000001" r="6" fill="#5e8aaf"/>
<rect x="90" y="810.1200000000001" width="1080" height="343.44" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="810.1200000000001" width="10" height="343.44" rx="5" fill="#4c8b83"/>
<text x="122" y="848.1200000000001" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="908.1200000000001" font-size="19" fill="#35756e" font-weight="700">课堂笔记原例</text>
<circle cx="152" cy="930.2400000000001" r="4" fill="#6c8da9"/>
<text x="168" y="936.2400000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the factory which/that I like 缺宾语</tspan>
</text>
<circle cx="152" cy="966.8800000000001" r="4" fill="#6c8da9"/>
<text x="168" y="972.8800000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the factory where I worked 缺地点状语</tspan>
</text>
<text x="122" y="1017.5200000000001" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="1039.64" r="4" fill="#6c8da9"/>
<text x="168" y="1045.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the day when we first met</tspan>
</text>
<circle cx="152" cy="1076.2800000000002" r="4" fill="#6c8da9"/>
<text x="168" y="1082.2800000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the reason why you were late</tspan>
</text>
<circle cx="152" cy="1112.9200000000003" r="4" fill="#6c8da9"/>
<text x="168" y="1118.9200000000003" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the place which we visited 缺宾语不用 where</tspan>
</text>
<path d="M58 1203.5600000000002 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1203.5600000000002" r="6" fill="#5e8aaf"/>
<rect x="90" y="1175.5600000000002" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1175.5600000000002" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="1213.5600000000002" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1259.5600000000002" r="4" fill="#6c8da9"/>
<text x="144" y="1265.5600000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">time/place/reason 不自动对应 when/where/why</tspan>
</text>
<circle cx="128" cy="1296.2000000000003" r="4" fill="#6c8da9"/>
<text x="144" y="1302.2000000000003" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">缺成分优先于先行词意义</tspan>
</text>
<circle cx="128" cy="1332.8400000000004" r="4" fill="#6c8da9"/>
<text x="144" y="1338.8400000000004" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">when 不必一律等于 in which 介词由原句搭配决定</tspan>
</text>
<text x="90" y="1407.4800000000002" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>