<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1089.2" viewBox="0 0 1200 1089.2" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-10" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-10｜one of / the only one of 的谓语一致</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1089.2" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">one of 与 the only one of</text>
<path d="M58 110 V838.64" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="234.56" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="234.56" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<circle cx="128" cy="236" r="4" fill="#6c8da9"/>
<text x="144" y="242" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">one of + 复数名词 + who/that + 复数谓语</tspan>
</text>
<circle cx="128" cy="272.64" r="4" fill="#6c8da9"/>
<text x="144" y="278.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">关系词通常指复数名词</tspan>
</text>
<circle cx="128" cy="309.28" r="4" fill="#6c8da9"/>
<text x="144" y="315.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the only one of + 复数名词 + who/that + 单数谓语</tspan>
</text>
<circle cx="128" cy="345.91999999999996" r="4" fill="#6c8da9"/>
<text x="144" y="351.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">通常指 the only one</tspan>
</text>
<path d="M58 436.56 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="436.56" r="6" fill="#5e8aaf"/>
<rect x="90" y="408.56" width="1080" height="380.08" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="408.56" width="10" height="380.08" rx="5" fill="#4c8b83"/>
<text x="122" y="446.56" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="506.56" font-size="19" fill="#35756e" font-weight="700">课堂笔记原题</text>
<circle cx="152" cy="528.6800000000001" r="4" fill="#6c8da9"/>
<text x="168" y="534.6800000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">Mulan is one of the best films ___ left a deep impression</tspan>
</text>
<circle cx="152" cy="565.32" r="4" fill="#6c8da9"/>
<text x="168" y="571.32" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">选项 A which has / B which have / C that have / D that has</tspan>
</text>
<circle cx="152" cy="601.96" r="4" fill="#6c8da9"/>
<text x="168" y="607.96" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">课堂考试规则答案 C</tspan>
</text>
<circle cx="152" cy="638.6" r="4" fill="#6c8da9"/>
<text x="168" y="644.6" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">best 后优先 that 先行词 films 为复数用 have</tspan>
</text>
<text x="122" y="689.24" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="711.36" r="4" fill="#6c8da9"/>
<text x="168" y="717.36" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">one of the students who work hard</tspan>
</text>
<circle cx="152" cy="748.0" r="4" fill="#6c8da9"/>
<text x="168" y="754.0" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the only one of the students who works hard</tspan>
</text>
<path d="M58 838.64 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="838.64" r="6" fill="#5e8aaf"/>
<rect x="90" y="810.64" width="1080" height="234.56" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="810.64" width="10" height="234.56" rx="5" fill="#4c8b83"/>
<text x="122" y="848.64" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="894.64" r="4" fill="#6c8da9"/>
<text x="144" y="900.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">one of 主句谓语通常为单数</tspan>
</text>
<circle cx="128" cy="931.28" r="4" fill="#6c8da9"/>
<text x="144" y="937.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">从句谓语要看关系词真正代替的对象</tspan>
</text>
<circle cx="128" cy="967.92" r="4" fill="#6c8da9"/>
<text x="144" y="973.92" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">不要混成一个规则</tspan>
</text>
<circle cx="128" cy="1004.56" r="4" fill="#6c8da9"/>
<text x="144" y="1010.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">题目还可能另外考时态</tspan>
</text>
<text x="90" y="1079.2" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
