<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1783.96" viewBox="0 0 1200 1783.96" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-8" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-8｜as / which 与 the same…as、such…as</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1783.96" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">as 与 which 及固定结构</text>
<path d="M58 110 V1496.76" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="416.2" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="416.2" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">as</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">常有正如之意</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">可置于句首 句中或句尾的非限定性从句</tspan>
</text>
<text x="122" y="359.4" font-size="19" fill="#35756e" font-weight="700">which</text>
<circle cx="152" cy="381.52" r="4" fill="#6c8da9"/>
<text x="168" y="387.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">指代前述整件事</tspan>
</text>
<circle cx="152" cy="418.15999999999997" r="4" fill="#6c8da9"/>
<text x="168" y="424.15999999999997" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">通常跟在相关内容后</tspan>
</text>
<text x="122" y="468.79999999999995" font-size="19" fill="#35756e" font-weight="700">固定关联</text>
<circle cx="152" cy="490.91999999999996" r="4" fill="#6c8da9"/>
<text x="168" y="496.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">such ... as ...</tspan>
</text>
<circle cx="152" cy="527.56" r="4" fill="#6c8da9"/>
<text x="168" y="533.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the same ... as ...</tspan>
</text>
<path d="M58 618.2 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="618.2" r="6" fill="#5e8aaf"/>
<rect x="90" y="590.2" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="590.2" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="628.2" font-size="23" fill="#234c69" font-weight="700">判断方法</text>
<circle cx="128" cy="674.2" r="4" fill="#6c8da9"/>
<text x="144" y="680.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">看有没有 the same/such/as/so 等固定结构</tspan>
</text>
<circle cx="128" cy="710.84" r="4" fill="#6c8da9"/>
<text x="144" y="716.84" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">或整句能否译成 正如……所知道或所预料的</tspan>
</text>
<path d="M58 801.48 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="801.48" r="6" fill="#5e8aaf"/>
<rect x="90" y="773.48" width="1080" height="307.84" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="773.48" width="10" height="307.84" rx="5" fill="#4c8b83"/>
<text x="122" y="811.48" font-size="23" fill="#234c69" font-weight="700">课堂笔记原短语</text>
<circle cx="128" cy="857.48" r="4" fill="#6c8da9"/>
<text x="144" y="863.48" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as we all know / as is known to all</tspan>
</text>
<circle cx="128" cy="894.12" r="4" fill="#6c8da9"/>
<text x="144" y="900.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as far as I know 据我所知</tspan>
</text>
<circle cx="128" cy="930.76" r="4" fill="#6c8da9"/>
<text x="144" y="936.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as far as I am concerned 就我而言</tspan>
</text>
<circle cx="128" cy="967.4" r="4" fill="#6c8da9"/>
<text x="144" y="973.4" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as we expect/see/think/suppose 时态可变化</tspan>
</text>
<circle cx="128" cy="1004.04" r="4" fill="#6c8da9"/>
<text x="144" y="1010.04" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as is often the case</tspan>
</text>
<circle cx="128" cy="1040.68" r="4" fill="#6c8da9"/>
<text x="144" y="1046.68" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">it is often the case that</tspan>
</text>
<path d="M58 1131.32 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1131.32" r="6" fill="#5e8aaf"/>
<rect x="90" y="1103.32" width="1080" height="343.44" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1103.32" width="10" height="343.44" rx="5" fill="#4c8b83"/>
<text x="122" y="1141.32" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="1201.32" font-size="19" fill="#35756e" font-weight="700">课堂笔记原例</text>
<circle cx="152" cy="1223.44" r="4" fill="#6c8da9"/>
<text x="168" y="1229.44" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the same dictionary as was used yesterday</tspan>
</text>
<circle cx="152" cy="1260.0800000000002" r="4" fill="#6c8da9"/>
<text x="168" y="1266.0800000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">底稿标 指向 D 但未提供完整选项 不据此还原试卷</tspan>
</text>
<text x="122" y="1310.7200000000003" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="1332.8400000000001" r="4" fill="#6c8da9"/>
<text x="168" y="1338.8400000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">As we all know, practice is important</tspan>
</text>
<circle cx="152" cy="1369.4800000000002" r="4" fill="#6c8da9"/>
<text x="168" y="1375.4800000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">She was late, which surprised us</tspan>
</text>
<circle cx="152" cy="1406.1200000000003" r="4" fill="#6c8da9"/>
<text x="168" y="1412.1200000000003" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">Such books as are useful should be kept</tspan>
</text>
<path d="M58 1496.76 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1496.76" r="6" fill="#5e8aaf"/>
<rect x="90" y="1468.76" width="1080" height="271.2" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1468.76" width="10" height="271.2" rx="5" fill="#4c8b83"/>
<text x="122" y="1506.76" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1552.76" r="4" fill="#6c8da9"/>
<text x="144" y="1558.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">such as 单独作例如时不是定从关系词结构</tspan>
</text>
<circle cx="128" cy="1589.4" r="4" fill="#6c8da9"/>
<text x="144" y="1595.4" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as far as I know 是范围固定短语 并非每次都算定从</tspan>
</text>
<circle cx="128" cy="1626.0400000000002" r="4" fill="#6c8da9"/>
<text x="144" y="1632.0400000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the same...that 可侧重同一个</tspan>
</text>
<circle cx="128" cy="1662.6800000000003" r="4" fill="#6c8da9"/>
<text x="144" y="1668.6800000000003" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the same...as 可侧重同类</tspan>
</text>
<circle cx="128" cy="1699.3200000000004" r="4" fill="#6c8da9"/>
<text x="144" y="1705.3200000000004" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">不能无条件认为 as 永远唯一正确</tspan>
</text>
<text x="90" y="1773.96" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>