<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1016.5199999999999" viewBox="0 0 1200 1016.5199999999999" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-5" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-5｜关系词何时能省略</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1016.5199999999999" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">关系词省略</text>
<path d="M58 110 V803.1199999999999" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">可以省略</text>
<circle cx="128" cy="236" r="4" fill="#6c8da9"/>
<text x="144" y="242" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">限定性定从里作宾语的 that/which/who/whom</tspan>
</text>
<circle cx="128" cy="272.64" r="4" fill="#6c8da9"/>
<text x="144" y="278.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">The film that we saw was interesting</tspan>
</text>
<path d="M58 363.28 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="363.28" r="6" fill="#5e8aaf"/>
<rect x="90" y="335.28" width="1080" height="234.56" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="335.28" width="10" height="234.56" rx="5" fill="#4c8b83"/>
<text x="122" y="373.28" font-size="23" fill="#234c69" font-weight="700">不能省略</text>
<circle cx="128" cy="419.28" r="4" fill="#6c8da9"/>
<text x="144" y="425.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">作主语时不能直接省</tspan>
</text>
<circle cx="128" cy="455.91999999999996" r="4" fill="#6c8da9"/>
<text x="144" y="461.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">The boy who won the race is my classmate</tspan>
</text>
<circle cx="128" cy="492.55999999999995" r="4" fill="#6c8da9"/>
<text x="144" y="498.55999999999995" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">非限定性定从的关系代词一般不能省</tspan>
</text>
<circle cx="128" cy="529.1999999999999" r="4" fill="#6c8da9"/>
<text x="144" y="535.1999999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">介词加 whom/which 的关系代词也不能省</tspan>
</text>
<path d="M58 619.8399999999999 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="619.8399999999999" r="6" fill="#5e8aaf"/>
<rect x="90" y="591.8399999999999" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="591.8399999999999" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="629.8399999999999" font-size="23" fill="#234c69" font-weight="700">判断方法</text>
<circle cx="128" cy="675.8399999999999" r="4" fill="#6c8da9"/>
<text x="144" y="681.8399999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">关系词后已有完整主语如 I met 往往是宾语空位</tspan>
</text>
<circle cx="128" cy="712.4799999999999" r="4" fill="#6c8da9"/>
<text x="144" y="718.4799999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">后面直接是谓语如 is wearing 通常缺主语 不可省</tspan>
</text>
<path d="M58 803.1199999999999 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="803.1199999999999" r="6" fill="#5e8aaf"/>
<rect x="90" y="775.1199999999999" width="1080" height="197.4" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="775.1199999999999" width="10" height="197.4" rx="5" fill="#4c8b83"/>
<text x="122" y="813.1199999999999" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="873.1199999999999" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="895.2399999999999" r="4" fill="#6c8da9"/>
<text x="168" y="901.2399999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The book which/that she bought 作宾语可省</tspan>
</text>
<circle cx="152" cy="931.8799999999999" r="4" fill="#6c8da9"/>
<text x="168" y="937.8799999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The book which belongs to her 作主语不可省</tspan>
</text>
<text x="90" y="1006.5199999999999" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>