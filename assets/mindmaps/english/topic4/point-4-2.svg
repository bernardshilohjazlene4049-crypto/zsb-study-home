<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1672.92" viewBox="0 0 1200 1672.92" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-2" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-2｜关系代词 who / whom / which / that / whose</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1672.92" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">关系代词选用</text>
<path d="M58 110 V1495.64" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="781.56" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="781.56" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">对应表</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">who</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词是人</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作主语 口语亦可作宾语</tspan>
</text>
<text x="122" y="359.4" font-size="19" fill="#35756e" font-weight="700">whom</text>
<circle cx="152" cy="381.52" r="4" fill="#6c8da9"/>
<text x="168" y="387.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词是人</tspan>
</text>
<circle cx="152" cy="418.15999999999997" r="4" fill="#6c8da9"/>
<text x="168" y="424.15999999999997" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作宾语 较正式</tspan>
</text>
<circle cx="152" cy="454.79999999999995" r="4" fill="#6c8da9"/>
<text x="168" y="460.79999999999995" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">介词前置后用 whom</tspan>
</text>
<text x="122" y="505.43999999999994" font-size="19" fill="#35756e" font-weight="700">which</text>
<circle cx="152" cy="527.56" r="4" fill="#6c8da9"/>
<text x="168" y="533.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词是物或事</tspan>
</text>
<circle cx="152" cy="564.1999999999999" r="4" fill="#6c8da9"/>
<text x="168" y="570.1999999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作主语或宾语</tspan>
</text>
<circle cx="152" cy="600.8399999999999" r="4" fill="#6c8da9"/>
<text x="168" y="606.8399999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">非限定时也可指前述整句</tspan>
</text>
<text x="122" y="651.4799999999999" font-size="19" fill="#35756e" font-weight="700">that</text>
<circle cx="152" cy="673.5999999999999" r="4" fill="#6c8da9"/>
<text x="168" y="679.5999999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词可以是人或物</tspan>
</text>
<circle cx="152" cy="710.2399999999999" r="4" fill="#6c8da9"/>
<text x="168" y="716.2399999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">限定性定从中作主语或宾语</tspan>
</text>
<circle cx="152" cy="746.8799999999999" r="4" fill="#6c8da9"/>
<text x="168" y="752.8799999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">不能置于介词后</tspan>
</text>
<circle cx="152" cy="783.5199999999999" r="4" fill="#6c8da9"/>
<text x="168" y="789.5199999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">不能引导非限定性定从</tspan>
</text>
<text x="122" y="834.1599999999999" font-size="19" fill="#35756e" font-weight="700">whose</text>
<circle cx="152" cy="856.2799999999999" r="4" fill="#6c8da9"/>
<text x="168" y="862.2799999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">先行词可以是人或物</tspan>
</text>
<circle cx="152" cy="892.9199999999998" r="4" fill="#6c8da9"/>
<text x="168" y="898.9199999999998" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">作所有格定语 后通常接名词</tspan>
</text>
<path d="M58 983.56 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="983.56" r="6" fill="#5e8aaf"/>
<rect x="90" y="955.56" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="955.56" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="993.56" font-size="23" fill="#234c69" font-weight="700">判断方法</text>
<circle cx="128" cy="1039.56" r="4" fill="#6c8da9"/>
<text x="144" y="1045.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">动词前没有主语 选 who which that</tspan>
</text>
<circle cx="128" cy="1076.2" r="4" fill="#6c8da9"/>
<text x="144" y="1082.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">动词已有主语但及物动词缺宾语 选 whom who which that</tspan>
</text>
<circle cx="128" cy="1112.8400000000001" r="4" fill="#6c8da9"/>
<text x="144" y="1118.8400000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">名词前缺谁的或哪个的 选 whose</tspan>
</text>
<path d="M58 1203.48 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1203.48" r="6" fill="#5e8aaf"/>
<rect x="90" y="1175.48" width="1080" height="270.16" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1175.48" width="10" height="270.16" rx="5" fill="#4c8b83"/>
<text x="122" y="1213.48" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="1273.48" font-size="19" fill="#35756e" font-weight="700">课堂笔记原例</text>
<circle cx="152" cy="1295.6" r="4" fill="#6c8da9"/>
<text x="168" y="1301.6" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The young man whom/that I met</tspan>
</text>
<text x="122" y="1346.24" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="1368.3600000000001" r="4" fill="#6c8da9"/>
<text x="168" y="1374.3600000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The girl whose mother is a doctor</tspan>
</text>
<circle cx="152" cy="1405.0000000000002" r="4" fill="#6c8da9"/>
<text x="168" y="1411.0000000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The house whose windows face south</tspan>
</text>
<path d="M58 1495.64 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1495.64" r="6" fill="#5e8aaf"/>
<rect x="90" y="1467.64" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="1467.64" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="1505.64" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1551.64" r="4" fill="#6c8da9"/>
<text x="144" y="1557.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">宾语不是只能用 whom</tspan>
</text>
<circle cx="128" cy="1588.2800000000002" r="4" fill="#6c8da9"/>
<text x="144" y="1594.2800000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">whose 也能修饰物</tspan>
</text>
<text x="90" y="1662.92" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>