<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1163.08" viewBox="0 0 1200 1163.08" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-9" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-9｜whose 与“……的”表达</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1163.08" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">whose 与所属表达</text>
<path d="M58 110 V949.16" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="234.56" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="234.56" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<circle cx="128" cy="236" r="4" fill="#6c8da9"/>
<text x="144" y="242" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">whose + 名词 表所属</tspan>
</text>
<circle cx="128" cy="272.64" r="4" fill="#6c8da9"/>
<text x="144" y="278.64" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">可以用于人也可以用于物</tspan>
</text>
<circle cx="128" cy="309.28" r="4" fill="#6c8da9"/>
<text x="144" y="315.28" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">较正式的物体结构可写成 the roof of which 或 of which the roof</tspan>
</text>
<circle cx="128" cy="345.91999999999996" r="4" fill="#6c8da9"/>
<text x="144" y="351.91999999999996" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">改写时必须保证整句结构成立</tspan>
</text>
<path d="M58 436.56 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="436.56" r="6" fill="#5e8aaf"/>
<rect x="90" y="408.56" width="1080" height="307.84" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="408.56" width="10" height="307.84" rx="5" fill="#4c8b83"/>
<text x="122" y="446.56" font-size="23" fill="#234c69" font-weight="700">课堂笔记原提示</text>
<circle cx="128" cy="492.56" r="4" fill="#6c8da9"/>
<text x="144" y="498.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">Tom&apos;s book 汤姆的书</tspan>
</text>
<circle cx="128" cy="529.2" r="4" fill="#6c8da9"/>
<text x="144" y="535.2" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">Bank of China 中国银行</tspan>
</text>
<circle cx="128" cy="565.84" r="4" fill="#6c8da9"/>
<text x="144" y="571.84" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the key to the house 房子的钥匙</tspan>
</text>
<circle cx="128" cy="602.48" r="4" fill="#6c8da9"/>
<text x="144" y="608.48" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">A of B = B 的 A</tspan>
</text>
<circle cx="128" cy="639.12" r="4" fill="#6c8da9"/>
<text x="144" y="645.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">A of B of C = C 的 B 的 A 辅助汉语理解 不是所有 of 都可逐层反译</tspan>
</text>
<circle cx="128" cy="675.76" r="4" fill="#6c8da9"/>
<text x="144" y="681.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">whose father = the father of whom 替换时要连同介词和句序一起改写</tspan>
</text>
<path d="M58 766.4 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="766.4" r="6" fill="#5e8aaf"/>
<rect x="90" y="738.4" width="1080" height="160.76" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="738.4" width="10" height="160.76" rx="5" fill="#4c8b83"/>
<text x="122" y="776.4" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="836.4" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="858.52" r="4" fill="#6c8da9"/>
<text x="168" y="864.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">The student whose phone was lost</tspan>
</text>
<path d="M58 949.16 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="949.16" r="6" fill="#5e8aaf"/>
<rect x="90" y="921.16" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="921.16" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="959.16" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1005.16" r="4" fill="#6c8da9"/>
<text x="144" y="1011.16" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the key to the door 用 to 不是所有的都对应 of</tspan>
</text>
<circle cx="128" cy="1041.8" r="4" fill="#6c8da9"/>
<text x="144" y="1047.8" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">不能单看中文的就选 whose</tspan>
</text>
<circle cx="128" cy="1078.44" r="4" fill="#6c8da9"/>
<text x="144" y="1084.44" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">须看后面有没有名词且从句缺所有格定语</tspan>
</text>
<text x="90" y="1153.08" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>