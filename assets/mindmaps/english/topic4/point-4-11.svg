<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1235.3200000000002" viewBox="0 0 1200 1235.3200000000002" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-11" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-11｜the way / case / situation / point / stage 等特殊先行词</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="1235.3200000000002" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">特殊先行词 the way 等</text>
<path d="M58 110 V1021.4000000000001" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="343.44" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="343.44" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">the way</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">表方式且从句缺方式状语</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">常用 in which / that / 省略</tspan>
</text>
<text x="122" y="359.4" font-size="19" fill="#35756e" font-weight="700">case situation point stage</text>
<circle cx="152" cy="381.52" r="4" fill="#6c8da9"/>
<text x="168" y="387.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">表抽象情境或阶段且从句缺相应状语</tspan>
</text>
<circle cx="152" cy="418.15999999999997" r="4" fill="#6c8da9"/>
<text x="168" y="424.15999999999997" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">常用 where / in which</tspan>
</text>
<circle cx="128" cy="454.79999999999995" r="4" fill="#6c8da9"/>
<text x="144" y="460.79999999999995" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">若从句缺宾语 仍选关系代词</tspan>
</text>
<path d="M58 545.44 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="545.44" r="6" fill="#5e8aaf"/>
<rect x="90" y="517.44" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="517.44" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="555.44" font-size="23" fill="#234c69" font-weight="700">课堂笔记原提示</text>
<circle cx="128" cy="601.44" r="4" fill="#6c8da9"/>
<text x="144" y="607.44" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the way 作先行词 可用 in which that 或省略</tspan>
</text>
<circle cx="128" cy="638.08" r="4" fill="#6c8da9"/>
<text x="144" y="644.08" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">the case / situation 用 where</tspan>
</text>
<circle cx="128" cy="674.72" r="4" fill="#6c8da9"/>
<text x="144" y="680.72" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">case = box 盒子  pencil case 铅笔盒</tspan>
</text>
<path d="M58 765.3600000000001 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="765.3600000000001" r="6" fill="#5e8aaf"/>
<rect x="90" y="737.3600000000001" width="1080" height="234.04000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="737.3600000000001" width="10" height="234.04000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="775.3600000000001" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="835.3600000000001" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="857.4800000000001" r="4" fill="#6c8da9"/>
<text x="168" y="863.4800000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the way that/in which she explains grammar</tspan>
</text>
<circle cx="152" cy="894.1200000000001" r="4" fill="#6c8da9"/>
<text x="168" y="900.1200000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">a situation where patience matters</tspan>
</text>
<circle cx="152" cy="930.7600000000001" r="4" fill="#6c8da9"/>
<text x="168" y="936.7600000000001" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">the way that/which she recommended 缺宾语不能用 in which</tspan>
</text>
<path d="M58 1021.4000000000001 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="1021.4000000000001" r="6" fill="#5e8aaf"/>
<rect x="90" y="993.4000000000001" width="1080" height="197.92000000000002" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="993.4000000000001" width="10" height="197.92000000000002" rx="5" fill="#4c8b83"/>
<text x="122" y="1031.4" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="1077.4" r="4" fill="#6c8da9"/>
<text x="144" y="1083.4" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">只凭 the way 就永远选 in which 会失误</tspan>
</text>
<circle cx="128" cy="1114.0400000000002" r="4" fill="#6c8da9"/>
<text x="144" y="1120.0400000000002" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">where 不必对应物理地点</tspan>
</text>
<circle cx="128" cy="1150.6800000000003" r="4" fill="#6c8da9"/>
<text x="144" y="1156.6800000000003" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">但应表达抽象 在……情况下</tspan>
</text>
<text x="90" y="1225.3200000000002" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>