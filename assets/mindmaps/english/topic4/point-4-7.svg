<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="978.24" viewBox="0 0 1200 978.24" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="english.attributive.basics" data-point-id="point-4-7" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 4-7｜不能用 that：非限定性与介词前置</title>
<desc id="svg-desc">依据已交付专题四导图源稿生成的本地静态思维导图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7892ad"/></marker></defs>
<rect width="1200" height="978.24" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="77" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">不能用 that 的情形</text>
<path d="M58 110 V800.96" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<path d="M58 180 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="180" r="6" fill="#5e8aaf"/>
<rect x="90" y="152" width="1080" height="306.8" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="152" width="10" height="306.8" rx="5" fill="#4c8b83"/>
<text x="122" y="190" font-size="23" fill="#234c69" font-weight="700">规则</text>
<text x="122" y="250" font-size="19" fill="#35756e" font-weight="700">非限定性定从</text>
<circle cx="152" cy="272.12" r="4" fill="#6c8da9"/>
<text x="168" y="278.12" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">可用 who/whom/which/whose/when/where 等</tspan>
</text>
<circle cx="152" cy="308.76" r="4" fill="#6c8da9"/>
<text x="168" y="314.76" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">不用 that</tspan>
</text>
<text x="122" y="359.4" font-size="19" fill="#35756e" font-weight="700">介词前置</text>
<circle cx="152" cy="381.52" r="4" fill="#6c8da9"/>
<text x="168" y="387.52" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">of which / to whom 正确</tspan>
</text>
<circle cx="152" cy="418.15999999999997" r="4" fill="#6c8da9"/>
<text x="168" y="424.15999999999997" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">of that / to that 不作标准关系结构</tspan>
</text>
<path d="M58 508.8 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="508.8" r="6" fill="#5e8aaf"/>
<rect x="90" y="480.8" width="1080" height="270.16" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="480.8" width="10" height="270.16" rx="5" fill="#4c8b83"/>
<text x="122" y="518.8" font-size="23" fill="#234c69" font-weight="700">例句来源</text>
<text x="122" y="578.8" font-size="19" fill="#35756e" font-weight="700">课堂笔记原例</text>
<circle cx="152" cy="600.92" r="4" fill="#6c8da9"/>
<text x="168" y="606.92" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">Football, which is a popular game</tspan>
</text>
<circle cx="152" cy="637.56" r="4" fill="#6c8da9"/>
<text x="168" y="643.56" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">He failed in the exam, which made his father angry 指前面整件事</tspan>
</text>
<text x="122" y="688.1999999999999" font-size="19" fill="#35756e" font-weight="700">补充例句</text>
<circle cx="152" cy="710.3199999999999" r="4" fill="#6c8da9"/>
<text x="168" y="716.3199999999999" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="168" dy="0.0">I met Ms. Li, who taught me English</tspan>
</text>
<path d="M58 800.96 H78" fill="none" stroke="#8ea6bf" stroke-width="2.5"/>
<circle cx="58" cy="800.96" r="6" fill="#5e8aaf"/>
<rect x="90" y="772.96" width="1080" height="161.28" rx="16" fill="#fff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="90" y="772.96" width="10" height="161.28" rx="5" fill="#4c8b83"/>
<text x="122" y="810.96" font-size="23" fill="#234c69" font-weight="700">易错点</text>
<circle cx="128" cy="856.96" r="4" fill="#6c8da9"/>
<text x="144" y="862.96" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">指整句话时 which 可引导后置非限定性从句</tspan>
</text>
<circle cx="128" cy="893.6" r="4" fill="#6c8da9"/>
<text x="144" y="899.6" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start">
<tspan x="144" dy="0.0">as 也可指整句 但位置和语义不同 见 4-8</tspan>
</text>
<text x="90" y="968.24" font-size="13" fill="#718196">专题四 · 定语从句 · 本点思维导图</text>
</svg>