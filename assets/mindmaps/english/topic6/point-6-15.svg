<rect x="42" y="592.0" width="210" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="629.0" font-size="18" font-weight="700" fill="#fff">as though 让步前置</text>
<rect x="286" y="192.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="229.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="610" y="112.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="149.0" font-size="18" font-weight="500" fill="#20334f">让步意义的 as 有时 though 常前置表语 状语或动词原形</text>
<rect x="610" y="192.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="229.0" font-size="18" font-weight="500" fill="#20334f">形容词/副词/名词/动词原形 + as + 主语 + 谓语</text>
<rect x="610" y="272.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="309.0" font-size="18" font-weight="500" fill="#20334f">名词单数表语前置通常去掉冠词</text>
<rect x="286" y="472.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="509.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原改写 非完整独立句</text>
<rect x="610" y="352.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="389.0" font-size="18" font-weight="500" fill="#20334f">As she is rich 改成 Rich as she is</text>
<rect x="610" y="432.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="469.0" font-size="18" font-weight="500" fill="#20334f">As he is a boy 改成 Boy as he is 前置名词去冠词</text>
<rect x="610" y="512.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="549.0" font-size="18" font-weight="500" fill="#20334f">As he runs fast 改成 Fast as he runs</text>
<rect x="610" y="592.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="629.0" font-size="18" font-weight="500" fill="#20334f">As he might try 改成 Try as he might</text>
<rect x="286" y="752.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="789.0" font-size="18" font-weight="700" fill="#20334f">补充完整例句</text>
<rect x="610" y="672.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="709.0" font-size="18" font-weight="500" fill="#20334f">Young as she is, she has much experience</text>
<rect x="610" y="752.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="789.0" font-size="18" font-weight="500" fill="#20334f">Child as he is, he understands the problem</text>
<rect x="610" y="832.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="869.0" font-size="18" font-weight="500" fill="#20334f">Hard as he tried, he couldn&#x27;t lift it</text>
<rect x="286" y="992.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="1029.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="610" y="912.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="949.0" font-size="18" font-weight="500" fill="#20334f">不是所有 as 都要倒装</text>
<rect x="610" y="992.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1029.0" font-size="18" font-weight="500" fill="#20334f">as 表因为 当……时 按照 和……一样 时结构不同</text>
<rect x="610" y="1072.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1109.0" font-size="18" font-weight="500" fill="#20334f">此类前置不等同于否定词前置的助动词部分倒装</text>
