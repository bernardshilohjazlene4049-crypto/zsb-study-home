<rect x="42" y="776.0" width="190" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="813.0" font-size="18" font-weight="700" fill="#fff">原因状语从句</text>
<rect x="266" y="272.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="309.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="112.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="149.0" font-size="18" font-weight="500" fill="#20334f">because</text>
<rect x="894" y="112.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="149.0" font-size="18" font-weight="500" fill="#20334f">通常直接给出原因</text>
<rect x="530" y="232.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="269.0" font-size="18" font-weight="500" fill="#20334f">since / as</text>
<rect x="894" y="192.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="229.0" font-size="18" font-weight="500" fill="#20334f">可表示既然或由于</text>
<rect x="894" y="272.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="309.0" font-size="18" font-weight="500" fill="#20334f">往往把原因作为对方已知或背景信息</text>
<rect x="530" y="352.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="389.0" font-size="18" font-weight="500" fill="#20334f">now that</text>
<rect x="894" y="352.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="389.0" font-size="18" font-weight="500" fill="#20334f">既然 情况已成事实</text>
<rect x="530" y="432.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="469.0" font-size="18" font-weight="500" fill="#20334f">in that</text>
<rect x="894" y="432.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="469.0" font-size="18" font-weight="500" fill="#20334f">在于 或 因为某方面 较书面</text>
<rect x="266" y="680.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="717.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原短语与存疑</text>
<rect x="530" y="512.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="544.5" font-size="18" font-weight="500" fill="#20334f">because / since / now that / in</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="569.5" font-size="18" font-weight="500" fill="#20334f">that 因为</text>
<rect x="530" y="608.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="645.0" font-size="18" font-weight="500" fill="#20334f">as 也可用于原因</text>
<rect x="530" y="688.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="725.0" font-size="18" font-weight="500" fill="#20334f">红字存疑 结果 — 因为 — 原因</text>
<rect x="530" y="768.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="805.0" font-size="18" font-weight="500" fill="#20334f">原因 — 因为【存疑】— 结果</text>
<rect x="530" y="848.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="885.0" font-size="18" font-weight="500" fill="#20334f">保留原文 不据此记忆第二行的因为</text>
<rect x="266" y="1008.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1045.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="1008.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1045.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="928.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="965.0" font-size="18" font-weight="500" fill="#20334f">He stayed at home because he was ill</text>
<rect x="894" y="1008.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1045.0" font-size="18" font-weight="500" fill="#20334f">Now that you have finished, you can rest</text>
<rect x="894" y="1088.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1125.0" font-size="18" font-weight="500" fill="#20334f">The plan is useful in that it saves time</text>
<rect x="266" y="1304.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1341.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1168.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1205.0" font-size="18" font-weight="500" fill="#20334f">因果词并非随意互换</text>
<rect x="530" y="1248.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1285.0" font-size="18" font-weight="500" fill="#20334f">because 是从属连词 引出原因从句</text>
<rect x="530" y="1328.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1360.5" font-size="18" font-weight="500" fill="#20334f">because of + 名词或动名词</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1385.5" font-size="18" font-weight="500" fill="#20334f">是介词短语</text>
<rect x="530" y="1424.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1456.5" font-size="18" font-weight="500" fill="#20334f">不要受汉语位置口诀束缚</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1481.5" font-size="18" font-weight="500" fill="#20334f">仍以真实逻辑为准</text>
</svg>
