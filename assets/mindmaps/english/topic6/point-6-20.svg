<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="445.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="368.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="405.0" font-size="18" font-weight="500" fill="#20334f">Where there is a will, there is a way</text>
<rect x="894" y="448.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="485.0" font-size="18" font-weight="500" fill="#20334f">You may sit wherever you like</text>
<rect x="530" y="568.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="605.0" font-size="18" font-weight="500" fill="#20334f">补充对比</text>
<rect x="894" y="528.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="565.0" font-size="18" font-weight="500" fill="#20334f">This is the café where we met</text>
<rect x="894" y="608.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="645.0" font-size="18" font-weight="500" fill="#20334f">有先行词 café 是定语从句</text>
<rect x="266" y="736.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="773.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="688.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="725.0" font-size="18" font-weight="500" fill="#20334f">不能把所有 where 当地点定从</text>
<rect x="530" y="768.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="800.5" font-size="18" font-weight="500" fill="#20334f">关键是整个从句修饰名词</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="825.5" font-size="18" font-weight="500" fill="#20334f">还是充当地点状语</text>
