<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="497.5" font-size="18" font-weight="700" fill="#fff">wherever</text>
<rect x="266" y="200.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="237.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="112.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="149.0" font-size="18" font-weight="500" fill="#20334f">where 可表示在……的地方</text>
<rect x="530" y="192.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="229.0" font-size="18" font-weight="500" fill="#20334f">wherever 表无论哪里或任何地方</text>
<rect x="530" y="272.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="304.5" font-size="18" font-weight="500" fill="#20334f">如果前面有名词作被修饰对象</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="329.5" font-size="18" font-weight="500" fill="#20334f">可能是定语从句 须分清</text>
<rect x="266" y="488.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="525.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
