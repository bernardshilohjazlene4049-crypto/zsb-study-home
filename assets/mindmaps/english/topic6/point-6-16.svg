<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="550.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原口诀</text>
<rect x="530" y="425.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="457.5" font-size="18" font-weight="500" fill="#20334f">no matter + 特殊疑问词 = wh +</text>
