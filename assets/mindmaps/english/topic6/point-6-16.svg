<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="953.5" font-size="18" font-weight="500" fill="#20334f">however + 形容词或副词 + 主语 +</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="978.5" font-size="18" font-weight="500" fill="#20334f">谓语</text>
