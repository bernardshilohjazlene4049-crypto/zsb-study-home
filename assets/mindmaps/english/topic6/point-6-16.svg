<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1054.0" font-size="18" font-weight="500" fill="#20334f">However difficult it is</text>
<rect x="530" y="1097.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1129.5" font-size="18" font-weight="500" fill="#20334f">不能直接把 however</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1154.5" font-size="18" font-weight="500" fill="#20334f">当普通程度副词 very 使用</text>
