<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="240.5" font-size="18" font-weight="500" fill="#20334f">常可换成</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="265.5" font-size="18" font-weight="500" fill="#20334f">whoever/whatever/whenever/wher</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="290.5" font-size="18" font-weight="500" fill="#20334f">ever/however</text>
<rect x="530" y="329.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="361.5" font-size="18" font-weight="500" fill="#20334f">但在名词性主语或宾语从句中不能随</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="386.5" font-size="18" font-weight="500" fill="#20334f">意替换</text>
