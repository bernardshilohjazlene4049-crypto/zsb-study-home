<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="558.0" font-size="18" font-weight="500" fill="#20334f">no matter who = whoever</text>
<rect x="530" y="601.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
