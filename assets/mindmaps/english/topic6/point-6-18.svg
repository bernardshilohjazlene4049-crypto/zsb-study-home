<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="629.0" font-size="18" font-weight="500" fill="#20334f">It looks as if it is going to rain 较真实的判断</text>
<rect x="894" y="672.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="709.0" font-size="18" font-weight="500" fill="#20334f">He talks as if he knew everything 与实际有距离的假设</text>
