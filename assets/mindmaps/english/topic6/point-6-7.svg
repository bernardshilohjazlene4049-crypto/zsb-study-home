<rect x="42" y="736.0" width="190" height="78" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="768.5" font-size="18" font-weight="700" fill="#fff">if unless</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="793.5" font-size="18" font-weight="700" fill="#fff">与主将从现</text>
<rect x="266" y="352.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="389.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="152.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="189.0" font-size="18" font-weight="500" fill="#20334f">真实条件</text>
<rect x="894" y="112.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="149.0" font-size="18" font-weight="500" fill="#20334f">If + 一般现在时</text>
<rect x="894" y="192.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="229.0" font-size="18" font-weight="500" fill="#20334f">主句将来时 祈使句或情态动词</text>
<rect x="530" y="352.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="389.0" font-size="18" font-weight="500" fill="#20334f">unless</text>
<rect x="894" y="272.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="309.0" font-size="18" font-weight="500" fill="#20334f">约等于 if ... not</text>
<rect x="894" y="352.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="389.0" font-size="18" font-weight="500" fill="#20334f">除非 或不如果</text>
<rect x="894" y="432.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="469.0" font-size="18" font-weight="500" fill="#20334f">要注意双重否定</text>
<rect x="530" y="512.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="549.0" font-size="18" font-weight="500" fill="#20334f">if 还可引导表是否的宾语从句</text>
<rect x="530" y="592.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="629.0" font-size="18" font-weight="500" fill="#20334f">此时不使用主将从现规则</text>
<rect x="266" y="760.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="797.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原提示</text>
<rect x="530" y="672.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="709.0" font-size="18" font-weight="500" fill="#20334f">if 如果或是否</text>
<rect x="530" y="752.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="789.0" font-size="18" font-weight="500" fill="#20334f">unless 如果不 等于 if not</text>
<rect x="530" y="832.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="864.5" font-size="18" font-weight="500" fill="#20334f">if 的三种考点 真实条件 虚拟条件</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="889.5" font-size="18" font-weight="500" fill="#20334f">名词性从句</text>
<rect x="266" y="1008.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1045.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="1008.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1045.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="928.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="965.0" font-size="18" font-weight="500" fill="#20334f">If it rains tomorrow, we will stay home</text>
<rect x="894" y="1008.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1045.0" font-size="18" font-weight="500" fill="#20334f">Unless you work hard, you will not improve</text>
<rect x="894" y="1088.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1125.0" font-size="18" font-weight="500" fill="#20334f">I don&#x27;t know if it will rain tomorrow 宾语从句里 will rain 合理</text>
<rect x="266" y="1272.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1309.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1168.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1200.5" font-size="18" font-weight="500" fill="#20334f">不要把 unless</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1225.5" font-size="18" font-weight="500" fill="#20334f">后再加否定而造成意义相反</text>
<rect x="530" y="1264.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1296.5" font-size="18" font-weight="500" fill="#20334f">主将从现也常用于 when/as soon</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1321.5" font-size="18" font-weight="500" fill="#20334f">as/until 等时间从句</text>
<rect x="530" y="1360.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1392.5" font-size="18" font-weight="500" fill="#20334f">不是所有含将来事件的从句都一律禁</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1417.5" font-size="18" font-weight="500" fill="#20334f">用 will</text>
