<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="144.5" font-size="18" font-weight="500" fill="#20334f">so that / in order that +</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="169.5" font-size="18" font-weight="500" fill="#20334f">完整主谓句</text>
<rect x="530" y="208.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="245.0" font-size="18" font-weight="500" fill="#20334f">常与 can/could/may/might 连用</text>
<rect x="266" y="288.0" width="230" height="78" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="320.5" font-size="18" font-weight="700" fill="#20334f">不定式目的</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="345.5" font-size="18" font-weight="700" fill="#20334f">不是状语从句</text>
<rect x="530" y="288.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="325.0" font-size="18" font-weight="500" fill="#20334f">in order to / so as to + 动词原形</text>
<rect x="266" y="424.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="461.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原提示</text>
<rect x="530" y="384.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="421.0" font-size="18" font-weight="500" fill="#20334f">in order that + 句子 主谓</text>
<rect x="530" y="464.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="501.0" font-size="18" font-weight="500" fill="#20334f">in order to + do</text>
<rect x="266" y="624.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="661.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="624.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="661.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="544.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="581.0" font-size="18" font-weight="500" fill="#20334f">He got up early so that he could catch the bus</text>
<rect x="894" y="624.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="661.0" font-size="18" font-weight="500" fill="#20334f">She saved money in order to buy a computer</text>
<rect x="894" y="704.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="741.0" font-size="18" font-weight="500" fill="#20334f">They spoke slowly in order that everyone could understand</text>
<rect x="266" y="832.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="869.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="784.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="821.0" font-size="18" font-weight="500" fill="#20334f">so that 还能表示结果 要结合上下文</text>
<rect x="530" y="864.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="896.5" font-size="18" font-weight="500" fill="#20334f">in order to</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="921.5" font-size="18" font-weight="500" fill="#20334f">后不能直接接主语加谓语的完整句</text>
