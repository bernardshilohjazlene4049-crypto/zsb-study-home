<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1333.0" font-size="18" font-weight="500" fill="#20334f">As soon as I got home, I called my mother 先到家后打电话</text>
<rect x="894" y="1376.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1413.0" font-size="18" font-weight="500" fill="#20334f">Hardly had I sat down when the bell rang</text>
<rect x="894" y="1456.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1493.0" font-size="18" font-weight="500" fill="#20334f">No sooner had she finished the test than she left</text>
<rect x="894" y="1536.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1573.0" font-size="18" font-weight="500" fill="#20334f">The moment he saw the message, he replied</text>
<rect x="266" y="1764.5" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1801.5" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1616.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1653.0" font-size="18" font-weight="500" fill="#20334f">hardly 配 when  no sooner 配 than</text>
<rect x="530" y="1696.0" width="330" height="103" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1728.5" font-size="18" font-weight="500" fill="#20334f">as soon as</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1753.5" font-size="18" font-weight="500" fill="#20334f">句里按从句实际动作确定先后</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1778.5" font-size="18" font-weight="500" fill="#20334f">不是主句一定先发生</text>
<rect x="530" y="1817.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1849.5" font-size="18" font-weight="500" fill="#20334f">时间状语从句里表将来通常用一般现</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1874.5" font-size="18" font-weight="500" fill="#20334f">在时代替 will</text>
<rect x="530" y="1913.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1950.0" font-size="18" font-weight="500" fill="#20334f">I will call you as soon as I arrive</text>
