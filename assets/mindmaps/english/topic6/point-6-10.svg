<rect x="42" y="572.5" width="190" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="609.5" font-size="18" font-weight="700" fill="#fff">in case lest 以防</text>
<rect x="266" y="228.5" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="265.5" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="112.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="144.5" font-size="18" font-weight="500" fill="#20334f">in case 用于以防某事发生</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="169.5" font-size="18" font-weight="500" fill="#20334f">常接陈述语气</text>
<rect x="530" y="208.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="240.5" font-size="18" font-weight="500" fill="#20334f">lest 文体较正式 后可用 should +</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="265.5" font-size="18" font-weight="500" fill="#20334f">动词原形</text>
<rect x="530" y="304.0" width="330" height="103" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="336.5" font-size="18" font-weight="500" fill="#20334f">for fear that 表唯恐 可用</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="361.5" font-size="18" font-weight="500" fill="#20334f">might/should</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="386.5" font-size="18" font-weight="500" fill="#20334f">等或依情境使用其他语气</text>
<rect x="266" y="473.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="510.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原短语</text>
<rect x="530" y="425.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="457.5" font-size="18" font-weight="500" fill="#20334f">in case / lest / for fear that</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="482.5" font-size="18" font-weight="500" fill="#20334f">以防</text>
<rect x="530" y="521.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="558.0" font-size="18" font-weight="500" fill="#20334f">底稿强调 should do 和状从</text>
<rect x="266" y="681.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="718.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="681.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="718.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="601.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="638.0" font-size="18" font-weight="500" fill="#20334f">Take an umbrella in case it rains</text>
<rect x="894" y="681.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="718.0" font-size="18" font-weight="500" fill="#20334f">He spoke quietly for fear that he might wake the baby</text>
<rect x="894" y="761.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="798.0" font-size="18" font-weight="500" fill="#20334f">She took notes lest she should forget the details</text>
<rect x="266" y="937.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="974.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="841.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="873.5" font-size="18" font-weight="500" fill="#20334f">不能说 in case 只能接虚拟 should</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="898.5" font-size="18" font-weight="500" fill="#20334f">do</text>
<rect x="530" y="937.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="969.5" font-size="18" font-weight="500" fill="#20334f">in case of + 名词 与 in case + 句子</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="994.5" font-size="18" font-weight="500" fill="#20334f">结构不同</text>
<rect x="530" y="1033.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1070.0" font-size="18" font-weight="500" fill="#20334f">in case of fire 一旦起火</text>
