<rect x="42" y="708.5" width="190" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="745.5" font-size="18" font-weight="700" fill="#fff">when while as</text>
<rect x="266" y="272.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="309.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="152.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="189.0" font-size="18" font-weight="500" fill="#20334f">when</text>
<rect x="894" y="112.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="149.0" font-size="18" font-weight="500" fill="#20334f">能指某一时点或时间段</text>
<rect x="894" y="192.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="229.0" font-size="18" font-weight="500" fill="#20334f">搭配瞬间或持续动作</text>
<rect x="530" y="312.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="349.0" font-size="18" font-weight="500" fill="#20334f">while</text>
<rect x="894" y="272.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="309.0" font-size="18" font-weight="500" fill="#20334f">典型表示在一段持续时间内</text>
<rect x="894" y="352.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="389.0" font-size="18" font-weight="500" fill="#20334f">也可表然而或虽然</text>
<rect x="530" y="432.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="469.0" font-size="18" font-weight="500" fill="#20334f">as</text>
<rect x="894" y="432.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="469.0" font-size="18" font-weight="500" fill="#20334f">常强调两个动作同步发生或逐渐变化</text>
<rect x="266" y="752.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="789.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="592.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="629.0" font-size="18" font-weight="500" fill="#20334f">课堂笔记原例</text>
<rect x="894" y="512.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="549.0" font-size="18" font-weight="500" fill="#20334f">Don&#x27;t talk when you eat</text>
<rect x="894" y="592.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="629.0" font-size="18" font-weight="500" fill="#20334f">Don&#x27;t talk while you are eating</text>
<rect x="894" y="672.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="709.0" font-size="18" font-weight="500" fill="#20334f">Don&#x27;t talk while eating 同主语时省略 you are</text>
<rect x="530" y="872.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="909.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="752.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="789.0" font-size="18" font-weight="500" fill="#20334f">When I entered, she was reading</text>
<rect x="894" y="832.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="869.0" font-size="18" font-weight="500" fill="#20334f">While I was writing, the phone rang</text>
<rect x="894" y="912.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="949.0" font-size="18" font-weight="500" fill="#20334f">As time went by, he became more confident</text>
<rect x="894" y="992.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1029.0" font-size="18" font-weight="500" fill="#20334f">I like tea, while my sister prefers coffee</text>
<rect x="266" y="1188.5" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1225.5" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1072.0" width="330" height="103" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1104.5" font-size="18" font-weight="500" fill="#20334f">底稿将 when + 一般时  while +</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1129.5" font-size="18" font-weight="500" fill="#20334f">进行时 作为快速入门标记</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1154.5" font-size="18" font-weight="500" fill="#20334f">不是绝对搭配</text>
<rect x="530" y="1193.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1225.5" font-size="18" font-weight="500" fill="#20334f">while he lived there</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1250.5" font-size="18" font-weight="500" fill="#20334f">等一般过去时同样成立</text>
<rect x="530" y="1289.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1321.5" font-size="18" font-weight="500" fill="#20334f">判断应看持续性与句义 而非只看</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1346.5" font-size="18" font-weight="500" fill="#20334f">-ing</text>
