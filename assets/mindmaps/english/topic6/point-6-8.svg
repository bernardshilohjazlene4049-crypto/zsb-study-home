<rect x="42" y="752.0" width="210" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="789.0" font-size="18" font-weight="700" fill="#fff">if 虚拟三种时间</text>
<rect x="286" y="192.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="229.0" font-size="18" font-weight="700" fill="#20334f">与现在相反</text>
<rect x="610" y="112.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="149.0" font-size="18" font-weight="500" fill="#20334f">if 从句用一般过去时  be 常用 were</text>
<rect x="610" y="192.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="229.0" font-size="18" font-weight="500" fill="#20334f">主句 would/could/might + do</text>
<rect x="610" y="272.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="309.0" font-size="18" font-weight="500" fill="#20334f">补充例句 If I were you, I would apologize</text>
<rect x="286" y="432.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="469.0" font-size="18" font-weight="700" fill="#20334f">与过去相反</text>
<rect x="610" y="352.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="389.0" font-size="18" font-weight="500" fill="#20334f">if 从句 had + done</text>
<rect x="610" y="432.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="469.0" font-size="18" font-weight="500" fill="#20334f">主句 would/could/might have + done</text>
<rect x="610" y="512.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="549.0" font-size="18" font-weight="500" fill="#20334f">补充例句 If she had left earlier, she would have caught the bus</text>
<rect x="286" y="672.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="709.0" font-size="18" font-weight="700" fill="#20334f">与将来不大可能或假设</text>
<rect x="610" y="592.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="629.0" font-size="18" font-weight="500" fill="#20334f">if 从句 were to do / should do / 一般过去时</text>
<rect x="610" y="672.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="709.0" font-size="18" font-weight="500" fill="#20334f">主句 would/could/might + do</text>
<rect x="610" y="752.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="789.0" font-size="18" font-weight="500" fill="#20334f">补充例句 If he were to call, I would answer</text>
<rect x="286" y="912.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="949.0" font-size="18" font-weight="700" fill="#20334f">判断方法</text>
<rect x="610" y="832.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="869.0" font-size="18" font-weight="500" fill="#20334f">先问是假设现在 过去还是将来</text>
<rect x="610" y="912.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="949.0" font-size="18" font-weight="500" fill="#20334f">再套主从句配对</text>
<rect x="610" y="992.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1029.0" font-size="18" font-weight="500" fill="#20334f">混合条件句根据两个动作分别判断时间</text>
<rect x="286" y="1112.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="1149.0" font-size="18" font-weight="700" fill="#20334f">混合条件补充例句</text>
<rect x="610" y="1072.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1109.0" font-size="18" font-weight="500" fill="#20334f">If I had studied harder, I would be more confident now</text>
<rect x="610" y="1152.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1189.0" font-size="18" font-weight="500" fill="#20334f">过去条件加现在结果</text>
<rect x="286" y="1312.0" width="290" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="302" y="1349.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="610" y="1232.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1269.0" font-size="18" font-weight="500" fill="#20334f">底稿将 虚拟——动词都是过去式 作为速记 不够完整</text>
<rect x="610" y="1312.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1349.0" font-size="18" font-weight="500" fill="#20334f">与过去事实相反要 had done / would have done</text>
<rect x="610" y="1392.0" width="850" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="626" y="1429.0" font-size="18" font-weight="500" fill="#20334f">将来假设也可能用 should 或 were to</text>
</svg>
