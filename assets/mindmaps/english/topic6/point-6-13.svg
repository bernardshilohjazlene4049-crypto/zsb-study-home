<rect x="42" y="688.0" width="190" height="62" rx="16" fill="#243b63" stroke="#243b63" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="725.0" font-size="18" font-weight="700" fill="#fff">结果 so such that</text>
<rect x="266" y="280.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="317.0" font-size="18" font-weight="700" fill="#20334f">规则</text>
<rect x="530" y="112.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="149.0" font-size="18" font-weight="500" fill="#20334f">so + 形容词或副词 + that + 句子</text>
<rect x="530" y="192.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="224.5" font-size="18" font-weight="500" fill="#20334f">such + a/an + 形容词 + 名词 + that</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="249.5" font-size="18" font-weight="500" fill="#20334f">+ 句子</text>
<rect x="530" y="288.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="325.0" font-size="18" font-weight="500" fill="#20334f">复数或不可数名词前通常不用 a/an</text>
<rect x="530" y="368.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="405.0" font-size="18" font-weight="500" fill="#20334f">so many/few + 复数名词</text>
<rect x="530" y="448.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="485.0" font-size="18" font-weight="500" fill="#20334f">so much/little + 不可数名词</text>
<rect x="266" y="608.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="645.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原提示</text>
<rect x="530" y="528.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="565.0" font-size="18" font-weight="500" fill="#20334f">so/such … that 如此……以至于</text>
<rect x="530" y="608.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="645.0" font-size="18" font-weight="500" fill="#20334f">so that 因此 是理解结果的意译</text>
<rect x="530" y="688.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="725.0" font-size="18" font-weight="500" fill="#20334f">不能简单拿 therefore 与句法互换</text>
<rect x="266" y="888.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="925.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
<rect x="530" y="888.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="925.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="768.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="805.0" font-size="18" font-weight="500" fill="#20334f">The question was so difficult that nobody answered it</text>
<rect x="894" y="848.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="885.0" font-size="18" font-weight="500" fill="#20334f">It was such a difficult question that nobody answered it</text>
<rect x="894" y="928.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="965.0" font-size="18" font-weight="500" fill="#20334f">There was so little time that we couldn&#x27;t finish</text>
<rect x="894" y="1008.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1045.0" font-size="18" font-weight="500" fill="#20334f">He studied hard, so that he passed the exam 结果语义</text>
<rect x="266" y="1176.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1213.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1088.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1120.5" font-size="18" font-weight="500" fill="#20334f">so + adj + a/an + 单数可数名词 +</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1145.5" font-size="18" font-weight="500" fill="#20334f">that 也成立</text>
<rect x="530" y="1184.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1221.0" font-size="18" font-weight="500" fill="#20334f">so useful a book that</text>
<rect x="530" y="1264.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1301.0" font-size="18" font-weight="500" fill="#20334f">不是所有带名词结构都只能选 such</text>
</svg>
