<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="957.0" font-size="18" font-weight="500" fill="#20334f">补充例句</text>
<rect x="894" y="800.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="837.0" font-size="18" font-weight="500" fill="#20334f">Although he was tired, he continued working</text>
<rect x="894" y="880.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="917.0" font-size="18" font-weight="500" fill="#20334f">Even if it rains, we will go 假设</text>
<rect x="894" y="960.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="997.0" font-size="18" font-weight="500" fill="#20334f">Even though it was raining, they played football 事实</text>
<rect x="894" y="1040.0" width="560" height="62" rx="16" fill="#fff3df" stroke="#e5bc75" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="910" y="1077.0" font-size="18" font-weight="500" fill="#20334f">While I agree with you, I still have a question</text>
<rect x="266" y="1208.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="1245.0" font-size="18" font-weight="700" fill="#20334f">易错点</text>
<rect x="530" y="1120.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1152.5" font-size="18" font-weight="500" fill="#20334f">标准书面英语通常不要配成 Although</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1177.5" font-size="18" font-weight="500" fill="#20334f">..., but ...</text>
<rect x="530" y="1216.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1253.0" font-size="18" font-weight="500" fill="#20334f">although 本身已表示转折</text>
<rect x="530" y="1296.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="1333.0" font-size="18" font-weight="500" fill="#20334f">让步主句可用 still/yet 等副词</text>
