<text font-family="Noto Sans CJK SC, sans-serif" x="58" y="753.5" font-size="18" font-weight="700" fill="#fff">though 等</text>
<rect x="266" y="288.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
