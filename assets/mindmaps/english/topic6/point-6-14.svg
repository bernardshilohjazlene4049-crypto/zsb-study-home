<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="144.5" font-size="18" font-weight="500" fill="#20334f">although / though / even though</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="169.5" font-size="18" font-weight="500" fill="#20334f">表虽然尽管</text>
<rect x="530" y="208.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="245.0" font-size="18" font-weight="500" fill="#20334f">强调现实或已给定事实</text>
<rect x="530" y="288.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="325.0" font-size="18" font-weight="500" fill="#20334f">even if 常表即使 假设</text>
<rect x="530" y="368.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="400.5" font-size="18" font-weight="500" fill="#20334f">while 置句首也可表尽管或虽然</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="425.5" font-size="18" font-weight="500" fill="#20334f">较书面</text>
<rect x="530" y="464.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="501.0" font-size="18" font-weight="500" fill="#20334f">或表对比 然而</text>
<rect x="266" y="632.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="669.0" font-size="18" font-weight="700" fill="#20334f">课堂笔记原短语</text>
<rect x="530" y="544.0" width="330" height="78" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="576.5" font-size="18" font-weight="500" fill="#20334f">although / though / as / even if /</text>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="601.5" font-size="18" font-weight="500" fill="#20334f">even though</text>
<rect x="530" y="640.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="677.0" font-size="18" font-weight="500" fill="#20334f">尽管 即使 虽然</text>
<rect x="530" y="720.0" width="330" height="62" rx="16" fill="#e7f5f2" stroke="#83c5b7" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="546" y="757.0" font-size="18" font-weight="500" fill="#20334f">though / while</text>
<rect x="266" y="920.0" width="230" height="62" rx="16" fill="#e7efff" stroke="#9bb4e8" stroke-width="1.5" filter="url(#shadow)"/>
<text font-family="Noto Sans CJK SC, sans-serif" x="282" y="957.0" font-size="18" font-weight="700" fill="#20334f">例句来源</text>
