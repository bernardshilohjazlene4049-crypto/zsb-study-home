<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1178" viewBox="0 0 1200 1178" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-13｜复合嵌套从句拆解</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1178" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">复合嵌套从句拆解</tspan></text>
<rect x="42" y="132" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">一个句子可以同时包含多个名词性 定语 状语从句</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿强调 主语从句 + 系动词 + 表语从句 是典型复合结构之一</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">但并非唯一组合</tspan></text>
<rect x="42" y="364" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="364" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="406" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">课堂笔记原提示</tspan></text>
<circle cx="85" cy="462" r="4" fill="#6c8da9"/>
<text x="102" y="468" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">连接词 + V1 + V2 is/was + 连接词 + V3</tspan></text>
<circle cx="85" cy="498" r="4" fill="#6c8da9"/>
<text x="102" y="504" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">核心 找系动词</tspan></text>
<circle cx="85" cy="534" r="4" fill="#6c8da9"/>
<text x="102" y="540" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">选择题可能同时出现两个连接词</tspan></text>
<rect x="42" y="596" width="1116" height="340" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="596" width="10" height="340" rx="5" fill="#4c8b83"/>
<text x="74" y="638" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="704" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="748" r="4" fill="#6c8da9"/>
<text x="130" y="754" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">What matters most is whether you keep trying</tspan></text>
<circle cx="113" cy="784" r="4" fill="#6c8da9"/>
<text x="130" y="790" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">What matters most 是主语从句</tspan></text>
<circle cx="113" cy="820" r="4" fill="#6c8da9"/>
<text x="130" y="826" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">whether you keep trying 是表语从句</tspan></text>
<circle cx="113" cy="856" r="4" fill="#6c8da9"/>
<text x="130" y="862" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I know that the student who spoke first is from Dalian</tspan></text>
<circle cx="113" cy="892" r="4" fill="#6c8da9"/>
<text x="130" y="898" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">宾语从句内含定语从句</tspan></text>
<rect x="42" y="954" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="954" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="996" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1052" r="4" fill="#6c8da9"/>
<text x="102" y="1058" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">连接词数量不必等于从句数量 例如关系词省略</tspan></text>
<circle cx="85" cy="1088" r="4" fill="#6c8da9"/>
<text x="102" y="1094" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">仍应按谓语和句子功能逐层拆解</tspan></text>
<text x="42" y="1168" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-13</text>
</svg>