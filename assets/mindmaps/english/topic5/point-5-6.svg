<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1466" viewBox="0 0 1200 1466" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-6" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-6｜同位语从句 vs 定语从句</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1466" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">同位语从句 vs 定语从句</tspan></text>
<rect x="42" y="132" width="1116" height="538" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="538" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<text x="78" y="240" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">同位语从句</tspan></text>
<circle cx="113" cy="284" r="4" fill="#6c8da9"/>
<text x="130" y="290" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">解释前面抽象名词的内容</tspan></text>
<circle cx="113" cy="320" r="4" fill="#6c8da9"/>
<text x="130" y="326" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">常接 fact news evidence suggestion idea belief hope possibility question information</tspan></text>
<circle cx="113" cy="356" r="4" fill="#6c8da9"/>
<text x="130" y="362" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">that 在从句中不作成分</tspan></text>
<circle cx="113" cy="392" r="4" fill="#6c8da9"/>
<text x="130" y="398" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">说明事实或消息是什么</tspan></text>
<circle cx="113" cy="428" r="4" fill="#6c8da9"/>
<text x="130" y="434" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">the news that she won 她获胜的消息</tspan></text>
<text x="78" y="474" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">定语从句</tspan></text>
<circle cx="113" cy="518" r="4" fill="#6c8da9"/>
<text x="130" y="524" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">修饰或限定前面名词</tspan></text>
<circle cx="113" cy="554" r="4" fill="#6c8da9"/>
<text x="130" y="560" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">关系代词会在从句内部充当成分</tspan></text>
<circle cx="113" cy="590" r="4" fill="#6c8da9"/>
<text x="130" y="596" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">说明哪个名词或怎样的名词</tspan></text>
<circle cx="113" cy="626" r="4" fill="#6c8da9"/>
<text x="130" y="632" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">the news that she told me 她告诉我的那条消息</tspan></text>
<rect x="42" y="688" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="688" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="730" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">课堂笔记原说明</tspan></text>
<circle cx="85" cy="786" r="4" fill="#6c8da9"/>
<text x="102" y="792" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">高频提示词 news evidence suggestion fact idea</tspan></text>
<circle cx="85" cy="822" r="4" fill="#6c8da9"/>
<text x="102" y="828" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">另有 information secret</tspan></text>
<circle cx="85" cy="858" r="4" fill="#6c8da9"/>
<text x="102" y="864" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿将后一组标作超纲词 该判断属于底稿用语 不能据此认定官方考试实际超纲</tspan></text>
<rect x="42" y="920" width="1116" height="268" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="920" width="10" height="268" rx="5" fill="#4c8b83"/>
<text x="74" y="962" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="1028" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="1072" r="4" fill="#6c8da9"/>
<text x="130" y="1078" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The idea that we should start early is good 同位语</tspan></text>
<circle cx="113" cy="1108" r="4" fill="#6c8da9"/>
<text x="130" y="1114" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The idea that she suggested is good 定从 suggested 缺宾语</tspan></text>
<circle cx="113" cy="1144" r="4" fill="#6c8da9"/>
<text x="130" y="1150" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I have no idea why he left why 解释疑问内容</tspan></text>
<rect x="42" y="1206" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1206" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="1248" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1304" r="4" fill="#6c8da9"/>
<text x="102" y="1310" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不是 news/fact/suggestion 后面就一定用 that</tspan></text>
<circle cx="85" cy="1340" r="4" fill="#6c8da9"/>
<text x="102" y="1346" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">要看从句是否缺成分 以及是同位还是限定</tspan></text>
<circle cx="85" cy="1376" r="4" fill="#6c8da9"/>
<text x="102" y="1382" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">suggestion that sb should do 见建议类虚拟语气</tspan></text>
<text x="42" y="1456" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-6</text>
</svg>