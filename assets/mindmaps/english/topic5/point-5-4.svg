<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-4" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-4｜宾语从句位置与省略</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1430" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">宾语从句位置与省略</tspan></text>
<rect x="42" y="132" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">置于 think/say/know/believe/ask/wonder/tell/explain 等动词后</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">介词后也可出现 what/whether/how 等引导的名从</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">that 引导的普通宾语从句经常可以省略</tspan></text>
<circle cx="85" cy="338" r="4" fill="#6c8da9"/>
<text x="102" y="344" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">但不是所有嵌套和固定结构都适合省略</tspan></text>
<rect x="42" y="400" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="400" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="442" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">双宾语辨析</tspan></text>
<circle cx="85" cy="498" r="4" fill="#6c8da9"/>
<text x="102" y="504" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">tell/ask/show + 人 + 从句 很常见</tspan></text>
<circle cx="85" cy="534" r="4" fill="#6c8da9"/>
<text x="102" y="540" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">He told me what happened</tspan></text>
<circle cx="85" cy="570" r="4" fill="#6c8da9"/>
<text x="102" y="576" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">give/buy + 人 + 物 常见</tspan></text>
<circle cx="85" cy="606" r="4" fill="#6c8da9"/>
<text x="102" y="612" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">She gave me what I needed 中 what I needed 是名词性宾语</tspan></text>
<rect x="42" y="668" width="1116" height="520" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="668" width="10" height="520" rx="5" fill="#4c8b83"/>
<text x="74" y="710" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="776" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原例</tspan></text>
<circle cx="113" cy="820" r="4" fill="#6c8da9"/>
<text x="130" y="826" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">He has told me that he will go to Shanghai tomorrow</tspan></text>
<text x="78" y="866" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原题</tspan></text>
<circle cx="113" cy="910" r="4" fill="#6c8da9"/>
<text x="130" y="916" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I asked the woman at the booking office ___ I could have two tickets</tspan></text>
<circle cx="113" cy="946" r="4" fill="#6c8da9"/>
<text x="130" y="952" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">A which / B if / C that / D what</tspan></text>
<circle cx="113" cy="982" r="4" fill="#6c8da9"/>
<text x="130" y="988" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">答案 B 是否可以买两张票</tspan></text>
<text x="78" y="1028" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="1072" r="4" fill="#6c8da9"/>
<text x="130" y="1078" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">She said that she was busy that 可省</tspan></text>
<circle cx="113" cy="1108" r="4" fill="#6c8da9"/>
<text x="130" y="1114" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">We talked about what we should do next</tspan></text>
<circle cx="113" cy="1144" r="4" fill="#6c8da9"/>
<text x="130" y="1150" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Please tell me whether the library is open</tspan></text>
<rect x="42" y="1206" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1206" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="1248" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1304" r="4" fill="#6c8da9"/>
<text x="102" y="1310" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">动词后有 that 省略时 先找从句真正起点</tspan></text>
<circle cx="85" cy="1340" r="4" fill="#6c8da9"/>
<text x="102" y="1346" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">介词后通常用 whether 而不是表是否的 if</tspan></text>
<text x="42" y="1420" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-4</text>
</svg>