<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-12｜whatever 与 no matter</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="910" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">whatever 与 no matter</tspan></text>
<rect x="42" y="132" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">whoever/whatever 可以引导名词性从句</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">意为任何……的人或事物</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">no matter who/what 主要引导让步状语从句</tspan></text>
<circle cx="85" cy="338" r="4" fill="#6c8da9"/>
<text x="102" y="344" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">通常不能直接替代名从主语或宾语</tspan></text>
<rect x="42" y="400" width="1116" height="268" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="400" width="10" height="268" rx="5" fill="#4c8b83"/>
<text x="74" y="442" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="508" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="552" r="4" fill="#6c8da9"/>
<text x="130" y="558" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Whoever wins will receive a prize 作主语</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">You can choose whatever you like 作宾语</tspan></text>
<circle cx="113" cy="624" r="4" fill="#6c8da9"/>
<text x="130" y="630" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">No matter who wins, we will celebrate 让步状语从句</tspan></text>
<rect x="42" y="686" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="686" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="728" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="784" r="4" fill="#6c8da9"/>
<text x="102" y="790" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">No matter who wins will receive a prize 不符合预期的名词性主语结构</tspan></text>
<circle cx="85" cy="820" r="4" fill="#6c8da9"/>
<text x="102" y="826" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿 no matter + wh = wh-ever 只在同为让步状从且语义一致时通常可替换</tspan></text>
<text x="42" y="900" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-12</text>
</svg>