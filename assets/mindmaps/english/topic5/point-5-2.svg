<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2454" viewBox="0 0 1200 2454" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-2" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-2｜名从连接词总表</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="2454" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">名从连接词总表</tspan></text>
<rect x="42" y="132" width="1116" height="286" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="286" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">不充当成分</tspan></text>
<text x="78" y="240" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">that</tspan></text>
<circle cx="113" cy="284" r="4" fill="#6c8da9"/>
<text x="130" y="290" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">陈述内容 这件事 无实义</tspan></text>
<text x="78" y="330" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">whether / if</tspan></text>
<circle cx="113" cy="374" r="4" fill="#6c8da9"/>
<text x="130" y="380" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">是否</tspan></text>
<rect x="42" y="436" width="1116" height="790" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="436" width="10" height="790" rx="5" fill="#4c8b83"/>
<text x="74" y="478" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">充当成分</tspan></text>
<text x="78" y="544" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">who / whom</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">指人 作主语或宾语等</tspan></text>
<text x="78" y="634" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">what</tspan></text>
<circle cx="113" cy="678" r="4" fill="#6c8da9"/>
<text x="130" y="684" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">指物或事情</tspan></text>
<circle cx="113" cy="714" r="4" fill="#6c8da9"/>
<text x="130" y="720" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">作主语 宾语 表语等</tspan></text>
<circle cx="113" cy="750" r="4" fill="#6c8da9"/>
<text x="130" y="756" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">什么 或 的事物</tspan></text>
<text x="78" y="796" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">which</tspan></text>
<circle cx="113" cy="840" r="4" fill="#6c8da9"/>
<text x="130" y="846" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">选择范围 哪一个或哪些</tspan></text>
<text x="78" y="886" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">whose</tspan></text>
<circle cx="113" cy="930" r="4" fill="#6c8da9"/>
<text x="130" y="936" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">所属 谁的 作定语</tspan></text>
<text x="78" y="976" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">when / where / why / how</tspan></text>
<circle cx="113" cy="1020" r="4" fill="#6c8da9"/>
<text x="130" y="1026" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">时间地点原因方式 作状语</tspan></text>
<text x="78" y="1066" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">-ever 词</tspan></text>
<circle cx="113" cy="1110" r="4" fill="#6c8da9"/>
<text x="130" y="1116" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">whoever whatever whichever whenever wherever however</tspan></text>
<circle cx="113" cy="1146" r="4" fill="#6c8da9"/>
<text x="130" y="1152" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">任指或让步意义</tspan></text>
<circle cx="113" cy="1182" r="4" fill="#6c8da9"/>
<text x="130" y="1188" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">根据词性作相应成分或状语</tspan></text>
<rect x="42" y="1244" width="1116" height="358" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1244" width="10" height="358" rx="5" fill="#4c8b83"/>
<text x="74" y="1286" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">判断步骤</tspan></text>
<circle cx="85" cy="1342" r="4" fill="#6c8da9"/>
<text x="102" y="1348" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">1 内部是否缺主语宾语表语定语</tspan></text>
<circle cx="85" cy="1378" r="4" fill="#6c8da9"/>
<text x="102" y="1384" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">缺人选 who/whom 缺事物选 what</tspan></text>
<circle cx="85" cy="1414" r="4" fill="#6c8da9"/>
<text x="102" y="1420" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">已有有限选择集可选 which 缺所属选 whose</tspan></text>
<circle cx="85" cy="1450" r="4" fill="#6c8da9"/>
<text x="102" y="1456" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">2 主宾齐全却缺时间地点原因方式 选 when/where/why/how</tspan></text>
<circle cx="85" cy="1486" r="4" fill="#6c8da9"/>
<text x="102" y="1492" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">3 结构完整且表达是否 选 whether/if</tspan></text>
<circle cx="85" cy="1522" r="4" fill="#6c8da9"/>
<text x="102" y="1528" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">结构完整且陈述事实通常选 that</tspan></text>
<circle cx="85" cy="1558" r="4" fill="#6c8da9"/>
<text x="102" y="1564" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">4 -ever 含义更强 必须结合句义 不能机械必选</tspan></text>
<rect x="42" y="1620" width="1116" height="556" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1620" width="10" height="556" rx="5" fill="#4c8b83"/>
<text x="74" y="1662" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="1728" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原例</tspan></text>
<circle cx="113" cy="1772" r="4" fill="#6c8da9"/>
<text x="130" y="1778" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The scissors are what I need</tspan></text>
<circle cx="113" cy="1808" r="4" fill="#6c8da9"/>
<text x="130" y="1814" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">What you did is right</tspan></text>
<circle cx="113" cy="1844" r="4" fill="#6c8da9"/>
<text x="130" y="1850" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">She explained why she failed the maths exam</tspan></text>
<circle cx="113" cy="1880" r="4" fill="#6c8da9"/>
<text x="130" y="1886" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I wonder how he has got so much money</tspan></text>
<text x="78" y="1926" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记存疑原句</tspan></text>
<circle cx="113" cy="1970" r="4" fill="#6c8da9"/>
<text x="130" y="1976" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">【看不清】Who/What we went study for is a question</tspan></text>
<circle cx="113" cy="2006" r="4" fill="#6c8da9"/>
<text x="130" y="2012" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">句法不完整 原样保留 暂不据此判断 Who/What 的答案</tspan></text>
<text x="78" y="2052" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="2096" r="4" fill="#6c8da9"/>
<text x="130" y="2102" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Whoever finishes first can choose a seat</tspan></text>
<circle cx="113" cy="2132" r="4" fill="#6c8da9"/>
<text x="130" y="2138" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I don't know who called me 问是谁 不等于无论谁</tspan></text>
<rect x="42" y="2194" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="2194" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="2236" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="2292" r="4" fill="#6c8da9"/>
<text x="102" y="2298" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">what 可理解为 the thing that 或 things that 但定从一般需要外部先行词</tspan></text>
<circle cx="85" cy="2328" r="4" fill="#6c8da9"/>
<text x="102" y="2334" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">that 不在名从内部作主或宾语</tspan></text>
<circle cx="85" cy="2364" r="4" fill="#6c8da9"/>
<text x="102" y="2370" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不能用 that 填缺宾语的位置</tspan></text>
<text x="42" y="2444" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-2</text>
</svg>