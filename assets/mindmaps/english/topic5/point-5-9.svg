<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1072" viewBox="0 0 1200 1072" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-9" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-9｜doubt 与否定转移</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1072" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">doubt 与否定转移</tspan></text>
<rect x="42" y="132" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">肯定句 doubt 常接 whether/if</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">否定句 don't doubt 常接 that</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">I don't think/believe/suppose 可能用主句否定表达对宾从内容的否定</tspan></text>
<circle cx="85" cy="338" r="4" fill="#6c8da9"/>
<text x="102" y="344" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">否定转移不等于主句动词本义被改变</tspan></text>
<rect x="42" y="400" width="1116" height="394" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="400" width="10" height="394" rx="5" fill="#4c8b83"/>
<text x="74" y="442" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="508" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原题</tspan></text>
<circle cx="113" cy="552" r="4" fill="#6c8da9"/>
<text x="130" y="558" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I don't doubt ___ he'll come to the cafe to see me on time</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">A that / B when / C what / D whether</tspan></text>
<circle cx="113" cy="624" r="4" fill="#6c8da9"/>
<text x="130" y="630" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">答案 A</tspan></text>
<text x="78" y="670" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="714" r="4" fill="#6c8da9"/>
<text x="130" y="720" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I doubt whether he knows the answer</tspan></text>
<circle cx="113" cy="750" r="4" fill="#6c8da9"/>
<text x="130" y="756" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I don't think he is ready</tspan></text>
<rect x="42" y="812" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="812" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="854" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="910" r="4" fill="#6c8da9"/>
<text x="102" y="916" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">doubt that 在不同语义及英语变体中也存在</tspan></text>
<circle cx="85" cy="946" r="4" fill="#6c8da9"/>
<text x="102" y="952" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">练习时按肯定怀疑 否定确定的典型模式处理</tspan></text>
<circle cx="85" cy="982" r="4" fill="#6c8da9"/>
<text x="102" y="988" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不应认成绝对禁令</tspan></text>
<text x="42" y="1062" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-9</text>
</svg>