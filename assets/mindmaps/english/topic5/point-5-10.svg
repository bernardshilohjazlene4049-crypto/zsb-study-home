<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-10" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-10｜时态呼应与客观事实</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1018" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">时态呼应与客观事实</tspan></text>
<rect x="42" y="132" width="1116" height="286" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="286" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">宾从时态由事实时间与主句视角决定</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">主句一般现在时不强制改变从句</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">过去时主句叙述过去相对时点时常出现时态后移</tspan></text>
<circle cx="85" cy="338" r="4" fill="#6c8da9"/>
<text x="102" y="344" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">客观真理通常仍用一般现在时</tspan></text>
<circle cx="85" cy="374" r="4" fill="#6c8da9"/>
<text x="102" y="380" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">时间状语也要保持逻辑一致</tspan></text>
<rect x="42" y="436" width="1116" height="304" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="436" width="10" height="304" rx="5" fill="#4c8b83"/>
<text x="74" y="478" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="544" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">He says that he is tired</tspan></text>
<circle cx="113" cy="624" r="4" fill="#6c8da9"/>
<text x="130" y="630" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">He said that he was tired</tspan></text>
<circle cx="113" cy="660" r="4" fill="#6c8da9"/>
<text x="130" y="666" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The teacher said that the earth moves around the sun</tspan></text>
<circle cx="113" cy="696" r="4" fill="#6c8da9"/>
<text x="130" y="702" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">She asked me when I would arrive</tspan></text>
<rect x="42" y="758" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="758" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="800" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="856" r="4" fill="#6c8da9"/>
<text x="102" y="862" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不能机械套 主过从必过</tspan></text>
<circle cx="85" cy="892" r="4" fill="#6c8da9"/>
<text x="102" y="898" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">事实一直有效或时间参照仍是现在 可以有其他时态</tspan></text>
<circle cx="85" cy="928" r="4" fill="#6c8da9"/>
<text x="102" y="934" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">非谓语不算从句谓语</tspan></text>
<text x="42" y="1008" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-10</text>
</svg>