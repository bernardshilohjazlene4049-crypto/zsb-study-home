<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1448" viewBox="0 0 1200 1448" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-3" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-3｜主语从句位置与一致</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1448" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">主语从句位置与一致</tspan></text>
<rect x="42" y="132" width="1116" height="394" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="394" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<text x="78" y="240" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">句首</tspan></text>
<circle cx="113" cy="284" r="4" fill="#6c8da9"/>
<text x="130" y="290" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">That he passed the test is surprising</tspan></text>
<text x="78" y="330" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">形式主语 it</tspan></text>
<circle cx="113" cy="374" r="4" fill="#6c8da9"/>
<text x="130" y="380" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">It is surprising that he passed the test</tspan></text>
<circle cx="113" cy="410" r="4" fill="#6c8da9"/>
<text x="130" y="416" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">It is + 形容词 + that</tspan></text>
<circle cx="113" cy="446" r="4" fill="#6c8da9"/>
<text x="130" y="452" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">It is + 名词 + that</tspan></text>
<circle cx="113" cy="482" r="4" fill="#6c8da9"/>
<text x="130" y="488" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">It seems/appears that</tspan></text>
<rect x="42" y="544" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="544" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="586" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">判断方法</tspan></text>
<circle cx="85" cy="642" r="4" fill="#6c8da9"/>
<text x="102" y="648" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">问全句 什么是确定 重要 或难以置信的</tspan></text>
<circle cx="85" cy="678" r="4" fill="#6c8da9"/>
<text x="102" y="684" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">若答案是后面一个句子 后句可为主语从句</tspan></text>
<rect x="42" y="740" width="1116" height="430" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="740" width="10" height="430" rx="5" fill="#4c8b83"/>
<text x="74" y="782" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="848" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原题</tspan></text>
<circle cx="113" cy="892" r="4" fill="#6c8da9"/>
<text x="130" y="898" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">___ the international conference on climate change next year is certain</tspan></text>
<circle cx="113" cy="928" r="4" fill="#6c8da9"/>
<text x="130" y="934" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">A He will attend / B He attends / C That he will attend / D As he attends</tspan></text>
<circle cx="113" cy="964" r="4" fill="#6c8da9"/>
<text x="130" y="970" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">答案 C</tspan></text>
<text x="78" y="1010" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="1054" r="4" fill="#6c8da9"/>
<text x="130" y="1060" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">That she can finish the task is clear</tspan></text>
<circle cx="113" cy="1090" r="4" fill="#6c8da9"/>
<text x="130" y="1096" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">It is important that we keep learning</tspan></text>
<circle cx="113" cy="1126" r="4" fill="#6c8da9"/>
<text x="130" y="1132" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Whether he agrees is unknown</tspan></text>
<rect x="42" y="1188" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1188" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="1230" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1286" r="4" fill="#6c8da9"/>
<text x="102" y="1292" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">书面语中句首且不缺成分的主语从句通常需 that 不要无故省去</tspan></text>
<circle cx="85" cy="1322" r="4" fill="#6c8da9"/>
<text x="102" y="1328" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">完整主语从句作主语时谓语通常用单数</tspan></text>
<circle cx="85" cy="1358" r="4" fill="#6c8da9"/>
<text x="102" y="1364" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">what 引导的结构在特定复数表语语义下可能变化 见专题七</tspan></text>
<text x="42" y="1438" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-3</text>
</svg>