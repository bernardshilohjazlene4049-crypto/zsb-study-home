<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1304" viewBox="0 0 1200 1304" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-5" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-5｜表语从句与 reason is that</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1304" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">表语从句与 reason is that</tspan></text>
<rect x="42" y="132" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">The question/problem/truth/reason is that/whether/why/how</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">系动词后引出表语从句</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿固定表达 The reason why ... is/was that ...</tspan></text>
<rect x="42" y="364" width="1116" height="286" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="364" width="10" height="286" rx="5" fill="#4c8b83"/>
<text x="74" y="406" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">判断方法</tspan></text>
<circle cx="85" cy="462" r="4" fill="#6c8da9"/>
<text x="102" y="468" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">找系动词</tspan></text>
<circle cx="85" cy="498" r="4" fill="#6c8da9"/>
<text x="102" y="504" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">检查后面的句子是否解释主语内容</tspan></text>
<circle cx="85" cy="534" r="4" fill="#6c8da9"/>
<text x="102" y="540" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">why 表原因疑问义</tspan></text>
<circle cx="85" cy="570" r="4" fill="#6c8da9"/>
<text x="102" y="576" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">because 表实际原因</tspan></text>
<circle cx="85" cy="606" r="4" fill="#6c8da9"/>
<text x="102" y="612" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">that 在 reason...is that 中引出说明</tspan></text>
<rect x="42" y="668" width="1116" height="358" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="668" width="10" height="358" rx="5" fill="#4c8b83"/>
<text x="74" y="710" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="776" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原模板</tspan></text>
<circle cx="113" cy="820" r="4" fill="#6c8da9"/>
<text x="130" y="826" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The reason why … is / was that …</tspan></text>
<text x="78" y="866" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="910" r="4" fill="#6c8da9"/>
<text x="130" y="916" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The reason why he was absent is that he was ill</tspan></text>
<circle cx="113" cy="946" r="4" fill="#6c8da9"/>
<text x="130" y="952" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">The question is whether we have enough time</tspan></text>
<circle cx="113" cy="982" r="4" fill="#6c8da9"/>
<text x="130" y="988" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">This is why I called you</tspan></text>
<rect x="42" y="1044" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1044" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="1086" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1142" r="4" fill="#6c8da9"/>
<text x="102" y="1148" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿将 that 解释为在这里相当于 because 是帮助翻译的口诀</tspan></text>
<circle cx="85" cy="1178" r="4" fill="#6c8da9"/>
<text x="102" y="1184" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">两个词在句法上不可互换</tspan></text>
<circle cx="85" cy="1214" r="4" fill="#6c8da9"/>
<text x="102" y="1220" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">考试书面语 The reason ... is that ... 最稳妥</tspan></text>
<text x="42" y="1294" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-5</text>
</svg>