<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1860" viewBox="0 0 1200 1860" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-1" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-1｜名词性从句总判断</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1860" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">名词性从句总判断</tspan></text>
<rect x="42" y="132" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">定义</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">从句充当主语 宾语 表语 同位语</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">功能相当于一个名词性成分</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿口诀 一找从句位置 三连接看所缺成分</tspan></text>
<rect x="42" y="364" width="1116" height="754" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="364" width="10" height="754" rx="5" fill="#4c8b83"/>
<text x="74" y="406" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">四种类型</tspan></text>
<text x="78" y="472" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">主语从句</tspan></text>
<circle cx="113" cy="516" r="4" fill="#6c8da9"/>
<text x="130" y="522" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">句首或形式主语 it 后</tspan></text>
<circle cx="113" cy="552" r="4" fill="#6c8da9"/>
<text x="130" y="558" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">整个从句回答 什么使……</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">补充例句 What she needs is time</tspan></text>
<text x="78" y="634" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">宾语从句</tspan></text>
<circle cx="113" cy="678" r="4" fill="#6c8da9"/>
<text x="130" y="684" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">及物动词后 或部分介词后</tspan></text>
<circle cx="113" cy="714" r="4" fill="#6c8da9"/>
<text x="130" y="720" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">是知道 问 解释的内容</tspan></text>
<circle cx="113" cy="750" r="4" fill="#6c8da9"/>
<text x="130" y="756" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">补充例句 I know that he is honest</tspan></text>
<text x="78" y="796" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">表语从句</tspan></text>
<circle cx="113" cy="840" r="4" fill="#6c8da9"/>
<text x="130" y="846" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">be/seem/remain 等系动词后</tspan></text>
<circle cx="113" cy="876" r="4" fill="#6c8da9"/>
<text x="130" y="882" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">解释主语是什么或怎么样</tspan></text>
<circle cx="113" cy="912" r="4" fill="#6c8da9"/>
<text x="130" y="918" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">补充例句 The problem is whether we can leave</tspan></text>
<text x="78" y="958" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">同位语从句</tspan></text>
<circle cx="113" cy="1002" r="4" fill="#6c8da9"/>
<text x="130" y="1008" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">fact/news/idea/question 等抽象名词后</tspan></text>
<circle cx="113" cy="1038" r="4" fill="#6c8da9"/>
<text x="130" y="1044" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">解释这个名词的具体内容</tspan></text>
<circle cx="113" cy="1074" r="4" fill="#6c8da9"/>
<text x="130" y="1080" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">补充例句 The fact that she succeeded encouraged us</tspan></text>
<rect x="42" y="1136" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1136" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="1178" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">课堂笔记原例与提示</tspan></text>
<circle cx="85" cy="1234" r="4" fill="#6c8da9"/>
<text x="102" y="1240" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">What doesn't kill you makes you stronger</tspan></text>
<circle cx="85" cy="1270" r="4" fill="#6c8da9"/>
<text x="102" y="1276" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">He has told me that he will go to Shanghai tomorrow</tspan></text>
<circle cx="85" cy="1306" r="4" fill="#6c8da9"/>
<text x="102" y="1312" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">It is + 从句 是后置主语从句常见形式</tspan></text>
<circle cx="85" cy="1342" r="4" fill="#6c8da9"/>
<text x="102" y="1348" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">tell/ask/give/show/buy + 人 可出现双宾语</tspan></text>
<rect x="42" y="1404" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1404" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="1446" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">判断方法</tspan></text>
<circle cx="85" cy="1502" r="4" fill="#6c8da9"/>
<text x="102" y="1508" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">先找主句谓语 再看空缺的句子成分</tspan></text>
<circle cx="85" cy="1538" r="4" fill="#6c8da9"/>
<text x="102" y="1544" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">只数两个谓语只是入门近似</tspan></text>
<circle cx="85" cy="1574" r="4" fill="#6c8da9"/>
<text x="102" y="1580" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">嵌套从句可有三个及以上谓语</tspan></text>
<rect x="42" y="1636" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1636" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="1678" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1734" r="4" fill="#6c8da9"/>
<text x="102" y="1740" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">He buys me books 是双宾语简单句 不是名词性从句</tspan></text>
<circle cx="85" cy="1770" r="4" fill="#6c8da9"/>
<text x="102" y="1776" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不能仅凭从句前有一个名词就认定是定语从句</tspan></text>
<text x="42" y="1850" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-1</text>
</svg>