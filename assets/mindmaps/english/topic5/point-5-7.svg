<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1698" viewBox="0 0 1200 1698" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-7" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-7｜whether 与 if 的位置</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1698" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">whether 与 if 的位置</tspan></text>
<rect x="42" y="132" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">通常用 whether</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">句首主语从句</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">介词后</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">whether to do</tspan></text>
<circle cx="85" cy="338" r="4" fill="#6c8da9"/>
<text x="102" y="344" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">whether or not</tspan></text>
<rect x="42" y="400" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="400" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="442" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">动词后</tspan></text>
<circle cx="85" cy="498" r="4" fill="#6c8da9"/>
<text x="102" y="504" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">一般可选 whether/if</tspan></text>
<circle cx="85" cy="534" r="4" fill="#6c8da9"/>
<text x="102" y="540" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">具体取决于意义与搭配</tspan></text>
<rect x="42" y="596" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="596" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="638" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">判断方法</tspan></text>
<circle cx="85" cy="694" r="4" fill="#6c8da9"/>
<text x="102" y="700" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">先看是否缺主宾状 缺就不用 whether</tspan></text>
<circle cx="85" cy="730" r="4" fill="#6c8da9"/>
<text x="102" y="736" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">再看有无是否的疑问</tspan></text>
<circle cx="85" cy="766" r="4" fill="#6c8da9"/>
<text x="102" y="772" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">最后检查句首 介词后 to do 紧邻 or not 等位置</tspan></text>
<rect x="42" y="828" width="1116" height="556" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="828" width="10" height="556" rx="5" fill="#4c8b83"/>
<text x="74" y="870" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="936" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原例</tspan></text>
<circle cx="113" cy="980" r="4" fill="#6c8da9"/>
<text x="130" y="986" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">___ will be our monitor is unknown 底稿给 who 从句缺主语</tspan></text>
<text x="78" y="1026" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原题</tspan></text>
<circle cx="113" cy="1070" r="4" fill="#6c8da9"/>
<text x="130" y="1076" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">___ you will be our monitor is unknown</tspan></text>
<circle cx="113" cy="1106" r="4" fill="#6c8da9"/>
<text x="130" y="1112" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">A that / B who / C whether / D what</tspan></text>
<circle cx="113" cy="1142" r="4" fill="#6c8da9"/>
<text x="130" y="1148" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">答案 C 你是否会当我们的班长还未知</tspan></text>
<text x="78" y="1188" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="1232" r="4" fill="#6c8da9"/>
<text x="130" y="1238" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Whether she will attend is uncertain</tspan></text>
<circle cx="113" cy="1268" r="4" fill="#6c8da9"/>
<text x="130" y="1274" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I cannot decide whether to go</tspan></text>
<circle cx="113" cy="1304" r="4" fill="#6c8da9"/>
<text x="130" y="1310" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I am worried about whether it will rain</tspan></text>
<circle cx="113" cy="1340" r="4" fill="#6c8da9"/>
<text x="130" y="1346" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">I don't know if he will come or not 分开使用可以成立</tspan></text>
<rect x="42" y="1402" width="1116" height="250" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="1402" width="10" height="250" rx="5" fill="#4c8b83"/>
<text x="74" y="1444" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="1500" r="4" fill="#6c8da9"/>
<text x="102" y="1506" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">底稿说 whether 与 or/or not 连用 if 不行 应精确化</tspan></text>
<circle cx="85" cy="1536" r="4" fill="#6c8da9"/>
<text x="102" y="1542" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">whether or not 可以  if or not 不可以</tspan></text>
<circle cx="85" cy="1572" r="4" fill="#6c8da9"/>
<text x="102" y="1578" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">if ... or not 在一般宾语从句中可以</tspan></text>
<circle cx="85" cy="1608" r="4" fill="#6c8da9"/>
<text x="102" y="1614" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">if 句首还可表示如果 不能一概说句首不出现 if</tspan></text>
<text x="42" y="1688" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-7</text>
</svg>