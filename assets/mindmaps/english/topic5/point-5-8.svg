<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-8" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-8｜疑问句变从句用陈述语序</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="1000" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">疑问句变从句用陈述语序</tspan></text>
<rect x="42" y="132" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Where is he 转成 I wonder where he is</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">名词性从句内通常主语在助动词或系动词之前</tspan></text>
<rect x="42" y="328" width="1116" height="394" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="328" width="10" height="394" rx="5" fill="#4c8b83"/>
<text x="74" y="370" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="436" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">课堂笔记原例</tspan></text>
<circle cx="113" cy="480" r="4" fill="#6c8da9"/>
<text x="130" y="486" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">What is your name 变成 I wonder what your name is</tspan></text>
<text x="78" y="526" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="570" r="4" fill="#6c8da9"/>
<text x="130" y="576" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Where does she work 变成 Do you know where she works</tspan></text>
<circle cx="113" cy="606" r="4" fill="#6c8da9"/>
<text x="130" y="612" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">When will they arrive 变成 I don't know when they will arrive</tspan></text>
<circle cx="113" cy="642" r="4" fill="#6c8da9"/>
<text x="130" y="648" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Who came to the meeting 变成 I know who came to the meeting</tspan></text>
<circle cx="113" cy="678" r="4" fill="#6c8da9"/>
<text x="130" y="684" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">who 本身作主语 不要人为加倒装</tspan></text>
<rect x="42" y="740" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="740" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="782" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="838" r="4" fill="#6c8da9"/>
<text x="102" y="844" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">I don't know where is he 错在从句中倒装</tspan></text>
<circle cx="85" cy="874" r="4" fill="#6c8da9"/>
<text x="102" y="880" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">主句是疑问句也不改变从句的陈述语序</tspan></text>
<circle cx="85" cy="910" r="4" fill="#6c8da9"/>
<text x="102" y="916" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Could you tell me where the bank is</tspan></text>
<text x="42" y="990" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-8</text>
</svg>