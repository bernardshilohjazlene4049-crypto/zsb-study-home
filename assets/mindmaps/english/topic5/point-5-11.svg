<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="874" viewBox="0 0 1200 874" role="img" aria-labelledby="svg-title svg-desc" data-point-id="point-5-11" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif">
<title id="svg-title">考点 5-11｜形式宾语 it 与双宾语</title>
<desc id="svg-desc">依据已交付专题五导图源稿生成的本地静态思维导图。</desc>
<rect width="1200" height="874" fill="#f3f6fa"/>
<rect x="28" y="28" width="1144" height="82" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/>
<text x="600" y="78" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">形式宾语 it 与双宾语</tspan></text>
<rect x="42" y="132" width="1116" height="214" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="132" width="10" height="214" rx="5" fill="#4c8b83"/>
<text x="74" y="174" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">规则</tspan></text>
<circle cx="85" cy="230" r="4" fill="#6c8da9"/>
<text x="102" y="236" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">有宾语补足语时 find/think/consider/make 常用 it 作形式宾语</tspan></text>
<circle cx="85" cy="266" r="4" fill="#6c8da9"/>
<text x="102" y="272" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">把较长的 that 从句或 to do 放后</tspan></text>
<circle cx="85" cy="302" r="4" fill="#6c8da9"/>
<text x="102" y="308" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">I think it necessary that we should start now</tspan></text>
<rect x="42" y="364" width="1116" height="268" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="364" width="10" height="268" rx="5" fill="#4c8b83"/>
<text x="74" y="406" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">例句来源</tspan></text>
<text x="78" y="472" font-size="19" fill="#35756e" font-weight="700" text-anchor="start"><tspan x="78" dy="0">补充例句</tspan></text>
<circle cx="113" cy="516" r="4" fill="#6c8da9"/>
<text x="130" y="522" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">We found it surprising that he knew the answer</tspan></text>
<circle cx="113" cy="552" r="4" fill="#6c8da9"/>
<text x="130" y="558" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">She showed us what she had made</tspan></text>
<circle cx="113" cy="588" r="4" fill="#6c8da9"/>
<text x="130" y="594" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="130" dy="0">us 是间接宾语  what 从句是直接宾语</tspan></text>
<rect x="42" y="650" width="1116" height="178" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2"/>
<rect x="42" y="650" width="10" height="178" rx="5" fill="#4c8b83"/>
<text x="74" y="692" font-size="23" fill="#234c69" font-weight="700" text-anchor="start"><tspan x="74" dy="0">易错点</tspan></text>
<circle cx="85" cy="748" r="4" fill="#6c8da9"/>
<text x="102" y="754" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">it 不是由从句连接词替代</tspan></text>
<circle cx="85" cy="784" r="4" fill="#6c8da9"/>
<text x="102" y="790" font-size="18" fill="#2f3f50" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不能把 find it useful to 中的 it 改成 that</tspan></text>
<text x="42" y="864" font-size="14" fill="#68798b">专题五 · 名词性从句 · 考点 5-11</text>
</svg>