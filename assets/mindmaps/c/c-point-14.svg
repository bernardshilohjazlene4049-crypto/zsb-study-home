<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1417" viewBox="0 0 1200 1417" role="img" aria-labelledby="svg-title" data-topic-id="c.ch5.nested_ternary" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-14 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="1417" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">if 嵌套配对法则、语法坑与三目等价代入法</tspan></text><path d="M 54 90 L 54 1062.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 281.5 L 74 281.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 817.5 L 74 817.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1062.5 L 74 1062.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 330.5 L 104 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 379.5 L 104 379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 428.5 L 104 428.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 477.5 L 104 477.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 526.5 L 104 526.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 587.0 L 104 587.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 647.5 L 104 647.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 708.0 L 104 708.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 768.5 L 104 768.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 838 L 88 866.5 L 104 866.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 838 L 88 915.5 L 104 915.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 838 L 88 964.5 L 104 964.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 838 L 88 1013.5 L 104 1013.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1083 L 88 1111.5 L 104 1111.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1132 L 118 1172.0 L 134 1172.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1083 L 88 1244.0 L 104 1244.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1083 L 88 1316.0 L 104 1316.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">2.4 if 嵌套下划线配对法与 2.5 语法注意事项</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">3. 三目运算符回顾与 【等价题型】代入法</tspan></text><rect x="74" y="261" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="284" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="310" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">if 嵌套配对铁律（下划线配对法）：① 第一个 if 画 1 个下划线，嵌套多 1 个下划线</tspan></text><rect x="104" y="359" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② else / else if 必须与其之前、最近、且未被配对的 if（或 else if 中的 if）配对</tspan></text><rect x="104" y="408" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">③ 配对的一对下划线数量一样</tspan></text><rect x="104" y="457" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">if 语法注意事项①：()、表达式、语句均不可省略</tspan></text><rect x="104" y="506" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">什么都不执行需写空语句 ; 或空复合语句 {}</tspan></text><rect x="104" y="555" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">if 语法注意事项②：if / else if / else 默认只管紧随其后的 1 条语句，执行多条必须用 { }</tspan><tspan x="120" dy="23.0">括成复合语句</tspan></text><rect x="104" y="627" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="650" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">三目运算符 ?: 等价于 if-else 双分支，多个三目右结合（先算右边），用高归入法划界</tspan></text><rect x="104" y="676" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="699" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">【等价题型】代入法 5 步：找出待等价表达式（如 (exp)?a++:b-- 中的 exp）→ 明确只有真/假 →</tspan><tspan x="120" dy="23.0">取非 0 具体值（如 3…</tspan></text><rect x="104" y="748" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="771" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">）和 0 → 分别代入 A/B/C/D 选项，结果完全相同即等价</tspan></text><rect x="74" y="797" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="820" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="846" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="869" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">if 嵌套三步做题法：① 先按就近未配对原则给所有 if / else 配对（画下划线）</tspan></text><rect x="104" y="895" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="918" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 写出缩进对齐的正确层级结构</tspan></text><rect x="104" y="944" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="967" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">③ 再按顺序逐步代入执行</tspan></text><rect x="104" y="993" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1016" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">等价题型代入法：见到 (exp)?a++:b-- 或 while(x) 问条件与哪个选项等价…）</tspan></text><rect x="74" y="1042" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1065" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="1091" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1114" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">被排版缩进欺骗！</tspan></text><rect x="134" y="1140" width="1028" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1163" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">if(a＞0) if(b＞0) x=1; else x=2; 中 else 配对的是内层 if(b＞0)</tspan><tspan x="150" dy="23.0">，绝不是外层 if(a＞0) ！</tspan></text><rect x="104" y="1212" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">误把 if(a ＞ b); printf("yes"); 看成条件成立才打印：后面的分号 ; 是空语句，printf</tspan><tspan x="120" dy="23.0">每次都会无条件执行！</tspan></text><rect x="104" y="1284" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1307" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">等价题代入值误取 1 ：若把 exp = 1 代入 exp == 1 会误判为等价，必须取非 0 非 1 的数（如</tspan><tspan x="120" dy="23.0">3） 和 0 ！</tspan></text></svg>