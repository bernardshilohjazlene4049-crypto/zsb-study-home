<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1844" viewBox="0 0 1200 1844" role="img" aria-labelledby="svg-title" data-topic-id="c.ch8.decl_pass" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-23 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="1844" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">函数声明（向前/extern）与值传递 vs 指针传递</tspan></text><path d="M 54 90 L 54 961.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 281.5 L 74 281.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 719.5 L 74 719.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 961.5 L 74 961.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 342.0 L 104 342.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 402.5 L 104 402.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 463.0 L 104 463.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 523.5 L 104 523.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 572.5 L 104 572.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 621.5 L 104 621.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 670.5 L 104 670.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 740 L 88 780.0 L 104 780.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 740 L 88 852.0 L 104 852.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 740 L 88 912.5 L 104 912.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 982 L 88 1010.5 L 104 1010.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1031 L 118 1071.0 L 134 1071.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 982 L 88 1131.5 L 104 1131.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 982 L 88 1180.5 L 104 1180.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">4. 函数声明（向前声明与 extern 外部声明）</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">5. 参数传递两种方式：值传递 vs 指针传递</tspan></text><rect x="74" y="261" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="284" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="310" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">函数声明（编译阶段检错）：函数首部 + ;，只不关心参数名（参数名可省略、可改写，如 int haha(int,</tspan><tspan x="120" dy="23.0">char); 合法）</tspan></text><rect x="104" y="382" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="405" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">需要声明的两种情况：① 同文件函数调用写在定义之上 → 向前声明（首部 + ;）</tspan></text><rect x="104" y="431" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="454" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 调用的函数/全局变量在外部文件 → extern 声明外部可用（如 extern int haha(int</tspan><tspan x="120" dy="23.0">a);）</tspan></text><rect x="104" y="503" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="526" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">【值传递】：实参值单向赋给形参，函数内修改形参绝不能修改实参</tspan></text><rect x="104" y="552" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="575" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">必背秒杀口诀：形参类型没有 * 也没有 ［］，就不可能修改实参！</tspan></text><rect x="104" y="601" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="624" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">【指针传递】函数内能修改实参的两大必要条件（缺一不可）：① 形参类型必须有 * 或 ［］</tspan></text><rect x="104" y="650" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="673" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 函数内部必须对形参取内容 * 或数组元素 ［］ 进行 ++、--、赋值！</tspan></text><rect x="74" y="699" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="722" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="748" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="771" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">秒判函数调用会不会改变 main 中实参值：① 先看形参列表有没有 * 或 ［］</tspan><tspan x="120" dy="23.0">（没有就直接答“不可能改，实参原值不变！”）</tspan></text><rect x="104" y="820" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="843" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 若有 * 或 ［］ ，再看函数体里有没有对 *形参或形参［下标］ 做赋值/ ++ / --</tspan><tspan x="120" dy="23.0">（两个条件同时具备才会修改实参！）</tspan></text><rect x="104" y="892" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="915" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">判函数声明合法题：只核对返回值类型、函数名、各参数类型顺序以及末尾有没有 ; ，形参名写不写、叫什么都完全合法！</tspan></text><rect x="74" y="941" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="964" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="990" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1013" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">见到指针形参就以为一定改了实参：错！</tspan></text><rect x="134" y="1039" width="1028" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1062" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">如 void f(int *p) { int b=5; p=&amp;b; } 只改了形参指针指向，没有通过 *p</tspan><tspan x="150" dy="23.0">改内容，实参不变！</tspan></text><rect x="104" y="1111" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1134" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">把 (*x)++ 错写成 *x++ ：单目右结合下 *x++ 先移指针 x 再取内容，并没有让原整数加 1！</tspan></text><rect x="104" y="1160" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1183" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">必须加括号 (*x)++ ！</tspan></text><rect x="24" y="1245" width="1152" height="10" rx="5" fill="#dce8f3"/><text x="44" y="1283" font-size="22" fill="#274d70" font-weight="700" text-anchor="start"><tspan x="44" dy="0.0">补充流程图</tspan></text><path d="M 500 1371 L 285 1429" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 700 1371 L 915 1429" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 285 1499 L 285 1579" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 915 1499 L 915 1579" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 915 1649 L 915 1729" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="1309" width="360" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="600.0" y="1342.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0.0">函数调用</tspan></text><rect x="70" y="1429" width="430" height="70" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="285.0" y="1466.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="285.0" dy="0.0">形参没有 * 也没有 []</tspan></text><rect x="700" y="1429" width="430" height="70" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="915.0" y="1466.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="915.0" dy="0.0">形参是 * 或 []</tspan></text><rect x="70" y="1579" width="430" height="70" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="285.0" y="1616.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="285.0" dy="0.0">只改形参副本，实参纹丝不动</tspan></text><rect x="700" y="1579" width="430" height="70" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="915.0" y="1616.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="915.0" dy="0.0">还须在函数内对 *x 或 a[] 改值</tspan></text><rect x="700" y="1729" width="430" height="70" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="915.0" y="1766.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="915.0" dy="0.0">自增必须写 (*x)++，不能写 *x++</tspan></text></svg>