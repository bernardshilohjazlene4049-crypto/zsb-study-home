<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2492" viewBox="0 0 1200 2492" role="img" aria-labelledby="svg-title" data-topic-id="c.ch6.for_loop" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-17 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="2492" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">for 循环执行流程与四类省略含义（for(;;);）</tspan></text><path d="M 54 90 L 54 1673.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 918.5 L 74 918.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1480.5 L 74 1480.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1673.5 L 74 1673.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 253 L 118 281.5 L 134 281.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 330.5 L 164 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 351 L 178 379.5 L 194 379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 351 L 178 428.5 L 194 428.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 477.5 L 164 477.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 498 L 178 526.5 L 194 526.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 498 L 178 575.5 L 194 575.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 624.5 L 164 624.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 645 L 178 673.5 L 194 673.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 645 L 178 722.5 L 194 722.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 771.5 L 164 771.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 820.5 L 194 820.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 869.5 L 194 869.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 967.5 L 104 967.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1016.5 L 104 1016.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1065.5 L 104 1065.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1114.5 L 104 1114.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1163.5 L 104 1163.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1224.0 L 104 1224.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1284.5 L 104 1284.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1333.5 L 104 1333.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1382.5 L 104 1382.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 939 L 88 1431.5 L 104 1431.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1501 L 88 1541.0 L 104 1541.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1501 L 88 1613.0 L 104 1613.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1694 L 88 1722.5 L 104 1722.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1743 L 118 1771.5 L 134 1771.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1694 L 88 1820.5 L 104 1820.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1694 L 88 1869.5 L 104 1869.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1890 L 118 1918.5 L 134 1918.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">3.1 ~ 3.3 for 循环语法与执行流程（① → ② → ④ → ③ → ②）</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">3.4 for 循环表达式与语句省略的意义（for(;;);）</tspan></text><rect x="134" y="261" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">正文表格</tspan></text><rect x="164" y="310" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">表达式 1 省略</tspan></text><rect x="194" y="359" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">语法是否合法：合法（需保留前分号）</tspan></text><rect x="194" y="408" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">具体含义与影响：无初始操作 （一般在 for 循环之前已完成初始化）</tspan></text><rect x="164" y="457" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">表达式 2 省略</tspan></text><rect x="194" y="506" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">语法是否合法：合法（需保留两个分号）</tspan></text><rect x="194" y="555" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">具体含义与影响：循环条件恒为真（永真） ，体内无 break/return 时成死循环</tspan></text><rect x="164" y="604" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="627" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">表达式 3 省略</tspan></text><rect x="194" y="653" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="676" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">语法是否合法：合法（需保留后分号）</tspan></text><rect x="194" y="702" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="725" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">具体含义与影响：无步进操作 （需在循环体内改变循环变量）</tspan></text><rect x="164" y="751" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="774" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">循环体省略（写 ; ）</tspan></text><rect x="194" y="800" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="823" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">语法是否合法：合法（空语句占位）</tspan></text><rect x="194" y="849" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="872" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">具体含义与影响：循环体为空语句，条件成立时不执行任何实质操作，直接执行步进</tspan></text><rect x="74" y="898" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="921" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="947" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="970" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">for 语法：() 中 3 个表达式用两个分号 ;; 分开</tspan></text><rect x="104" y="996" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1019" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">() 和 ;; 不可省略，3 个表达式均可省略</tspan></text><rect x="104" y="1045" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1068" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">循环体语句不能省略（最少写空语句 ;，如 for(;;);）</tspan></text><rect x="104" y="1094" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1117" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">默认管 1 条语句，多条用 {}</tspan></text><rect x="104" y="1143" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1166" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">最少 0 次，最多无数次</tspan></text><rect x="104" y="1192" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1215" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">执行顺序（必考）：① 初始操作（进循环仅执行 1 次）→ ② 循环条件（真进④，假退出）→ ④ 循环体 → ③ 步进</tspan><tspan x="120" dy="23.0">→ 回到 ② 条件判断</tspan></text><rect x="104" y="1264" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1287" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">表达式 1 省略：无初始操作（通常在 for 之前已完成变量赋初值）</tspan></text><rect x="104" y="1313" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1336" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">表达式 2 省略：循环条件恒为真（永真，若体内无 break/return 会死循环）</tspan></text><rect x="104" y="1362" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1385" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">表达式 3 省略：无步进操作（需在循环体内改变变量，否则易死循环）</tspan></text><rect x="104" y="1411" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1434" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">循环体省略（写分号 ;）：循环体为空语句，条件为真时执行空操作后直接走步进</tspan></text><rect x="74" y="1460" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1483" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="1509" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1532" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">for 读程序写结果 4 列追踪法：先单独执行表达式①，再列出「 有关变量 | 条件② | 循环体④ | 步进③</tspan><tspan x="120" dy="23.0">」表格…</tspan></text><rect x="104" y="1581" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1604" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">检查 for 末尾误写分号：for(i=1; i＜=5; i++); printf("%d", i);</tspan><tspan x="120" dy="23.0">中分号是空循环体…</tspan></text><rect x="74" y="1653" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1676" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="1702" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1725" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">搞错执行顺序以为先步进③再执行循环体④：错！</tspan></text><rect x="134" y="1751" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1774" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">一定是 ① → ② → ④ → ③ → ② ！</tspan></text><rect x="104" y="1800" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1823" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">漏算最后一次退出循环时的 i 值：for(i=0; i＜5; i++) 结束时 i 的值是 5 （不是 4 ）！</tspan></text><rect x="104" y="1849" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1872" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">认为 for(;;) 语法错误：合法！</tspan></text><rect x="134" y="1898" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1921" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">只要保留两个分号 ;; ，三个表达式都可以省略，此时相当于 while(1)</tspan></text><rect x="24" y="1983" width="1152" height="10" rx="5" fill="#dce8f3"/><text x="44" y="2021" font-size="22" fill="#274d70" font-weight="700" text-anchor="start"><tspan x="44" dy="0.0">补充流程图</tspan></text><path d="M 540 2109 L 540 2147" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 540 2209 L 540 2257" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="580" y="2237" font-size="14" fill="#476681" text-anchor="middle">为真</text><path d="M 540 2319 L 540 2367" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 720 2178 L 820 2178" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="770" y="2165" font-size="14" fill="#476681" text-anchor="middle">为假</text><path d="M 360 2398 C 240 2398, 240 2178, 360 2178" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="360" y="2047" width="360" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="540.0" y="2080.2400000000002" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="540.0" dy="0.0">表达式 1：只在进入时初始化一次</tspan></text><rect x="360" y="2147" width="360" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="540.0" y="2180.2400000000002" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="540.0" dy="0.0">表达式 2：判断条件</tspan></text><rect x="360" y="2257" width="360" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="540.0" y="2290.2400000000002" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="540.0" dy="0.0">执行循环体</tspan></text><rect x="360" y="2367" width="360" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="540.0" y="2400.2400000000002" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="540.0" dy="0.0">表达式 3：步进</tspan></text><rect x="820" y="2147" width="280" height="62" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="960.0" y="2180.2400000000002" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="960.0" dy="0.0">结束循环</tspan></text></svg>