<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2328" viewBox="0 0 1200 2328" role="img" aria-labelledby="svg-title" data-topic-id="c.ch8.scope_static" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-24 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="2328" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">全局变量、局部变量与 static 静态变量（四维对比 + 就近原则）</tspan></text><path d="M 54 90 L 54 1993.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1310.5 L 74 1310.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1725.5 L 74 1725.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1993.5 L 74 1993.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 204 L 118 232.5 L 134 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 253 L 148 281.5 L 164 281.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 302 L 178 330.5 L 194 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 302 L 178 379.5 L 194 379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 302 L 178 428.5 L 194 428.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 302 L 178 477.5 L 194 477.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 253 L 148 526.5 L 164 526.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 547 L 178 575.5 L 194 575.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 547 L 178 624.5 L 194 624.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 547 L 178 673.5 L 194 673.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 547 L 178 722.5 L 194 722.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 253 L 148 771.5 L 164 771.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 820.5 L 194 820.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 869.5 L 194 869.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 918.5 L 194 918.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 792 L 178 967.5 L 194 967.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 253 L 148 1016.5 L 164 1016.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 1037 L 178 1065.5 L 194 1065.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 1037 L 178 1114.5 L 194 1114.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 1037 L 178 1163.5 L 194 1163.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 1037 L 178 1212.5 L 194 1212.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 1261.5 L 104 1261.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1359.5 L 104 1359.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1408.5 L 104 1408.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1469.0 L 104 1469.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1529.5 L 104 1529.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1578.5 L 104 1578.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1331 L 88 1627.5 L 104 1627.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1648 L 118 1676.5 L 134 1676.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1746 L 88 1774.5 L 104 1774.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1746 L 88 1835.0 L 104 1835.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1746 L 88 1895.5 L 104 1895.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1746 L 88 1944.5 L 104 1944.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2014 L 88 2042.5 L 104 2042.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2014 L 88 2091.5 L 104 2091.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2014 L 88 2140.5 L 104 2140.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2014 L 88 2189.5 L 104 2189.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2014 L 88 2238.5 L 104 2238.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">6. 四类变量核心对比表（默认值 / 生命周期 / 使用范围，必须背）</tspan></text><rect x="134" y="212" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">正文表格</tspan></text><rect x="164" y="261" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">全局变量</tspan></text><rect x="194" y="310" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">定义位置特征：在所有 {} 之外</tspan></text><rect x="194" y="359" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">默认值（未赋初值）：0</tspan></text><rect x="194" y="408" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">生命周期：程序开始到程序结束</tspan></text><rect x="194" y="457" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">使用范围（作用域）：整个程序 （可 extern）</tspan></text><rect x="164" y="506" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">局部变量（含形参）</tspan></text><rect x="194" y="555" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">定义位置特征：在 {} 之内</tspan></text><rect x="194" y="604" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="627" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">默认值（未赋初值）：垃圾值 / 随机值</tspan></text><rect x="194" y="653" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="676" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">生命周期：定义开始到 } 结束</tspan></text><rect x="194" y="702" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="725" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">使用范围（作用域）：当前 {} 内</tspan></text><rect x="164" y="751" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="774" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">静态全局变量</tspan></text><rect x="194" y="800" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="823" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">定义位置特征：全局变量前加 static</tspan></text><rect x="194" y="849" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="872" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">默认值（未赋初值）：0</tspan></text><rect x="194" y="898" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="921" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">生命周期：程序开始到程序结束</tspan></text><rect x="194" y="947" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="970" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">使用范围（作用域）：仅当前文件内可用 （禁 extern）</tspan></text><rect x="164" y="996" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="1019" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">静态局部变量</tspan></text><rect x="194" y="1045" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="1068" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">定义位置特征：局部变量前加 static</tspan></text><rect x="194" y="1094" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="1117" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">默认值（未赋初值）：0</tspan></text><rect x="194" y="1143" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="1166" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">生命周期：定义执行开始到程序结束</tspan></text><rect x="194" y="1192" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="1215" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">使用范围（作用域）：当前 {} 内</tspan></text><rect x="104" y="1241" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1264" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">讲义综合案例逐行填空详解</tspan></text><rect x="74" y="1290" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1313" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="1339" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1362" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">全局变量（所有 {} 外）：默认值 0，生命周期程序开始到结束，范围整个程序（可 extern 跨文件）</tspan></text><rect x="104" y="1388" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1411" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">局部变量（{} 内，含形参）：默认值垃圾值/随机值，生命周期定义开始到 } 结束，范围仅当前 {} 内</tspan></text><rect x="104" y="1437" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1460" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">静态全局变量（全局 + static）：默认值 0，生命周期程序开始到结束，范围仅当前文件内（禁止外部用</tspan><tspan x="120" dy="23.0">extern 声明！）</tspan></text><rect x="104" y="1509" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1532" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">静态局部变量（局部 + static）：默认值 0，生命周期从定义执行开始到程序结束，范围当前 {} 内</tspan></text><rect x="104" y="1558" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1581" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">定义初始化语句只执行 1 次！</tspan></text><rect x="104" y="1607" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1630" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">形参也属于局部变量，只能在所属函数内使用</tspan></text><rect x="134" y="1656" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1679" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">全局变量与局部变量重名时，采用就近原则（局部优先屏蔽全局）</tspan></text><rect x="74" y="1705" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1728" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="1754" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1777" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">做带 static 读程序写结果题（专升本超高频！</tspan></text><rect x="104" y="1803" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1826" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">）：在 static int x = 初始值; 旁画一颗星—— 第 1 次调用执行赋初值，第 2、3、...</tspan><tspan x="120" dy="23.0">次调用彻底跳过这句初始化…</tspan></text><rect x="104" y="1875" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1898" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">做同名变量遮蔽题：在函数内部找有没有同名的局部变量/形参</tspan></text><rect x="104" y="1924" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1947" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">有就用局部（就近原则），没有才往外找全局变量</tspan></text><rect x="74" y="1973" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1996" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="2022" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2045" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">普通局部变量未初始化时默认值是垃圾值/随机值 ，绝不是 0！</tspan></text><rect x="104" y="2071" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2094" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">（只有全局和 static 变量默认才是 0）</tspan></text><rect x="104" y="2120" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2143" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">extern static int b; 属于语法冲突错误！</tspan></text><rect x="104" y="2169" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2192" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">static 锁死仅本文件可见，extern 要跨文件可见，二者水火不容</tspan></text><rect x="104" y="2218" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2241" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">代码块 { int k = 20; } 结束后，在花括号外面再使用 k 直接编译报错（超出作用域）</tspan></text></svg>