<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1495" viewBox="0 0 1200 1495" role="img" aria-labelledby="svg-title" data-topic-id="c.ch6.control_coding" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-18 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="1495" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">控制语句总结、break/continue 辨析与循环编程模板</tspan></text><path d="M 54 90 L 54 1160.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 281.5 L 74 281.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 843.5 L 74 843.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1160.5 L 74 1160.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 330.5 L 104 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 379.5 L 104 379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 428.5 L 104 428.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 477.5 L 104 477.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 526.5 L 104 526.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 575.5 L 104 575.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 636.0 L 104 636.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 696.5 L 104 696.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 745.5 L 104 745.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 302 L 88 794.5 L 104 794.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 864 L 88 892.5 L 104 892.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 864 L 88 941.5 L 104 941.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 864 L 88 990.5 L 104 990.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 864 L 88 1039.5 L 104 1039.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 864 L 88 1100.0 L 104 1100.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1181 L 88 1209.5 L 104 1209.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1230 L 118 1258.5 L 134 1258.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1181 L 88 1307.5 L 104 1307.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1181 L 88 1356.5 L 104 1356.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1181 L 88 1405.5 L 104 1405.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">4. 全部控制语句 4 条黄金总结（必须背）</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">5. 典型循环编程模板（等差数列累加求和三版本对照）</tspan></text><rect x="74" y="261" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="284" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="310" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">控制语句总结①：所有控制语句中，只有 switch 后必须有 {}</tspan></text><rect x="104" y="359" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">其余默认只管 1 条语句，多条用 {} 括起</tspan></text><rect x="104" y="408" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">控制语句总结②：所有控制语句中，只有 do-while() 后必须有分号 ;</tspan></text><rect x="104" y="457" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">控制语句总结③：while、for 先判断后执行（最少 0 次）</tspan></text><rect x="104" y="506" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">do-while 先执行后判断（最少 1 次）</tspan></text><rect x="104" y="555" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">break; 作用：结束当前层循环或当前层 switch（嵌套循环里只跳出所在那一层！）</tspan></text><rect x="104" y="604" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="627" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">continue; 作用：结束当前这一次循环，前往下一次循环——在 while / do-while</tspan><tspan x="120" dy="23.0">中直接去判断表达式</tspan></text><rect x="104" y="676" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="699" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">在 for 中直接前往步进③，步进完再判条件②！</tspan></text><rect x="104" y="725" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="748" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">等差数列循环编程四要素：初值、终值、等差（步进）、计算</tspan></text><rect x="104" y="774" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="797" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">累加求和和初值为 0（非等差项先放进和中），推荐优先用 for</tspan></text><rect x="74" y="823" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="846" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="872" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="895" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">读含 break / continue 的循环题：一标清是 while 还是 for</tspan></text><rect x="104" y="921" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="944" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">二遇 continue 在 for 里画箭头指向步进③ ，在 while 里画箭头指向条件判断</tspan></text><rect x="104" y="970" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="993" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">三遇 break 只画箭头跳出当前这一层循环/switch</tspan></text><rect x="104" y="1019" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1042" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">写循环累加/累乘编程题：先写清“初值、终值、步进、计算式”</tspan></text><rect x="104" y="1068" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1091" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">累加和初值 sum = 0 ，累乘积初值 prod = 1 ，优先用 for(初值; 终值条件; 步进) 计算;</tspan><tspan x="120" dy="23.0">简洁不易忘步进</tspan></text><rect x="74" y="1140" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1163" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="1189" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1212" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">以为 break 能直接跳出两层嵌套循环：错！</tspan></text><rect x="134" y="1238" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1261" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">break 只能结束当前所在的那一层循环或 switch</tspan></text><rect x="104" y="1287" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1310" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">以为 for 循环里的 continue 会跳过步进③：错！</tspan></text><rect x="104" y="1336" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1359" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">for 中的 continue 会先执行步进③ 再去判断条件②！</tspan></text><rect x="104" y="1385" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1408" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">累加求和忘了把 sum 初始化为 0 （局部变量未初始化是随机垃圾值）</tspan></text></svg>