d"/><path d="M 88 1158 L 88 1296.0 L 104 1296.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1377 L 88 1405.5 L 104 1405.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1377 L 88 1454.5 L 104 1454.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">程序从编辑到运行的完整过程（必须背）</tspan></text><rect x="134" y="212" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">正文表格</tspan></text><rect x="164" y="261" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">编辑</tspan></text><rect x="194" y="310" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">作用 / 功能：编写 C 语言源代码</tspan></text><rect x="194" y="359" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">产生文件 / 效果：产生源程序文件 .c</tspan></text><rect x="164" y="408" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">编译</tspan></text><rect x="194" y="457" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">作用 / 功能：将 C 语言文件生成二进制目标程序</tspan></text><rect x="194" y="506" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">产生文件 / 效果：一个 .c 会产生一个 .obj</tspan></text><rect x="164" y="555" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">链接</tspan></text><rect x="194" y="604" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="627" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">作用 / 功能：将当前项目中所有的目标程序和库链接成一个可执行文件</tspan></text><rect x="194" y="653" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="676" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">产生文件 / 效果：整个项目会生成一个 .exe 文件</tspan></text><rect x="164" y="702" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="725" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">执行</tspan></text><rect x="194" y="751" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="774" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">作用 / 功能：运行 .exe 可执行文件</tspan></text><rect x="194" y="800" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="823" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">产生文件 / 效果：代码将会运行，代码功能将会实现</tspan></text><rect x="74" y="849" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="872" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="898" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="921" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">步骤① 编辑：编写 C 代码 → 产生源程序文件 .c</tspan></text><rect x="104" y="947" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="970" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">步骤② 编译：将 C 语言源文件生成二进制目标程序 → 一个 .c 会产生一个 .obj（此时进行语法检查）</tspan></text><rect x="104" y="996" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1019" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">步骤③ 链接：将当前项目中所有的目标程序（.obj）和系统库链接成一个可执行文件 → 整个项目生成一个 .exe</tspan><tspan x="120" dy="23.0">文件</tspan></text><rect x="104" y="1068" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1091" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">步骤④ 执行：运行 .exe 文件 → 代码运行，实现程序功能</tspan></text><rect x="74" y="1117" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1140" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="1166" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1189" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">顺序题：严格记住 4 步先后顺序「编辑 → 编译 → 链接 → 执行」，中间不可跳过</tspan></text><rect x="104" y="1215" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1238" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">后缀对应题：编辑出 .c ，编译出 .obj （二进制目标程序），链接出 .exe （可执行文件）</tspan></text><rect x="104" y="1264" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1287" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">数量对应题：项目里有 N 个 .c 文件 → 编译后有 N 个 .obj 文件 → 链接后整个项目只有 1 个</tspan><tspan x="120" dy="23.0">.exe 文件</tspan></text><rect x="74" y="1336" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1359" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="1385" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1408" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">不能直接运行 .c 或 .obj 文件，必须经过链接生成 .exe 后才能执行</tspan></text><rect x="104" y="1434" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1457" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">不要把编译（生成 .obj ）和链接（生成 .exe ）的产物后缀记反！</tspan></text><rect x="24" y="1519" width="1152" height="10" rx="5" fill="#dce8f3"/><text x="44" y="1557" font-size="22" fill="#274d70" font-weight="700" text-anchor="start"><tspan x="44" dy="0.0">补充流程图</tspan></text><rect x="200" y="1587" width="800" height="58" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="600.0" y="1608.0" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0.0">编辑</tspan><tspan x="600.0" dy="20.5">得到 .c 源文件</tspan></text><path d="M 600.0 1645 L 600.0 1671" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="200" y="1677" width="800" height="58" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="600.0" y="1698.0" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0.0">编译</tspan><tspan x="600.0" dy="20.5">每个 .c 出一个 .obj</tspan></text><path d="M 600.0 1735 L 600.0 1761" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="200" y="1767" width="800" height="58" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="600.0" y="1788.0" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0.0">链接</tspan><tspan x="600.0" dy="20.5">整个项目出一个 .exe</tspan></text><path d="M 600.0 1825 L 600.0 1851" fill="none" stroke="#557da4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="200" y="1857" width="800" height="58" rx="12" fill="#f8fbff" stroke="#6689ad" stroke-width="2"/><text x="600.0" y="1888.24" font-size="16" fill="#203247" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0.0">执行</tspan></text></svg>