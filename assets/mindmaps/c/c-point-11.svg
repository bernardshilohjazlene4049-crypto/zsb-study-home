<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2443" viewBox="0 0 1200 2443" role="img" aria-labelledby="svg-title" data-topic-id="c.ch4.printf" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-11 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="2443" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">标准输出函数 printf（域宽、精度、对齐与转义）</tspan></text><path d="M 54 90 L 54 2183.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1108.5 L 74 1108.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1791.5 L 74 1791.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 2183.5 L 74 2183.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 253 L 118 281.5 L 134 281.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 330.5 L 164 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 351 L 178 391.0 L 194 391.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 451.5 L 164 451.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 472 L 178 500.5 L 194 500.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 549.5 L 164 549.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 570 L 178 610.0 L 194 610.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 670.5 L 164 670.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 691 L 178 731.0 L 194 731.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 791.5 L 164 791.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 812 L 178 840.5 L 194 840.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 889.5 L 164 889.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 910 L 178 938.5 L 194 938.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 987.5 L 164 987.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 1008 L 178 1048.0 L 194 1048.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1169.0 L 104 1169.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1229.5 L 104 1229.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1290.0 L 104 1290.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1350.5 L 104 1350.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1399.5 L 104 1399.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1448.5 L 104 1448.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1497.5 L 104 1497.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1546.5 L 104 1546.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1595.5 L 104 1595.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1644.5 L 104 1644.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1693.5 L 104 1693.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1129 L 88 1742.5 L 104 1742.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 1840.5 L 104 1840.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 1889.5 L 104 1889.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 1938.5 L 104 1938.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 1987.5 L 104 1987.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 2036.5 L 104 2036.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 2085.5 L 104 2085.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1812 L 88 2134.5 L 104 2134.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2204 L 88 2232.5 L 104 2232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2204 L 88 2293.0 L 104 2293.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 2204 L 88 2353.5 L 104 2353.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">1. printf 语法与格式控制字符串组成</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">2. printf 域宽、精度、对齐与特殊符号 11 条扩展</tspan></text><rect x="134" y="261" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">正文表格</tspan></text><rect x="164" y="310" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">printf("%4d", a);</tspan></text><rect x="194" y="359" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：占 4 列宽，默认右对齐，不足 4 位左边补空格，超过 4</tspan><tspan x="210" dy="23.0">位按实际宽度输出</tspan></text><rect x="164" y="431" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="454" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">printf("%8.2f", b);</tspan></text><rect x="194" y="480" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="503" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：总宽 8 列（含小数点）、保留 2 位小数、默认右对齐，不足左补空格</tspan></text><rect x="164" y="529" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="552" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">printf("%-8.2f", c);</tspan></text><rect x="194" y="578" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="601" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：总宽 8 列、保留 2 位小数、左对齐（右边补空格）</tspan><tspan x="210" dy="23.0">（注：原讲义印刷误写“右对齐”，- 实为左对齐）</tspan></text><rect x="164" y="650" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="673" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">printf("%+-8.2f", d);</tspan></text><rect x="194" y="699" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="722" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：输出带正负号（正数显 +，负数显 -）、总宽 8 列、保留 2</tspan><tspan x="210" dy="23.0">位小数、左对齐</tspan></text><rect x="164" y="771" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="794" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">printf("%08.2f", e);</tspan></text><rect x="194" y="820" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="843" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：总宽 8 列、保留 2 位小数、右对齐且域宽足够时左边补 0</tspan></text><rect x="164" y="869" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="892" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">输出字符串 100%</tspan></text><rect x="194" y="918" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="941" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：printf("100%%"); （用 %% 输出一个 % ）</tspan></text><rect x="164" y="967" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="990" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">输出字符串 ＼11111111＼</tspan></text><rect x="194" y="1016" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="1039" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">含义说明（含原讲义填空答案）：printf("＼＼11111111＼＼"); （用 ＼＼ 输出一个 ＼</tspan><tspan x="210" dy="23.0">）</tspan></text><rect x="74" y="1088" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1111" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="1137" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1160" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">语法：printf("格式控制字符串", 输出列表); 其中格式控制串含 ① 格式声明(%开头) ②</tspan><tspan x="120" dy="23.0">转义字符(＼开头) ③…</tspan></text><rect x="104" y="1209" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1232" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">输出列表可为常量、变量、表达式</tspan></text><rect x="104" y="1258" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1281" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">经典教材考题口径：printf 输出 float/double 用 %f（%lf 只用于 double 的</tspan><tspan x="120" dy="23.0">scanf 输入</tspan></text><rect x="104" y="1330" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1353" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">注：C99 起 printf 亦兼容 %lf，考试选择题按讲义记）</tspan></text><rect x="104" y="1379" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1402" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">域宽与精度：默认右对齐（域宽不够按实际宽度输出，够则左补空格）</tspan></text><rect x="104" y="1428" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1451" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">%8.2f 表示总宽 8 列（算小数点）、保留 2 位小数、右对齐</tspan></text><rect x="104" y="1477" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1500" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">标志修饰符：- 表示左对齐（右边补空格，如 %-8.2f）</tspan></text><rect x="104" y="1526" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1549" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">+ 表示输出带正负号（如 %+-8.2f）</tspan></text><rect x="104" y="1575" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1598" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">0 表示域宽足够时左补 0（如 %08.2f）</tspan></text><rect x="104" y="1624" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1647" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">特殊符号输出：输出一个 % 用 %%（如 printf("100%%");）</tspan></text><rect x="104" y="1673" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1696" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">输出一个 ＼ 用 ＼＼（如 printf("＼＼11111111＼＼");）</tspan></text><rect x="104" y="1722" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1745" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">字面量标识（L、f、0、0x、''、""）只写在代码里告诉编译器，计算机不存储、输出时不输出、键盘输入时也不输入</tspan></text><rect x="74" y="1771" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1794" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="1820" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1843" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">printf 读程序写结果 4 步法：① 看 () 有几部分（只有 "" 说明直接印字符串）</tspan></text><rect x="104" y="1869" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1892" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 先看 "" ：普通字符原样写，格式声明画下划线，转义字符按含义写</tspan></text><rect x="104" y="1918" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1941" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">③ 按顺序把输出列表值以对应格式填入下划线</tspan></text><rect x="104" y="1967" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1990" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">④ 誊抄到答题卡</tspan></text><rect x="104" y="2016" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2039" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">printf 编程 3 步法：① 先写 printf();</tspan></text><rect x="104" y="2065" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2088" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 草纸写出目标输出，把数据挑到输出列表</tspan></text><rect x="104" y="2114" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2137" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">③ 把原句中数据换成对应 % 格式声明放进 ""</tspan></text><rect x="74" y="2163" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="2186" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="2212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">勘误提醒：原讲义第 3 页第 (5) 条标题误印为“设置数据输出右对齐，用 -”，实际 C 语言中默认是右对齐…</tspan></text><rect x="104" y="2261" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">域宽不够时绝不会截断数据 ，而是按实际宽度完整输出（如 printf("%2d", 1234) 输出完整 1234</tspan><tspan x="120" dy="23.0">）</tspan></text><rect x="104" y="2333" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="2356" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">%8.2f 的总宽 8 列包含整数位、小数点 . 和 2 位小数位（小数点也要占 1 格！）</tspan></text></svg>