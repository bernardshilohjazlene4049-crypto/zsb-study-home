<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2005" viewBox="0 0 1200 2005" role="img" aria-labelledby="svg-title" data-topic-id="c.ch2.identifier" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><title id="svg-title">point-4 思维导图</title><desc>依据 C 语言已交付导图源稿生成的本地静态图；未补写源稿未明确的内容。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#557da4"/></marker></defs><rect x="0" y="0" width="1200" height="2005" fill="#f4f7fb"/><rect x="28" y="28" width="1144" height="62" rx="18" fill="#203d61" stroke="#17324f" stroke-width="2"/><text x="600.0" y="62" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0.0">标识符命名规则、32 个关键字与常量/变量概念</tspan></text><path d="M 54 90 L 54 1768.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 134.5 L 74 134.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1036.5 L 74 1036.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1428.5 L 74 1428.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 54 1768.5 L 74 1768.5" fill="none" stroke="#91abc5" stroke-width="2.2"/><path d="M 88 155 L 88 183.5 L 104 183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 232.5 L 104 232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 253 L 118 281.5 L 134 281.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 330.5 L 164 330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 351 L 178 379.5 L 194 379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 351 L 178 440.0 L 194 440.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 500.5 L 164 500.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 521 L 178 549.5 L 194 549.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 521 L 178 610.0 L 194 610.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 670.5 L 164 670.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 691 L 178 719.5 L 194 719.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 691 L 178 768.5 L 194 768.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 302 L 148 817.5 L 164 817.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 838 L 178 866.5 L 194 866.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 838 L 178 927.0 L 194 927.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 155 L 88 987.5 L 104 987.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1085.5 L 104 1085.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1134.5 L 104 1134.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1183.5 L 104 1183.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1232.5 L 104 1232.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1281.5 L 104 1281.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1057 L 88 1330.5 L 104 1330.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 118 1351 L 118 1379.5 L 134 1379.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1449 L 88 1477.5 L 104 1477.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1449 L 88 1526.5 L 104 1526.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1449 L 88 1587.0 L 104 1587.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1449 L 88 1647.5 L 104 1647.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1449 L 88 1708.0 L 104 1708.0" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1789 L 88 1817.5 L 104 1817.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1789 L 88 1866.5 L 104 1866.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 88 1789 L 88 1915.5 L 104 1915.5" fill="none" stroke="#91abc5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="114" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="137" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">正文脉络</tspan></text><rect x="104" y="163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">1. 标识符命名规则（必考前三点 + 大小写）</tspan></text><rect x="104" y="212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">2. C 语言 32 个关键字分类速记（全为小写）</tspan></text><rect x="134" y="261" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">正文表格</tspan></text><rect x="164" y="310" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">数据类型关键字</tspan></text><rect x="194" y="359" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">数量：12 个</tspan></text><rect x="194" y="408" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="431" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">关键字清单（必熟记，不能作标识符）：char、short、int、long、float、double、s</tspan><tspan x="210" dy="23.0">igned、unsigned…</tspan></text><rect x="164" y="480" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="503" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">控制语句关键字</tspan></text><rect x="194" y="529" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="552" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">数量：8 个</tspan></text><rect x="194" y="578" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="601" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">关键字清单（必熟记，不能作标识符）：if、else、switch、case、default、for、wh</tspan><tspan x="210" dy="23.0">ile、do</tspan></text><rect x="164" y="650" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="673" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">转向语句关键字</tspan></text><rect x="194" y="699" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="722" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">数量：4 个</tspan></text><rect x="194" y="748" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="771" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">关键字清单（必熟记，不能作标识符）：break、continue、goto、return</tspan></text><rect x="164" y="797" width="998" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="180" y="820" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="180" dy="0.0">其他 / 存储类关键字</tspan></text><rect x="194" y="846" width="968" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="869" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">数量：8 个</tspan></text><rect x="194" y="895" width="968" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="210" y="918" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="210" dy="0.0">关键字清单（必熟记，不能作标识符）：auto、static、register、extern、const、</tspan><tspan x="210" dy="23.0">volatile、sizeof…</tspan></text><rect x="104" y="967" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="990" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">3. 数据的两种表现形式：常量与变量</tspan></text><rect x="74" y="1016" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1039" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">必背结论</tspan></text><rect x="104" y="1065" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1088" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">标识符用于命名（常量名、变量名、函数名、数组名等）</tspan></text><rect x="104" y="1114" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1137" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">命名规则①：只能由字母、数字、下划线（_）组成（绝不能含空格、减号 -、$、@、小数点 . 等）</tspan></text><rect x="104" y="1163" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1186" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">命名规则②：第一个字符必须为字母或下划线（绝不能以数字开头）</tspan></text><rect x="104" y="1212" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1235" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">命名规则③：不能使用 C 语言关键字（如 int、if、for、return、sizeof 等）</tspan></text><rect x="104" y="1261" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1284" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">命名规则④：严格区分大小写（例如 Int、IF、For 因为大写了，都不是关键字，属于合法标识符！）</tspan></text><rect x="104" y="1310" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1333" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">常量：程序运行过程中其值不能改变的量</tspan></text><rect x="134" y="1359" width="1028" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="150" y="1382" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="150" dy="0.0">变量：程序运行过程中其值可以改变的量</tspan></text><rect x="74" y="1408" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1431" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">解题套路</tspan></text><rect x="104" y="1457" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1480" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">做标识符判断选择题三步排雷：① 扫非法字符（有 - 、$ 、. 、空格直接淘汰）</tspan></text><rect x="104" y="1506" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1529" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">② 扫首位（数字开头直接淘汰）</tspan></text><rect x="104" y="1555" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1578" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">③ 扫全小写关键字（ int/char/if/for/while/do/switch/case/break/retu</tspan><tspan x="120" dy="23.0">rn/sizeof/void…</tspan></text><rect x="104" y="1627" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1650" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">注意反套路：Int 、Main 、printf 、scanf 、define 、include 均不是关键字！</tspan></text><rect x="104" y="1676" width="1058" height="64" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1699" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">其中 define / include 是预处理指令名，printf / scanf</tspan><tspan x="120" dy="23.0">是库函数名，语法上属于合法用户标识符（虽不建议重名）</tspan></text><rect x="74" y="1748" width="1088" height="41" rx="11" fill="#e5eff9" stroke="#7397ba" stroke-width="1.6"/><text x="90" y="1771" font-size="18" fill="#1d3f61" font-weight="700" text-anchor="start"><tspan x="90" dy="0.0">易错点</tspan></text><rect x="104" y="1797" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1820" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">把减号 - （如 a-b ）看成下划线 _ （ a_b ）：- 非法，_ 合法！</tspan></text><rect x="104" y="1846" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1869" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">把带大写字母的词（如 Int 、Char 、IF ）误判为关键字：C 语言 32 个关键字全部是纯小写字母！</tspan></text><rect x="104" y="1895" width="1058" height="41" rx="11" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.6"/><text x="120" y="1918" font-size="17" fill="#26384a" font-weight="400" text-anchor="start"><tspan x="120" dy="0.0">把 sizeof 误认为函数：sizeof 是 C 语言 32 个关键字之一，不能用作变量名！</tspan></text></svg>