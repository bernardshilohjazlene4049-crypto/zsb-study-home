<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1272" viewBox="0 0 800 1272" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="math.discontinuity">
<title id="svg-title">考点十：间断点及类型的判定</title>
<desc id="svg-desc">间断点 x=x₀；按考点源稿整理的分支关系图。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173b5e"/><stop offset="1" stop-color="#285b7f"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="1272" rx="24" fill="url(#bg)"/>
<rect x="40" y="38" width="720" height="112" rx="22" fill="url(#root)" filter="url(#soft)"/>
<text x="400" y="77" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#d7e8f4">高数第一章 · 逐点思维导图</text>
<text x="400" y="121" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">间断点 x=x₀</text>
<path d="M400 150 V166 H72 V1082" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 228 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="190" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="190" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="228" r="21" fill="#e5eef5"/>
<text x="162" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">1</text>
<text x="198" y="238" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">先决条件</text>
<circle cx="202" cy="276" r="5" fill="#648aa6"/>
<text x="225" y="284" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">在 x0 的去心邻域内有定义</text>
<circle cx="202" cy="322" r="5" fill="#648aa6"/>
<text x="225" y="330" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" fill="#314a5e">若某一侧整个没有定义 则既不是连续点也不是间断点</text>
<path d="M72 432 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="394" width="650" height="218" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="394" width="9" height="218" rx="4" fill="#4e7896"/>
<circle cx="162" cy="432" r="21" fill="#e5eef5"/>
<text x="162" y="440" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">2</text>
<text x="198" y="442" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">三种不连续情形</text>
<circle cx="202" cy="480" r="5" fill="#648aa6"/>
<text x="225" y="488" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">在 x0 没有定义</text>
<circle cx="202" cy="526" r="5" fill="#648aa6"/>
<text x="225" y="534" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">有定义但极限不存在</text>
<circle cx="202" cy="572" r="5" fill="#648aa6"/>
<text x="225" y="580" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">极限存在但不等于 f(x0)</text>
<path d="M72 674 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="636" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="636" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="674" r="21" fill="#e5eef5"/>
<text x="162" y="682" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">3</text>
<text x="198" y="684" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">第一类：左右极限都存在</text>
<circle cx="202" cy="722" r="5" fill="#648aa6"/>
<text x="225" y="730" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">可去 左右极限相等</text>
<circle cx="202" cy="768" r="5" fill="#648aa6"/>
<text x="225" y="776" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">跳跃 左右极限不相等</text>
<path d="M72 878 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="840" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="840" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="878" r="21" fill="#e5eef5"/>
<text x="162" y="886" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">4</text>
<text x="198" y="888" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">第二类：至少一侧极限不存在</text>
<circle cx="202" cy="926" r="5" fill="#648aa6"/>
<text x="225" y="934" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">无穷 某一侧极限为 ∞</text>
<circle cx="202" cy="972" r="5" fill="#648aa6"/>
<text x="225" y="980" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">振荡 在某个区间里来回摆动</text>
<path d="M72 1082 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="1044" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="1044" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="1082" r="21" fill="#e5eef5"/>
<text x="162" y="1090" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">5</text>
<text x="198" y="1092" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">做题</text>
<circle cx="202" cy="1130" r="5" fill="#648aa6"/>
<text x="225" y="1138" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">先找可疑点（分母为 0、分段点）</text>
<circle cx="202" cy="1176" r="5" fill="#648aa6"/>
<text x="225" y="1184" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">再分别求左右极限来定类型</text>
</svg>
