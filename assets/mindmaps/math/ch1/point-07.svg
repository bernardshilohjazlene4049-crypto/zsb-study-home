<svg xmlns="http://www.w3.org/2000/svg" width="800" height="902" viewBox="0 0 800 902" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="math.important_limits">
<title id="svg-title">考点七：两个重要极限</title>
<desc id="svg-desc">两个重要极限；按考点源稿整理的分支关系图。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173b5e"/><stop offset="1" stop-color="#285b7f"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="902" rx="24" fill="url(#bg)"/>
<rect x="40" y="38" width="720" height="112" rx="22" fill="url(#root)" filter="url(#soft)"/>
<text x="400" y="77" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#d7e8f4">高数第一章 · 逐点思维导图</text>
<text x="400" y="121" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">两个重要极限</text>
<path d="M400 150 V166 H72 V750" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 228 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="190" width="650" height="218" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="190" width="9" height="218" rx="4" fill="#4e7896"/>
<circle cx="162" cy="228" r="21" fill="#e5eef5"/>
<text x="162" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">1</text>
<text x="198" y="238" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">第一个：0/0 型</text>
<circle cx="202" cy="276" r="5" fill="#648aa6"/>
<text x="225" y="284" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">lim x→0 sin x / x = 1</text>
<circle cx="202" cy="322" r="5" fill="#648aa6"/>
<text x="225" y="330" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">推广：□→0 时 sin□/□ = 1</text>
<circle cx="202" cy="368" r="5" fill="#648aa6"/>
<text x="225" y="376" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">注意：x→∞ 时 sin x / x = 0</text>
<path d="M72 470 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="432" width="650" height="256" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="432" width="9" height="256" rx="4" fill="#4e7896"/>
<circle cx="162" cy="470" r="21" fill="#e5eef5"/>
<text x="162" y="478" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">2</text>
<text x="198" y="480" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">第二个：1^∞ 型</text>
<circle cx="202" cy="518" r="5" fill="#648aa6"/>
<text x="225" y="526" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">lim x→∞ (1+1/x)^x = e</text>
<circle cx="202" cy="564" r="5" fill="#648aa6"/>
<text x="225" y="572" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">也写成 lim x→0 (1+x)^{1/x} = e</text>
<circle cx="202" cy="610" r="5" fill="#648aa6"/>
<text x="225" y="618" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">推广：□→∞ 时 (1+1/□)^□ = e</text>
<circle cx="202" cy="656" r="5" fill="#648aa6"/>
<text x="225" y="664" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">推广：□→0 时 (1+□)^{1/□} = e</text>
<path d="M72 750 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="712" width="650" height="142" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="712" width="9" height="142" rx="4" fill="#4e7896"/>
<circle cx="162" cy="750" r="21" fill="#e5eef5"/>
<text x="162" y="758" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">3</text>
<text x="198" y="760" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">手写公式</text>
<circle cx="202" cy="798" r="5" fill="#648aa6"/>
<text x="225" y="806" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" fill="#314a5e">lim [1+f(x)]^{g(x)} = e^{lim f(x)g(x)}（1^∞ 型）</text>
</svg>
