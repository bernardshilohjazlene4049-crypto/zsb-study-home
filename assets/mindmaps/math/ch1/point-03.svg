<circle cx="162" cy="636" r="21" fill="#e5eef5"/>
<text x="162" y="644" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">3</text>
<text x="198" y="646" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">四则运算</text>
