<text x="225" y="330" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">收敛 ⇒ 有界</text>
<circle cx="202" cy="368" r="5" fill="#648aa6"/>
<text x="225" y="376" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">有界 不一定 收敛</text>
<path d="M72 470 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="432" width="650" height="142" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="432" width="9" height="142" rx="4" fill="#4e7896"/>
<circle cx="162" cy="470" r="21" fill="#e5eef5"/>
<text x="162" y="478" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">2</text>
<text x="198" y="480" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">发散</text>
<circle cx="202" cy="518" r="5" fill="#648aa6"/>
<text x="225" y="526" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">无界 ⇒ 一定发散</text>
<path d="M72 636 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="598" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
