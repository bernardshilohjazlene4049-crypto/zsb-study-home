<text x="225" y="692" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">先各自极限都存在（能算出数）才能加减乘除</text>
<circle cx="202" cy="730" r="5" fill="#648aa6"/>
<text x="225" y="738" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">除法还要求分母极限 ≠ 0</text>
