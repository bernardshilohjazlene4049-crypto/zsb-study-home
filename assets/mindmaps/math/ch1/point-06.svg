<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1386" viewBox="0 0 800 1386" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="math.equivalent">
<title id="svg-title">考点六：无穷小的比较</title>
<desc id="svg-desc">比较两个无穷小：看 lim f/g；按考点源稿整理的分支关系图。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173b5e"/><stop offset="1" stop-color="#285b7f"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="1386" rx="24" fill="url(#bg)"/>
<rect x="40" y="38" width="720" height="112" rx="22" fill="url(#root)" filter="url(#soft)"/>
<text x="400" y="77" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#d7e8f4">高数第一章 · 逐点思维导图</text>
<text x="400" y="121" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">比较两个无穷小：看 lim f/g</text>
<path d="M400 150 V166 H72 V1196" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 228 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="190" width="650" height="256" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="190" width="9" height="256" rx="4" fill="#4e7896"/>
<circle cx="162" cy="228" r="21" fill="#e5eef5"/>
<text x="162" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">1</text>
<text x="198" y="238" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">四种结果</text>
<circle cx="202" cy="276" r="5" fill="#648aa6"/>
<text x="225" y="284" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">=0  f 是 g 的高阶无穷小</text>
<circle cx="202" cy="322" r="5" fill="#648aa6"/>
<text x="225" y="330" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">=∞  f 是 g 的低阶无穷小</text>
<circle cx="202" cy="368" r="5" fill="#648aa6"/>
<text x="225" y="376" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">=c（c≠0,1） 同阶但不等价</text>
<circle cx="202" cy="414" r="5" fill="#648aa6"/>
<text x="225" y="422" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">=1  等价 记作 f~g</text>
<path d="M72 508 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="470" width="650" height="256" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="470" width="9" height="256" rx="4" fill="#4e7896"/>
<circle cx="162" cy="508" r="21" fill="#e5eef5"/>
<text x="162" y="516" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">2</text>
<text x="198" y="518" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">八个等价（x→0）</text>
<circle cx="202" cy="556" r="5" fill="#648aa6"/>
<text x="225" y="564" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">sin x、tan x、arcsin x、arctan x ~ x</text>
<circle cx="202" cy="602" r="5" fill="#648aa6"/>
<text x="225" y="610" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">e^x-1、ln(1+x) ~ x</text>
<circle cx="202" cy="648" r="5" fill="#648aa6"/>
<text x="225" y="656" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">1-cos x ~ x²/2</text>
<circle cx="202" cy="694" r="5" fill="#648aa6"/>
<text x="225" y="702" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">(1+x)^m-1 ~ m x</text>
<path d="M72 788 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="750" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="750" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="788" r="21" fill="#e5eef5"/>
<text x="162" y="796" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">3</text>
<text x="198" y="798" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">补充</text>
<circle cx="202" cy="836" r="5" fill="#648aa6"/>
<text x="225" y="844" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">a^x-1 ~ x ln a</text>
<circle cx="202" cy="882" r="5" fill="#648aa6"/>
<text x="225" y="890" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">sec x-1 ~ x²/2</text>
<path d="M72 992 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="954" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="954" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="992" r="21" fill="#e5eef5"/>
<text x="162" y="1000" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">4</text>
<text x="198" y="1002" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">大小顺序（x→0⁺）</text>
<circle cx="202" cy="1040" r="5" fill="#648aa6"/>
<text x="225" y="1048" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">ln(1+x) &lt; x &lt; e^x-1</text>
<circle cx="202" cy="1086" r="5" fill="#648aa6"/>
<text x="225" y="1094" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">arctan x &lt; sin x &lt; x &lt; arcsin x &lt; tan x</text>
<path d="M72 1196 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="1158" width="650" height="180" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="1158" width="9" height="180" rx="4" fill="#4e7896"/>
<circle cx="162" cy="1196" r="21" fill="#e5eef5"/>
<text x="162" y="1204" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">5</text>
<text x="198" y="1206" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">用法</text>
<circle cx="202" cy="1244" r="5" fill="#648aa6"/>
<text x="225" y="1252" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">等价替换只用于乘除因子</text>
<circle cx="202" cy="1290" r="5" fill="#648aa6"/>
<text x="225" y="1298" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">加减里慎用</text>
</svg>
