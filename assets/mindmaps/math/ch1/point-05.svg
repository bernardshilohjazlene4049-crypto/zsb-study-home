<svg xmlns="http://www.w3.org/2000/svg" width="800" height="902" viewBox="0 0 800 902" role="img" aria-labelledby="svg-title svg-desc" data-topic-id="math.infinitesimal">
<title id="svg-title">考点五：无穷小与无穷大</title>
<desc id="svg-desc">无穷小与无穷大；按考点源稿整理的分支关系图。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173b5e"/><stop offset="1" stop-color="#285b7f"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".09"/></filter>
</defs>
<rect width="800" height="902" rx="24" fill="url(#bg)"/>
<rect x="40" y="38" width="720" height="112" rx="22" fill="url(#root)" filter="url(#soft)"/>
<text x="400" y="77" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" fill="#d7e8f4">高数第一章 · 逐点思维导图</text>
<text x="400" y="121" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">无穷小与无穷大</text>
<path d="M400 150 V166 H72 V674" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 228 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="190" width="650" height="256" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="190" width="9" height="256" rx="4" fill="#4e7896"/>
<circle cx="162" cy="228" r="21" fill="#e5eef5"/>
<text x="162" y="236" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">1</text>
<text x="198" y="238" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">无穷小</text>
<circle cx="202" cy="276" r="5" fill="#648aa6"/>
<text x="225" y="284" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">定义 极限为 0 的函数</text>
<circle cx="202" cy="322" r="5" fill="#648aa6"/>
<text x="225" y="330" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">有限个 和差积 仍是无穷小</text>
<circle cx="202" cy="368" r="5" fill="#648aa6"/>
<text x="225" y="376" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">有界函数 × 无穷小 = 无穷小</text>
<circle cx="202" cy="414" r="5" fill="#648aa6"/>
<text x="225" y="422" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">常数 × 无穷小 = 无穷小</text>
<path d="M72 508 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="470" width="650" height="142" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="470" width="9" height="142" rx="4" fill="#4e7896"/>
<circle cx="162" cy="508" r="21" fill="#e5eef5"/>
<text x="162" y="516" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">2</text>
<text x="198" y="518" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">无穷大</text>
<circle cx="202" cy="556" r="5" fill="#648aa6"/>
<text x="225" y="564" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">定义 极限为无穷的函数</text>
<path d="M72 674 H120" fill="none" stroke="#91a9bd" stroke-width="4" stroke-linecap="round"/>
<rect x="120" y="636" width="650" height="218" rx="18" fill="#ffffff" stroke="#d5e0e9" stroke-width="2" filter="url(#soft)"/>
<rect x="120" y="636" width="9" height="218" rx="4" fill="#4e7896"/>
<circle cx="162" cy="674" r="21" fill="#e5eef5"/>
<text x="162" y="682" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#315d7d">3</text>
<text x="198" y="684" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#203e58">倒数关系</text>
<circle cx="202" cy="722" r="5" fill="#648aa6"/>
<text x="225" y="730" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">非零无穷小 与 无穷大 互为倒数</text>
<circle cx="202" cy="768" r="5" fill="#648aa6"/>
<text x="225" y="776" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">0⁺ 的倒数是 +∞</text>
<circle cx="202" cy="814" r="5" fill="#648aa6"/>
<text x="225" y="822" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" fill="#314a5e">0⁻ 的倒数是 −∞</text>
</svg>
