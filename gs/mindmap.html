<style>
  .map-switch{
    display:flex;
    align-items:center;
    gap:6px;

    max-width:100%;
    margin-bottom:14px;

    min-height:36px;

    color:var(--sg-accent);
    border-color:var(--sg-accent-line);
    background:var(--sg-accent-soft);
  }
  .map-panel[hidden],.map-actions[hidden],.mind-tree[hidden]{display:none!important}
  .map-board{
    overflow:hidden;
    border:1px solid var(--sg-line);
    border-radius:var(--sg-radius-panel);
    background:var(--sg-surface);
    box-shadow:var(--sg-shadow-card);
    -webkit-backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
    backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
  }
  .map-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    padding:12px 14px;
    border-bottom:1px solid var(--sg-line);
  }
  .map-subtabs,.map-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .map-subtabs .btn[aria-selected="true"]{
    color:var(--sg-accent);
    background:var(--sg-accent-soft);
  }
  .tree-stage{
    min-height:430px;
    padding:22px;
    overflow:auto;
    background-color:var(--sg-bg-top);
    background-image:radial-gradient(var(--sg-line-strong) .7px,transparent .7px);
    background-size:20px 20px;
  }
  .tree-wrap{
    width:min(100%,920px);
    margin-inline:auto;
  }
  .mind-tree,
  .mind-tree ul{
    list-style:none;
    margin:0;
    padding:0;
  }
  .mind-tree{
    display:grid;
    gap:12px;
  }
  .mind-tree>li>details>summary.tree-node{margin-inline:auto}
  .mind-tree>li>details>ul{
    display:grid;
    margin:18px 0 0;
    padding-left:0;
    gap:14px;
  }
  #tree-function>li>details>ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tree-limit>li>details>ul{grid-template-columns:repeat(3,minmax(0,1fr))}
  #tree-fortyfive>li>details>ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mind-tree>li>details>ul::before,
  .mind-tree>li>details>ul>li::before{display:none}
  .mind-tree>li>details>ul>li>details>summary.tree-node,
  .mind-tree>li>details>ul>li>.tree-node{
    width:100%;
    font-weight:580;
  }
  .mind-tree ul{
    position:relative;
    margin:9px 0 0 16px;
    padding-left:20px;
    display:grid;
    gap:8px;
  }
  .mind-tree ul::before{
    content:"";
    position:absolute;
    left:6px;
    top:0;
    bottom:13px;
    width:1px;
    background:var(--sg-line-strong);
  }
  .mind-tree li{
    position:relative;
    min-width:0;
  }
  .mind-tree ul>li::before{
    content:"";
    position:absolute;
    left:-14px;
    top:20px;
    width:14px;
    height:1px;
    background:var(--sg-line-strong);
  }
  .tree-node{
    position:relative;
    display:flex;
    align-items:center;
    width:fit-content;
    max-width:min(100%,760px);
    min-height:40px;
    padding:9px 12px;
    border:1px solid var(--sg-line);
    border-radius:10px;
    background:var(--sg-surface-strong);
    color:var(--sg-ink);
    font-size:14px;
    line-height:1.55;
    box-shadow:var(--sg-shadow-xs);
    overflow-wrap:anywhere;
  }
  summary.tree-node{
    cursor:pointer;
    list-style:none;
  }
  summary.tree-node::-webkit-details-marker{display:none}
  summary.tree-node::after{
    content:"+";
    flex:none;
    margin-left:10px;
    color:var(--sg-ink-faint);
    font-size:15px;
    line-height:1;
  }
  details[open]>summary.tree-node::after{content:"−"}
  .mind-tree>li>.tree-node,
  .mind-tree>li>details>.tree-node{
    min-height:46px;
    padding:10px 14px;
    border-color:var(--sg-accent-line);
    background:var(--sg-accent-soft);
    color:var(--sg-accent);
    font-size:17px;
    font-weight:600;
  }
  .mind-tree ul ul>.tree-node,
  .mind-tree ul ul>details>.tree-node{font-size:13.5px}
  .map-image{
    margin-top:16px;
    overflow:hidden;
  }
  .map-image .media-frame{

    min-height:180px;
    background:var(--sg-surface-soft);
  }
  .map-image .media-frame img{
    width:100%;
    max-height:760px;
    object-fit:contain;

  .map-image .content-card__footer{

    padding:14px 16px;
    border-bottom:1px solid var(--sg-line);
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;

  @media(max-width:900px){
    #tree-limit>li>details>ul{grid-template-columns:repeat(2,minmax(0,1fr))}

  @media(max-width:767px){

    #tree-limit>li>details>ul,

    .mind-tree>li>details>ul{margin-left:0;padding-left:0}
    .tree-node{font-size:13px}
    .mind-tree>li>.tree-node,
    .mind-tree>li>details>.tree-node{font-size:15px}
  }
  @media(max-width:430px){
    .map-switch{width:100%}
    .map-switch .btn{flex:1}

<script>
const trees = {
  function: {"label": "函数", "children": [{"label": "定义", "children": [{"label": "定义域 ★★★", "children": [{"label": "判断两函数是否相同 P32第9题"}]}, {"label": "对应法则 表达式"}]}, {"label": "图像", "children": [{"label": "基本初等函数 反对幂指三"}, {"label": "常函数"}]}, {"label": "形式", "children": [{"label": "初等函数 一个式子"}, {"label": "分段函数 多个式子"}]}, {"label": "性质", "children": [{"label": "单调性", "children": [{"label": "看图像"}, {"label": "求导 第二章 f'≥0增 f'≤0减"}]}, {"label": "奇偶性 P2", "children": [{"label": "图像 性质 定义"}]}, {"label": "周期性"}, {"label": "有界性"}]}]},
  limit: {"label": "极限", "children": [{"label": "数列极限 函数极限", "children": [{"label": "未定式 0/0 ∞/∞ ∞-∞ 0·∞ 1^∞ ∞^0 0^0"}, {"label": "抓大头 x→∞ 看分子分母最高次 ★"}, {"label": "代入 不是未定式直接得数"}, {"label": "化简 有理化 公式 通分 约分 0/0"}, {"label": "等价替换 0/0 0·∞"}, {"label": "重要极限 1^∞ ★★★"}, {"label": "洛必达 第二章"}]}, {"label": "无穷大与无穷小 P4", "children": [{"label": "定义"}, {"label": "无穷小比较", "children": [{"label": "高阶"}, {"label": "低阶"}, {"label": "同阶非等价"}, {"label": "等价 等价替换公式 ★★★"}]}]}, {"label": "函数的渐近线 ★", "children": [{"label": "水平渐近线 x→∞时 lim f(x)=数"}, {"label": "垂直渐近线 铅直 x→x0时 lim f(x)=∞"}]}]},
  fortyfive: {"label": "第四五章", "children": [{"label": "向量与空间解析几何", "children": [{"label": "三十六 基本概念计算关系", "children": [{"label": "坐标与模"}, {"label": "方向余弦"}, {"label": "点积叉积"}]}, {"label": "三十七 平面方程", "children": [{"label": "点法式与十种特例"}, {"label": "两平面关系"}]}, {"label": "三十八 直线方程", "children": [{"label": "参数式与点向式"}, {"label": "两直线与线面关系"}]}]}, {"label": "多元函数微积分", "children": [{"label": "三十九 定义域"}, {"label": "四十 一阶偏导"}, {"label": "四十一 高阶偏导"}, {"label": "四十二 全微分", "children": [{"label": "连续可微偏导关系"}]}, {"label": "四十三 极值", "children": [{"label": "驻点与二阶判别"}]}, {"label": "四十四 最值应用", "children": [{"label": "边界与条件极值"}]}, {"label": "四十五 复合函数偏导", "children": [{"label": "连线相乘分线相加"}]}, {"label": "四十六 积分性质", "children": [{"label": "性质一至八"}, {"label": "对称估值中值"}]}, {"label": "四十七 直角坐标积分", "children": [{"label": "X型先y后x"}]}]}]}
};

function buildTree(node) {
  const li = document.createElement('li');
  if (node.children && node.children.length) {
    const details = document.createElement('details');
    details.open = true;
    const summary = document.createElement('summary');
    summary.className = 'tree-node';
    summary.textContent = node.label;
    details.appendChild(summary);
    const ul = document.createElement('ul');
    node.children.forEach(child => ul.appendChild(buildTree(child)));
    details.appendChild(ul);
    li.appendChild(details);
  } else {
    const span = document.createElement('span');
    span.className = 'tree-node';
    span.textContent = node.label;
    li.appendChild(span);
  }
  return li;
}

function mountTree(targetId, tree) {
  const root = document.getElementById(targetId);
  root.textContent = '';
  root.appendChild(buildTree(tree));
}

mountTree('tree-function', trees.function);
mountTree('tree-limit', trees.limit);
mountTree('tree-fortyfive', trees.fortyfive);

function setExpanded(scope, open) {
  scope.querySelectorAll('details').forEach(d => d.open = open);
}

document.querySelectorAll('[data-expand-target]').forEach(btn => {
  btn.addEventListener('click', () => {
    const scope = document.getElementById(btn.dataset.expandTarget);
    setExpanded(scope, btn.dataset.expand === 'true');
  });
});

const chapterTabs = document.querySelectorAll('[data-chapter-tab]');
const chapterPanels = document.querySelectorAll('[data-chapter-panel]');
chapterTabs.forEach(btn => btn.addEventListener('click', () => {
  chapterTabs.forEach(item => item.setAttribute('aria-selected', String(item === btn)));
  chapterPanels.forEach(panel => panel.hidden = panel.id !== btn.dataset.chapterTab);
}));

const firstTabs = document.querySelectorAll('[data-first-tab]');
const firstTrees = document.querySelectorAll('[data-first-tree]');
firstTabs.forEach(btn => btn.addEventListener('click', () => {
  firstTabs.forEach(item => item.setAttribute('aria-selected', String(item === btn)));
  firstTrees.forEach(tree => tree.hidden = tree.id !== btn.dataset.firstTab);
  document.querySelectorAll('[data-first-actions]').forEach(actions => {
    actions.hidden = actions.dataset.firstActions !== btn.dataset.firstTab;
  });
}));
</script>
