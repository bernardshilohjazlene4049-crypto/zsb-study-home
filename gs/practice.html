<style>
  .page-title{
    font-weight:560;
    letter-spacing:-.018em;
    line-height:1.16;
    overflow-wrap:normal;
    word-break:keep-all;
  }
  .page-subtitle{max-width:680px}
  .section-title{
    font-weight:600;
    letter-spacing:-.012em;
  }
  .content-card__title{
    font-weight:600;
    letter-spacing:-.01em;
  }
  .site-brand__mark{
    font-size:14px;
    font-weight:650;
  }
  .site-nav__icon{
    font-size:18px;
    line-height:1;
  }
  .site-subnav{
    position:relative;
    z-index:70;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
    backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
  }
  .page-hero{max-width:900px}
  @media (max-width:767px){
    .site-header__inner{flex-wrap:nowrap}
    .site-nav{
      order:initial;
      flex:1 1 auto;
      width:auto;
      justify-content:flex-end;
    }
    .site-nav__link{padding-inline:9px}
    .page-title{font-size:clamp(29px,8vw,34px)}
  }
  @media (max-width:560px){
    .site-brand__name{display:none}
    .site-nav{justify-content:flex-start}
  }
</style>

<style>
  .practice-layout{
    display:grid;
    gap:16px;
  }
  .practice-card{
    background:var(--sg-surface);
    -webkit-backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
    backdrop-filter:blur(var(--sg-glass-blur)) saturate(var(--sg-glass-saturation));
  }
  .practice-card .content-card__body{padding:20px;gap:14px}
  .practice-card__head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .practice-card__title{
    margin:0;
    font-size:clamp(19px,2.2vw,23px);
    font-weight:590;
    line-height:1.35;
    letter-spacing:-.012em;
  }
  .chapter-link{
    color:var(--sg-accent);
    font-size:13px;
    white-space:nowrap;
  }
  .chapter-link:hover{text-decoration:underline}
  .chapter-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 16px}
  .practice-links{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
  }
  .practice-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:44px;
    padding:10px 12px;
    border:1px solid var(--sg-line);
    border-radius:10px;
    background:var(--sg-surface-strong);
    transition:border-color var(--sg-transition),background var(--sg-transition),color var(--sg-transition);
  }
  .practice-link:hover{
    border-color:var(--sg-line-strong);
    background:var(--sg-surface-hover);
    color:var(--sg-accent);
  }
  .practice-link__count{
    flex:none;
    color:var(--sg-ink-muted);
    font-size:12px;
  }
  .practice-link:hover .practice-link__count{color:var(--sg-accent)}
  @media(max-width:1023px){
    .practice-links{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media(max-width:767px){
    .practice-card .content-card__body{padding:16px}
    .practice-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:430px){
    .practice-links{grid-template-columns:minmax(0,1fr)}
  }
</style>

<style>
  .site-header{border-bottom:1px solid rgba(28,36,48,.07);background:rgba(251,252,254,.84)}
  .site-header__inner{min-height:64px}
  .site-nav{gap:5px}
  .site-nav__link{min-height:38px;padding:0 11px;border:1px solid transparent;border-radius:11px;color:var(--sg-ink-secondary);font-size:12px;font-weight:600}
  .site-nav__link:hover{background:rgba(255,255,255,.72);border-color:var(--sg-line)}
  .site-nav__link.is-active,.site-nav__link[aria-current="page"]{color:var(--sg-ink);background:#fff;border-color:var(--sg-line);box-shadow:0 3px 14px rgba(28,36,48,.045)}
  @media (max-width:560px){.site-header__inner{min-height:60px}.site-nav{justify-content:flex-end}.site-nav__link{padding:0 9px}}
</style>
</head>
