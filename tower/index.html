<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <title>学习指挥塔 · 辽宁专升本计算机组</title>
  <link rel="stylesheet" href="../assets/css/tower.css">
  <link rel="stylesheet" href="../assets/css/site-nav.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="m4 8.5 8 4.5 8-4.5M12 13v7"/></svg>
        </div>
        <div>
          <strong>学习指挥塔</strong>
          <small>辽宁专升本 · 计算机组</small>
        </div>
      </div>
      <div class="top-meta">
        <span class="status-pill"><i class="dot"></i>本地交互原型 · 未连接任务服务</span>
        <button class="btn" id="performanceToggle" type="button">节能渲染：自动</button>
        <a class="btn" id="openStudy" href="../study/index.html">返回学习工作台 ↗</a>
      </div>
    </header>
    <div class="layout">
      <aside class="panel left">
        <div class="panel-label">SEVEN LEARNING FLOORS</div>
        <div class="floor-list" id="floorList"></div>
        <div class="left-note">
          <strong>学习空间说明</strong>
          <p>点击楼层查看对应科目。任务服务尚未实现。没有机器人在运行，画面上的图形只是建筑示意。</p>
        </div>
      </aside>
      <main class="panel stage">
        <div class="stage-head">
          <div>
            <div class="stage-kicker">LEARNING COMMAND TOWER</div>
            <h1>七层学习空间</h1>
            <p>七层分区 · Canvas 2D 实时绘制</p>
          </div>
          <div class="stage-controls">
            <button class="btn" id="zoomOut" type="button" aria-label="缩小">−</button>
            <button class="btn" id="zoomIn" type="button" aria-label="放大">＋</button>
            <button class="btn" id="resetView" type="button">重置视图</button>
          </div>
        </div>
        <div class="canvas-wrap"><canvas id="towerCanvas" aria-label="可点击的七层等距学习指挥塔"></canvas></div>
        <div class="canvas-hint">点击玻璃楼板或楼层标签，查看对应学习空间</div>
        <div class="legend"><span><i></i>待命</span><span><i style="background:#d9b27d"></i>本地任务示意</span></div>
      </main>
      <aside class="panel right" id="detailPanel">
        <p class="detail-desc">正在读取科目目录。任务服务尚未实现。没有机器人在运行。</p>
      </aside>
    </div>
    <div class="mobile-floors" id="mobileFloors"></div>
    <div class="bottom-info">
      <span>程序化绘制 · 无外部图片 / 无外部库 · 任务服务尚未实现 · 没有机器人在运行</span>
      <span id="renderMode">渲染模式：检测中</span>
    </div>
    <footer></footer>
  </div>
  <noscript><p>指挥塔需要 JavaScript 才能绘制。学习工作台仍可从 study/index.html 进入。</p></noscript>
  <script src="../assets/js/site-nav.js" data-base="../" data-tone="dark" data-site-nav=""></script>
  <script type="module" src="../assets/js/tower.js"></script>
</body>
</html>
