<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>当前无法打开此页面</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5fa;
      --surface: #ffffff;
      --ink: #1d1c2b;
      --muted: #4f5066;
      --accent: #5b4bd6;
      --accent-deep: #4c3cc7;
      --line: rgba(32,30,68,.085);
      --focus: #3424a8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--page); color: var(--ink); }
    .site-header { height: 60px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .site-container { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
    .header-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; min-width: 0; color: var(--ink); text-decoration: none; }
    .brand-mark { width: 25px; height: 25px; border-radius: 50%; flex: 0 0 25px; position: relative; background: radial-gradient(circle at 32% 28%, #b6adff 0%, #8475ff 31%, #6553ef 70%, #5342d5 100%); box-shadow: 0 3px 11px rgba(91,75,214,.29); }
    .brand-mark::after { content: ""; position: absolute; left: 7px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.9); }
    .brand-name { font-size: 15px; line-height: 1.35; font-weight: 700; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-link { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; color: var(--ink); text-decoration: none; }
    .search-link svg { width: 22px; height: 22px; display: block; }
    .search-link:hover { background: var(--page); }
    .main { min-height: calc(100vh - 60px); min-height: calc(100dvh - 60px); display: grid; place-items: center; padding: 32px 20px 80px; }
    .offline-content { width: 100%; max-width: 560px; text-align: center; }
    h1 { font-size: clamp(25px, 3.2vw, 36px); font-weight: 700; letter-spacing: -.035em; line-height: 1.4; margin: 0 0 30px; }
    .home-button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 144px; padding: 12px 28px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 650; line-height: 1.35; text-decoration: none; transition: background-color .16s ease, transform .16s ease; }
    .home-button:hover { background: var(--accent-deep); }
    .home-button:active { transform: translateY(1px); }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    @media (max-width: 600px) {
      .site-header { height: 53px; }
      .site-container { padding: 0 15px; }
      .brand { gap: 9px; }
      .brand-mark { width: 23px; height: 23px; flex-basis: 23px; }
      .brand-mark::after { left: 6px; top: 5px; width: 9px; height: 9px; }
      .brand-name { font-size: 14px; }
      .main { min-height: calc(100vh - 53px); min-height: calc(100dvh - 53px); padding: 24px 18px 64px; }
      h1 { font-size: 26px; margin-bottom: 26px; }
      .home-button { min-width: 148px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --page: #15151d; --surface: #20202c; --ink: #f4f3fa; --muted: #c4c3d5; --accent: #7668ef; --accent-deep: #6455d7; --line: rgba(245,243,255,.13); --focus: #c4bdff; }
      .home-button { color: #ffffff; background: #5848c7; }
      .home-button:hover { background: #4a3ba9; }
      .search-link:hover { background: #2b2a39; }
    }
    @media (prefers-reduced-motion: reduce) { .home-button { transition: none; } .home-button:active { transform: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-container header-inner">
      <a class="brand" href="./index.html" aria-label="辽宁专升本 · 计算机类学习站">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">辽宁专升本 · 计算机类学习站</span>
      </a>
      <a class="search-link" href="./search.html" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.5 4.5"/></svg>
      </a>
    </div>
  </header>
  <main class="main">
    <div class="offline-content">
      <h1>当前无法打开此页面</h1>
      <a class="home-button" href="./index.html">返回首页</a>
    </div>
  </main>
</body>
</html>
