<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9fb">
<meta name="robots" content="noindex">
<meta name="description" content="无法连接到网络，请检查连接后重试">
<title>无法连接 · 辽宁专升本</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<style>
*,*::before,*::after{box-sizing:border-box}
html{min-width:320px;background:#f8f9fb;color:#1b212b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-width:320px;margin:0;background:#f8f9fb;color:#1b212b;line-height:1.6}
.off-wrap{min-height:100vh;display:flex;flex-direction:column}
.off-header{height:60px;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(28,36,48,.085);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.off-brand{font-size:15px;font-weight:700;color:#1b212b;text-decoration:none;letter-spacing:-.01em}
.off-main{flex:1;display:grid;place-items:center;padding:48px 20px 96px}
.off-stack{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:380px}
.off-title{margin:0;font-size:clamp(20px,4vw,26px);font-weight:650;line-height:1.3;color:#1b212b}
.off-desc{margin:0;font-size:15px;color:#596475;line-height:1.6}
.off-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;background:#1668dc;color:#fff;border-radius:9px;font-size:15px;font-weight:600;text-decoration:none;border:none;cursor:pointer}
.off-search{font-size:14px;color:#596475;text-decoration:none;padding:6px 10px;border-radius:7px}
.off-search:hover{background:#f1f3f6;color:#1b212b}
</style>
</head>
<body>
<div class="off-wrap">
  <header class="off-header">
    <a class="off-brand" id="home-link" href="index.html">辽宁专升本 · 计算机类学习站</a>
    <a class="off-search" id="search-link" href="search.html" aria-label="搜索">搜索</a>
  </header>
  <main class="off-main">
    <div class="off-stack">
      <h1 class="off-title">当前无法打开此页面</h1>
      <p class="off-desc">请检查网络连接，或稍后重试。已访问过的页面在离线时仍可打开。</p>
      <a class="off-btn" id="home-btn" href="index.html">返回首页</a>
    </div>
  </main>
</div>
<script>
(function () {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.ready.then(function (reg) {
      var root = reg.scope;
      document.getElementById("home-link").href = root;
      document.getElementById("home-btn").href = root;
      document.getElementById("search-link").href = root + "search.html";
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
