<body class="shell-page shell-overview">
  <div class="site-shell">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="../index.html"><span class="site-brand__name">辽宁专升本 · 计算机类学习站</span></a>
      <nav class="site-nav" aria-label="全站导航"><a class="site-nav__link" href="../index.html">首页</a><a class="site-nav__link" href="../search.html">搜索</a></nav>
    </div>
  </header>
  <main class="site-main ov" id="main"><div class="ov-wrap">
    <header class="ov-head">
      <h1 class="ov-title"><span class="sh-ico" data-icon="chart" data-size="24" aria-hidden="true"></span><span>学习总览</span></h1>
      <div class="ov-range" role="group" aria-label="时间范围" data-slot="range"></div>
    </header>
    <div class="ov-grid">
      <div class="ov-col">
        <section class="sh-card" aria-labelledby="ov-continue"><header class="sh-card__head"><h2 class="sh-card__title" id="ov-continue"><span class="sh-ico" data-icon="playCircle" aria-hidden="true"></span><span>继续学习</span></h2></header><div data-slot="continue"><p class="sh-empty-line">还没有学习记录。</p></div></section>
        <section class="sh-card" aria-labelledby="ov-subjects"><header class="sh-card__head"><h2 class="sh-card__title" id="ov-subjects"><span class="sh-ico" data-icon="layers" aria-hidden="true"></span><span>各科进度</span></h2></header><div data-slot="subjects"></div></section>
      </div>
      <div class="ov-col">
        <section class="sh-card" aria-labelledby="ov-due"><header class="sh-card__head"><h2 class="sh-card__title" id="ov-due"><span class="sh-ico" data-icon="clock" aria-hidden="true"></span><span>今日到期复习</span><small class="sh-card__sub" data-slot="due-count"></small></h2></header><div data-slot="due"><p class="sh-empty-line">今天没有到期的复习。</p></div></section>
        <section class="sh-card" aria-labelledby="ov-weak"><header class="sh-card__head"><h2 class="sh-card__title" id="ov-weak"><span class="sh-ico" data-icon="alert" aria-hidden="true"></span><span>薄弱点</span></h2></header><div data-slot="weak"><p class="sh-empty-line">还没有错题。</p></div></section>
        <section class="sh-card" aria-labelledby="ov-rhythm"><header class="sh-card__head"><h2 class="sh-card__title" id="ov-rhythm"><span class="sh-ico" data-icon="calendar" aria-hidden="true"></span><span>学习节奏</span></h2></header><div data-slot="rhythm"><p class="sh-empty-line">还没有学习记录。</p></div></section>
      </div>
    </div>
  </div></main>
  </div>
</body>
