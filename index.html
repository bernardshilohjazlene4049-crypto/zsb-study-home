<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="description" content="辽宁专升本计算机类学习站，按科目进入讲义、视频、思维导图与练习。">
  <title>辽宁专升本 · 计算机类学习站</title>
  <link rel="stylesheet" href="assets/css/site-unify.css">
  <style>
    /* 首页只补充页面级布局；颜色、字体、圆角和基础组件继续沿用 site-unify.css。 */
    html {
      scroll-padding-top: 80px;
      background: var(--sg-bg);
    }

    body.home-index {
      min-height: 100vh;
      background:
        linear-gradient(180deg, var(--sg-bg-top) 0, var(--sg-bg) 38%, #f6f7f9 100%);
    }

    .home-index .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .home-index .site-main {
      flex: 1;
      padding-top: 34px;
      padding-bottom: 64px;
    }

    .home-index .site-brand__mark {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .home-index .site-brand,
    .home-index .site-nav__link {
      font-weight: 560;
    }

    .home-index .site-nav__link {
      padding-inline: 11px;
    }

    .home-index .page-hero {
      margin: 34px 0 42px;
    }

    .home-index .page-title {
      max-width: 900px;
      font-weight: 560;
      line-height: 1.14;
      letter-spacing: -.018em;
      overflow-wrap: normal;
      text-wrap: balance;
    }

    .title-primary,
    .title-secondary {
      white-space: nowrap;
    }

    .home-index .section {
      margin: 0;
    }

    .home-index .section-heading {
      margin-bottom: 17px;
    }

    .home-index .section-title {
      font-weight: 600;
      letter-spacing: -.018em;
    }

    .subject-board {
      position: relative;
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--sg-line);
      border-radius: var(--sg-radius-panel);
      background: rgba(255, 255, 255, .64);
      box-shadow:
        0 18px 54px rgba(31, 40, 55, .045),
        inset 0 1px 0 rgba(255, 255, 255, .82);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
    }

    .subject-group + .subject-group {
      margin-top: 28px;
      padding-top: 27px;
      border-top: 1px solid var(--sg-line);
    }

    .subject-group__heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .subject-group__title {
      margin: 0;
      color: var(--sg-ink-secondary);
      font-size: var(--sg-text-sm);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -.01em;
    }

    .subject-grid {
      gap: 12px;
    }

    .subject-grid--public {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .subject-grid--professional {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .home-index .subject-card {
      position: relative;
      min-height: 142px;
      border-color: rgba(28, 36, 48, .09);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 2px 8px rgba(16, 24, 40, .025);
      isolation: isolate;
    }

    .home-index a.subject-card {
      cursor: pointer;
    }

    .home-index .subject-card .content-card__body {
      min-height: 142px;
      gap: 11px;
      padding: 18px 18px 17px;
    }

    .subject-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .home-index .content-card__title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.016em;
      text-wrap: balance;
    }

    .home-index .content-card__text {
      max-width: 32ch;
      color: var(--sg-ink-secondary);
      font-size: 13px;
      line-height: 1.72;
      text-wrap: pretty;
    }

    .subject-card__arrow {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--sg-line);
      border-radius: 8px;
      color: var(--sg-ink-muted);
      background: rgba(255, 255, 255, .58);
      transition:
        transform var(--sg-transition),
        color var(--sg-transition),
        border-color var(--sg-transition),
        background var(--sg-transition);
    }

    .subject-card__arrow svg {
      width: 14px;
      height: 14px;
    }

    .subject-card--closed {
      min-height: 142px;
      border-color: rgba(28, 36, 48, .07);
      background: rgba(249, 250, 252, .72);
      box-shadow: none;
    }

    .subject-card--closed .content-card__body {
      justify-content: space-between;
    }

    .subject-card__status {
      margin: auto 0 0;
      color: var(--sg-ink-faint);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (hover: hover) and (pointer: fine) {
      .home-index a.subject-card:hover {
        border-color: var(--sg-line-strong);
        background: rgba(255, 255, 255, .96);
        box-shadow: var(--sg-shadow-hover);
      }

      .home-index a.subject-card:hover .subject-card__arrow {
        transform: translateX(2px);
        color: var(--sg-accent);
        border-color: var(--sg-accent-line);
        background: var(--sg-accent-soft);
      }
    }

    .home-index a.subject-card:focus-visible {
      outline: 2px solid var(--sg-accent);
      outline-offset: 3px;
    }

    .home-index .site-footer__inner > span {
      color: var(--sg-ink-muted);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .subject-board,
      .home-index .subject-card {
        background: #fff;
      }
    }

    @media (max-width: 1023px) {
      .subject-grid--public {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .subject-grid--professional {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 767px) {
      html {
        scroll-padding-top: 112px;
      }

      .home-index .site-main {
        padding-top: 18px;
        padding-bottom: 42px;
      }

      .home-index .page-hero {
        margin: 25px 0 30px;
      }

      .home-index .page-title {
        font-size: clamp(28px, 7.2vw, 34px);
      }

      .subject-board {
        padding: 18px;
      }

      .subject-group + .subject-group {
        margin-top: 23px;
        padding-top: 22px;
      }

      .subject-grid--public,
      .subject-grid--professional {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .home-index .subject-card,
      .home-index .subject-card .content-card__body,
      .subject-card--closed {
        min-height: 126px;
      }

      .home-index .subject-card .content-card__body {
        padding: 16px;
      }
    }

    @media (max-width: 520px) {
      .title-primary,
      .title-secondary {
        display: block;
      }

      .title-divider {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .home-index .site-nav__link {
        padding-inline: 9px;
      }

      .home-index .page-title {
        font-size: 30px;
        line-height: 1.16;
      }

      .subject-board {
        padding: 15px;
        border-radius: var(--sg-radius-card);
      }

      .subject-grid--public,
      .subject-grid--professional {
        grid-template-columns: minmax(0, 1fr);
      }

      .home-index .subject-card,
      .home-index .subject-card .content-card__body,
      .subject-card--closed {
        min-height: 110px;
      }

      .home-index .content-card__text {
        max-width: none;
      }
    }

    .home-index .resources-section { margin-top: 48px; }
    .subject-grid--resources { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .home-index .resource-card,
    .home-index .resource-card .content-card__body { min-height: 0; }
    @media (max-width: 1023px) { .subject-grid--resources { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 430px) { .subject-grid--resources { grid-template-columns: minmax(0, 1fr); } .home-index .resources-section { margin-top: 34px; } }
  </style>
<style>@media (max-width:430px){.site-header .site-nav{gap:2px}.site-header .site-nav .site-nav__link{padding-inline:7px}}</style>
</head>
