<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="description" content="辽宁专升本计算机类学习站，按科目整理讲解视频、思维导图、考点与练习入口。">
  <title>辽宁专升本 · 计算机类学习站</title>
  <style>
    :root {
      color-scheme: light;
      --page: #F5F5F7;
      --surface: #FFFFFF;
      --ink: #1D1D1F;
      --body: #424245;
      --muted: #6E6E73;
      --quiet: #86868B;
      --line: rgba(29, 29, 31, .085);
      --line-strong: rgba(29, 29, 31, .12);
      --blue: #0071E3;
      --blue-dark: #0066CC;
      --green: #27845A;
      --orange: #B77924;
      --glass: rgba(255, 255, 255, .66);
      --glass-border: rgba(255, 255, 255, .72);
      --shadow-soft: 0 16px 44px rgba(29, 29, 31, .055);
      --radius-control: 11px;
      --radius-card: 18px;
      --radius-panel: 26px;
      --content: 1160px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
              "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
              "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 92px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #FAFAFC 0%, var(--page) 460px, var(--page) 100%);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }

    .container {
      width: min(var(--content), calc(100% - 64px));
      margin-inline: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding-top: env(safe-area-inset-top);
      background: rgba(250, 250, 252, .76);
      -webkit-backdrop-filter: blur(28px) saturate(1.18);
      backdrop-filter: blur(28px) saturate(1.18);
      border-bottom: 1px solid rgba(29, 29, 31, .055);
    }

    .topbar-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: #202124;
      border-radius: 11px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
    }

    .brand-mark svg { width: 19px; height: 19px; }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      gap: 3px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .brand-caption {
      color: var(--quiet);
      font-size: 10px;
      letter-spacing: .09em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-left: auto;
      min-width: 0;
      max-width: 100%;
    }

    .nav-links a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      transition: color .18s ease;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] { color: var(--blue); }

    .top-action {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid rgba(29,29,31,.09);
      border-radius: 12px;
      color: var(--body);
      background: rgba(255,255,255,.62);
      font-size: 12px;
      font-weight: 500;
      transition: background .18s ease, border-color .18s ease;
    }

    .top-action:hover {
      background: #fff;
      border-color: rgba(29,29,31,.16);
    }

    .top-action svg { width: 14px; height: 14px; }

    .hero {
      padding: 76px 0 48px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      align-items: end;
      gap: 64px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .055em;
    }

    .eyebrow-mark {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,113,227,.09);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: var(--ink);
      font-size: clamp(42px, 5.1vw, 62px);
      font-weight: 600;
      letter-spacing: -.058em;
      line-height: 1.12;
    }

    h1 span {
      display: block;
      color: #55565A;
      font-size: .72em;
      font-weight: 500;
      letter-spacing: -.045em;
      margin-top: 7px;
    }

    .hero-description {
      max-width: 580px;
      margin: 23px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
      letter-spacing: -.012em;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 22px;
      margin-top: 30px;
    }

    .primary-action {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 20px;
      color: #fff;
      background: rgba(0, 113, 227, .94);
      border: 1px solid rgba(255,255,255,.54);
      border-radius: 13px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        0 7px 18px rgba(29,29,31,.11);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      backdrop-filter: blur(20px) saturate(1.2);
      font-size: 14px;
      font-weight: 500;
      transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .primary-action:hover {
      background: var(--blue-dark);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 9px 22px rgba(29,29,31,.14);
      transform: translateY(-1px);
    }

    .primary-action svg { width: 16px; height: 16px; }

    .text-action {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--body);
      font-size: 13px;
      font-weight: 500;
      transition: color .18s ease;
    }

    .text-action:hover { color: var(--blue); }
    .text-action svg { width: 14px; height: 14px; }

    a.entry-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 4px;
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .progress-summary {
      padding: 0 0 5px;
      min-width: 0;
    }

    .progress-topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 11px;
    }

    .progress-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .progress-count {
      color: var(--ink);
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -.065em;
      line-height: 1;
      white-space: nowrap;
    }

    .progress-count small {
      color: var(--quiet);
      font-size: 19px;
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 18px;
    }

    .progress-track span {
      height: 5px;
      border-radius: 8px;
      background: #E2E2E7;
    }

    .progress-track span:nth-child(-n+5) { background: #3B82D6; }

    .progress-foot {
      margin-top: 12px;
      color: var(--quiet);
      font-size: 11px;
    }

    .section {
      padding: 30px 0;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 21px;
    }

    .section-kicker {
      margin: 0 0 6px;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      color: var(--ink);
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1.25;
    }

    .section-description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .section-side-note {
      color: var(--quiet);
      font-size: 11px;
      white-space: nowrap;
    }

    .index-panel {
      position: relative;
      overflow: hidden;
      padding: 31px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-panel);
      background: var(--glass);
      -webkit-backdrop-filter: blur(34px) saturate(1.2);
      backdrop-filter: blur(34px) saturate(1.2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.88),
        0 0 0 1px rgba(29,29,31,.035),
        var(--shadow-soft);
    }

    .index-panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: rgba(255,255,255,.9);
      pointer-events: none;
    }

    .index-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px;
    }

    .index-panel-head h2 { font-size: 25px; }

    .status-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .status-key {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
    }

    .status-dot.pending { background: var(--orange); }

    .course-group + .course-group {
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid rgba(29,29,31,.075);
    }

    .group-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      color: #5D5E63;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .025em;
    }

    .group-heading::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(29,29,31,.07);
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .course-card {
      min-width: 0;
      min-height: 186px;
      display: flex;
      flex-direction: column;
      padding: 18px 18px 16px;
      border: 1px solid rgba(29,29,31,.075);
      border-radius: var(--radius-card);
      background: rgba(255,255,255,.78);
      box-shadow: 0 2px 8px rgba(29,29,31,.025);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    a.course-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0,113,227,.24);
      box-shadow: 0 9px 22px rgba(29,29,31,.07);
    }

    a.course-card:focus-visible,
    a.resource-card:focus-visible,
    a.route-card:focus-visible,
    .primary-action:focus-visible,
    .text-action:focus-visible,
    .top-action:focus-visible,
    .nav-links a:focus-visible,
    .footer-top:focus-visible {
      outline: 3px solid rgba(0,113,227,.34);
      outline-offset: 3px;
    }

    .course-card.disabled {
      background: rgba(250,250,251,.72);
      border-style: dashed;
      border-color: rgba(29,29,31,.13);
    }

    .course-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 17px;
    }

    .course-index {
      color: #929399;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .09em;
      font-variant-numeric: tabular-nums;
    }

    .course-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .course-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .course-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #4B4D52;
      background: #F2F3F5;
      border: 1px solid rgba(29,29,31,.035);
      border-radius: 12px;
    }

    .course-icon svg { width: 20px; height: 20px; }

    .course-name {
      margin: 0;
      color: var(--ink);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.35;
    }

    .course-subtitle {
      margin-top: 4px;
      color: var(--quiet);
      font-size: 10px;
      line-height: 1.4;
    }

    .course-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 17px;
      color: var(--muted);
      font-size: 11px;
    }

    .course-footer svg {
      width: 14px;
      height: 14px;
      color: #8B8D92;
      transition: transform .18s ease, color .18s ease;
    }

    a.course-card:hover .course-footer svg {
      color: var(--blue);
      transform: translateX(3px);
    }

    .disabled .course-footer { color: #929399; }

    .route-section { padding-top: 49px; }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .route-card {
      min-width: 0;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 14px;
      padding: 19px 20px;
      border: 1px solid rgba(29,29,31,.07);
      border-radius: var(--radius-card);
      background: rgba(255,255,255,.72);
      transition: border-color .18s ease, background .18s ease;
    }

    a.route-card:hover {
      background: #fff;
      border-color: rgba(0,113,227,.2);
    }

    .route-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #777980;
      background: #F1F2F4;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .route-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.025em;
    }

    .route-copy {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .route-path {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: #777980;
      font-size: 10px;
    }

    .route-path span {
      padding: 3px 7px;
      border-radius: 6px;
      background: #F2F3F5;
    }

    .route-path b {
      color: #A0A1A6;
      font-size: 9px;
      font-weight: 400;
    }

    .resources-section { padding-top: 49px; }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .resource-card {
      min-width: 0;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid rgba(29,29,31,.075);
      border-radius: var(--radius-card);
      background: rgba(255,255,255,.76);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .resource-card:hover {
      transform: translateY(-2px);
      background: #fff;
      border-color: rgba(0,113,227,.2);
    }

    .resource-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 15px;
    }

    .resource-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #55575D;
      background: #F1F2F4;
      border-radius: 10px;
    }

    .resource-icon svg { width: 17px; height: 17px; }

    .resource-tag {
      color: var(--quiet);
      font-size: 10px;
      white-space: nowrap;
    }

    .resource-title {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .resource-description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .resource-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 13px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 500;
    }

    .resource-bottom svg { width: 13px; height: 13px; }

    .resource-card.pending .resource-bottom { color: #9B6B2A; }
    .resource-card.caution .resource-bottom { color: #686A70; }

    .site-footer {
      margin-top: 64px;
      border-top: 1px solid rgba(29,29,31,.075);
    }

    .footer-inner {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--quiet);
      font-size: 11px;
    }

    .footer-note { max-width: 650px; }

    .footer-top {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      transition: color .18s ease;
    }

    .footer-top:hover { color: var(--blue); }
    .footer-top svg { width: 14px; height: 14px; }

    @media (max-width: 900px) {
      .container { width: min(var(--content), calc(100% - 48px)); }
      .hero { padding-top: 62px; }
      .hero-grid { grid-template-columns: minmax(0, 1fr) 220px; gap: 34px; }
      h1 { font-size: clamp(42px, 6vw, 54px); }
      .index-panel { padding: 25px; }
      .course-grid { gap: 10px; }
      .course-card { padding: 16px; }
      .resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      html { scroll-padding-top: 78px; }
      .container { width: calc(100% - 36px); }
      .topbar-inner { min-height: 62px; gap: 12px; flex-wrap: wrap; }
      .brand-mark { width: 32px; height: 32px; border-radius: 10px; }
      .brand { min-height: 44px; }
      .brand-name { font-size: 14px; }
      .brand-caption { font-size: 12px; }
      .nav-links { gap: 4px 8px; flex-basis: 100%; }
      .nav-links a { min-height: 44px; min-width: 44px; padding: 0 8px; justify-content: center; font-size: 14px; }
      .top-action { display: none; }
      .hero { padding: 49px 0 30px; }
      .hero-grid { grid-template-columns: 1fr; gap: 29px; }
      .eyebrow, .section-kicker, .course-index { margin-bottom: 16px; font-size: 14px; }
      .section-kicker, .course-index { margin-bottom: 0; }
      h1 { font-size: clamp(39px, 10vw, 49px); line-height: 1.13; }
      h1 span { margin-top: 5px; }
      .hero-description { margin-top: 17px; font-size: 14px; line-height: 1.8; }
      .hero-actions { gap: 15px; margin-top: 22px; }
      .primary-action { min-height: 46px; padding-inline: 17px; }
      .progress-summary {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        column-gap: 16px;
        padding: 15px 0 0;
        border-top: 1px solid rgba(29,29,31,.08);
      }
      .progress-topline { display: contents; }
      .progress-label { grid-column: 1; align-self: end; }
      .progress-count { grid-column: 2; grid-row: 1 / span 2; font-size: 35px; }
      .progress-track { grid-column: 1; margin-top: 9px; max-width: 220px; }
      .progress-foot { grid-column: 1 / -1; margin-top: 8px; }
      .section { padding: 24px 0; }
      .section-heading { align-items: start; margin-bottom: 17px; }
      h2 { font-size: 23px; }
      .section-description { font-size: 14px; }
      .section-side-note { display: none; }
      .index-panel { padding: 21px 16px 17px; border-radius: 22px; }
      .index-panel-head { align-items: start; flex-direction: column; gap: 10px; margin-bottom: 22px; }
      .index-panel-head h2 { font-size: 22px; }
      .status-legend { gap: 13px; font-size: 14px; }
      .course-group + .course-group { margin-top: 22px; padding-top: 20px; }
      .group-heading { margin-bottom: 12px; }
      .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .course-card { min-height: 178px; padding: 13px 12px 12px; border-radius: 15px; }
      .course-card-top { align-items: flex-start; margin-bottom: 14px; }
      .course-status { font-size: 14px; }
      .course-icon { width: 34px; height: 34px; border-radius: 10px; }
      .course-icon svg { width: 18px; height: 18px; }
      .course-main { gap: 9px; }
      .course-name { font-size: 14px; }
      .course-subtitle { font-size: 14px; }
